<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I MISS U">
<meta name="format-detection" content="telephone=no">
<title>I MISS U</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}

:root{--bg:#F5F3EE;--ink:#1A1815;--ink2:#2B2620;--dim:#9A958B;--dim2:#B8B3A8;
  --line:#ECE8DF;--card:#FFF;--rose:#C97B6E;--acc:#6E7A6A;--onink:#F5F3EE;
  --i1:#48453E;--i2:#9A958B;--i3:#D1CCC2;
  --fldb:#E7E3DA;--ibx:#FBFAF7;--cbx:#2B2620;--cbxt:#F0EDE6;
  --tag3t:#A9736A;--tag4t:#6D7480;--tag2t:#65735A;
  --sd:rgba(43,38,30,.05);--sd2:rgba(43,38,30,.1);
  --gl:#EFEBE2;--tstb:rgba(255,255,255,.9);--tstt:#4A443C;--ovl:rgba(0,0,0,.2);
  --dr2:#F0ECE4;--dl:#E4DED4;--red:#C0564C;--red2:#B5514A;--gr:#8C9E7E;
  --edge:#F5F3EE;--pnl:#F7F5F1;
  --ln2:rgba(112,124,138,.18);--sel:rgba(112,124,138,.085);
  --sel2:rgba(112,124,138,.13);--bub:rgba(112,124,138,.105);
  --fl2:rgba(203,176,140,.26);
  --st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --kb:0px;--inset:17px;
  --min:"Hiragino Mincho ProN","Yu Mincho","Songti SC",serif}
html.dark{--bg:#16140F;--ink:#EAE5DA;--ink2:#DED8CC;--dim:#8B857A;--dim2:#6E6961;
  --line:#2A261F;--card:#1E1B16;--rose:#D48F80;--acc:#9CA795;--onink:#16140F;
  --i1:#C6C0B4;--i2:#8B857A;--i3:#4E483F;
  --fldb:#302B24;--ibx:#1B1813;--cbx:#0D0B08;--cbxt:#DDD7CB;
  --tag3t:#C08F84;--tag4t:#8A929E;--tag2t:#93A085;
  --sd:rgba(0,0,0,.32);--sd2:rgba(0,0,0,.5);
  --gl:#1D1A15;--tstb:rgba(48,44,37,.94);--tstt:#E6E1D6;--ovl:rgba(0,0,0,.55);
  --dr2:#231F1A;--dl:#332E27;--red:#D4736A;--red2:#D4736A;--gr:#7E8F70;
  --edge:#16140F;--pnl:#1B1813;
  --ln2:rgba(226,232,240,.14);--sel:rgba(226,232,240,.075);
  --sel2:rgba(226,232,240,.12);--bub:rgba(226,232,240,.09);
  --fl2:rgba(203,176,140,.17)}
html.hasbg{--ink2:#211D18;--dim:#7E7970;--dim2:#9C978D}
html.dark.hasbg{--ink2:#E6E0D4;--dim:#989286;--dim2:#7A756C}

button,input,textarea{font-family:inherit;font-size:16px;color:inherit;border:none;background:none}
textarea,input{-webkit-appearance:none;border-radius:0}
input[type=date]{color-scheme:light}
html.dark input[type=date]{color-scheme:dark;color:var(--ink2)}
.hide{display:none!important}
.nosel{-webkit-user-select:none;user-select:none}
.sa{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  overscroll-behavior:contain}
.sa::-webkit-scrollbar{width:0;display:none}
.pz{transition:transform .12s ease,opacity .12s ease}
.pz:active{transform:scale(.95);opacity:.75}
.vt{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;
  text-orientation:upright;-webkit-text-orientation:upright;font-family:var(--min)}

@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sldL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sldU{from{transform:translateY(100%)}to{transform:none}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shk{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(5px)}
  50%{transform:translateX(-2px)}}
@keyframes fl{0%{background:var(--fl2)}100%{background:transparent}}
@keyframes wdrop{from{transform:translateY(-100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 壁纸：画在 html 上，纱烧进底图 ── */
html.hasbg{background-repeat:no-repeat;background-position:center;
  background-size:cover;height:calc(100% + 96px)}
html.hasbg body{background:transparent!important;height:100%}
html.hasbg #root,html.hasbg #pg,html.hasbg #ms{background:transparent}
html.hasbg .mw .fg{display:none}

/* ── 启动 / 警告 ── */
#boot{position:fixed;inset:0;z-index:990;background:var(--bg);display:flex;
  align-items:center;justify-content:center}
#boot i{width:22px;height:22px;border-radius:50%;border:2px solid var(--dl);
  border-top-color:var(--rose);animation:spin .7s linear infinite}
#root{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#warn{flex:none;background:#B4453C;color:#FFF;
  padding:calc(var(--st) + 9px) 16px 11px;display:flex;align-items:center;
  gap:11px;animation:wdrop .3s ease both;z-index:50}
#warn .wt{flex:1;font-size:13px;line-height:1.5;font-weight:500}
#warn .wb{flex:none;background:rgba(255,255,255,.2);border-radius:14px;
  padding:7px 13px;font-size:13px;font-weight:600;color:#FFF}
#warn .wx{flex:none;width:26px;height:26px;opacity:.7;font-size:17px;
  line-height:26px;text-align:center}
html.warned .hd{padding-top:9px}

/* ── 锁屏 ── */
#lk{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--st) + 18px) 26px calc(var(--sb) + 24px);
  animation:fade .5s ease both}
html.hasbg #lk{background:transparent}
#lk.out{opacity:0;transition:opacity .4s ease;pointer-events:none}
#lk .jp{position:relative;font:400 32px/1 var(--min);letter-spacing:.22em;
  color:var(--ink2);text-indent:.22em}
#lk .en{margin-top:16px;font-size:10.5px;letter-spacing:.38em;
  color:var(--dim2);font-weight:500}
#dts{display:flex;gap:16px;margin:32px 0 28px}
#dts i{width:9px;height:9px;border-radius:50%;background:var(--dl);transition:.2s}
#dts i.on{background:var(--dim);transform:scale(1.25)}
#lk.er #dts{animation:shk .44s}
#pad{display:grid;grid-template-columns:repeat(3,84px);gap:19px 22px}
#pad button{height:84px;border-radius:50%;background:var(--card);
  font:300 30px/1 -apple-system;color:var(--ink2);
  box-shadow:0 1px 2px var(--sd),0 8px 20px -12px var(--sd2);
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,background .15s}
#pad button:active{transform:scale(.93);background:var(--dr2)}
#pad button.f{background:none;box-shadow:none}
html.hasbg #pad button{background:rgba(253,252,250,.46);
  border:1px solid rgba(255,255,255,.58)}
html.dark.hasbg #pad button{background:rgba(34,30,25,.5);
  border-color:rgba(255,255,255,.1)}
html.hasbg #pad button.f{background:none;border:0;box-shadow:none}

/* ── 页与头 ── */
#pg{flex:1;min-height:0;position:relative}
.vw{position:absolute;inset:0;display:flex;flex-direction:column;
  animation:fade .22s ease both}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:9px;padding:max(10px,calc(var(--st) - 3px)) calc(14px + var(--sr)) 9px
  calc(14px + var(--sl));position:relative;z-index:8}
.cb{width:40px;height:40px;flex:none;border-radius:50%;background:var(--card);
  border:1px solid var(--ln2);display:flex;align-items:center;
  justify-content:center;box-shadow:0 1px 2px var(--sd)}
.pill{height:40px;display:flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--ln2);border-radius:20px;padding:0 14px;
  box-shadow:0 1px 2px var(--sd);min-width:0}
.pill span{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.hdt{font-size:16px;font-weight:400;letter-spacing:.1em;font-family:var(--min)}
.pgw{flex:1;min-height:0;padding:2px calc(20px + var(--sr)) 24px
  calc(20px + var(--sl))}
.big{font:400 28px/1.2 var(--min);letter-spacing:.03em}
.sub{margin-top:5px;font-size:14px;color:var(--dim);font-family:var(--min)}

/* ── 消息区 ── */
.mw{flex:1;min-height:0;position:relative;overflow:hidden}
.mw .fg{position:absolute;left:0;right:0;height:22px;z-index:4;
  pointer-events:none}
.mw .fg.t{top:0;background:linear-gradient(var(--bg),transparent)}
.mw .fg.b{bottom:0;background:linear-gradient(transparent,var(--bg))}
#ms{position:absolute;inset:0;overflow-x:hidden;overflow-anchor:none;
  padding:12px calc(20px + var(--sr)) calc(16px + var(--kb))
  calc(20px + var(--sl))}
.gsep{display:flex;align-items:center;gap:12px;margin:4px 0 26px}
.gsep i{flex:1;height:1px;background:var(--dl);opacity:.4}
.gsep span{flex:none;display:inline-flex;align-items:baseline;gap:8px;
  font-size:10.5px;color:var(--dim2);letter-spacing:.04em}
.gsep span b{font-weight:400;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.gsep span s{text-decoration:none}

/* 一条消息：左 or 右，头像在自己那一侧 */
.m{margin-bottom:26px;display:flex;flex-direction:row;align-items:flex-start;
  gap:11px}
.m.nu{animation:up .3s ease both}
.m.cont{margin-top:-14px}
#ms>.m:last-child{margin-bottom:8px}
.mside{flex:none;width:34px;padding-top:2px}
.mav{width:34px;height:34px;border-radius:50%;overflow:hidden;
  background:var(--sel2);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px var(--ln2)}
.mav img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.86) contrast(.97)}
.mav i{font-style:normal;font-size:13.5px;color:var(--dim2);
  font-family:var(--min)}
.m.cont .mav{visibility:hidden;box-shadow:none}
.mbody{flex:1;min-width:0}
.mnm{font-size:11px;letter-spacing:.11em;color:var(--dim2);
  font-family:var(--min);margin:2px 0 7px;line-height:1}
.mnm s{display:block;text-decoration:none;margin-top:4px;font-size:10px;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;opacity:.82}
.m.me .mnm{text-align:right}
.m.cont .mnm{display:none}
.m .in{max-width:100%;min-width:0}
.m.me .in{display:block;text-align:right}

.bd{font-size:16px;line-height:1.72;letter-spacing:-.008em;word-break:break-word;
  white-space:pre-wrap;overflow-wrap:anywhere}
.m.me .bd{display:inline-block;width:auto;max-width:86%;background:var(--bub);
  border-radius:20px;padding:10px 15px;color:var(--ink2);text-align:left;
  vertical-align:top;line-height:1.62;box-sizing:border-box}
.m.me .bd.tight{padding:8px 14px;line-height:1.5;border-radius:18px}
.m.me .bd *{text-align:left}
.m.ai .bd{padding:0 1px;color:var(--ink2)}
.m.flash .bd{animation:fl 2.1s ease}
.bd.clip{max-height:330px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);
  mask-image:linear-gradient(180deg,#000 72%,transparent)}
.more{display:inline-block;margin-top:7px;font-size:12.5px;color:var(--dim);
  font-weight:500}
.sg{font-size:16px;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;
  color:var(--ink2);margin-bottom:13px}

/* 行内排版 */
.bd b,.sg b{font-weight:600}
.bd em,.sg em{font-style:italic}
.bd del,.sg del{opacity:.5}
.bd code,.sg code{background:var(--sel2);border-radius:5px;padding:1px 5px;
  font:13.5px ui-monospace,Menlo,monospace}
.bd a,.sg a{color:var(--tag4t);text-decoration:none;
  border-bottom:1px solid rgba(109,116,128,.3);overflow-wrap:anywhere}
.bd h4,.sg h4{margin:14px 0 7px;font-size:15px;font-weight:600;line-height:1.5;
  letter-spacing:.01em}
.bd h4:first-child,.sg h4:first-child{margin-top:2px}
.bd .li,.sg .li{display:flex;gap:8px;margin:3px 0;line-height:1.72}
.bd .li i,.sg .li i{flex:none;font-style:normal;color:var(--dim2);
  min-width:14px;font-variant-numeric:tabular-nums}
.bd .li span,.sg .li span{flex:1;min-width:0}
.bd .bq,.sg .bq{margin:9px 0;padding:1px 0 1px 12px;
  border-left:2px solid var(--dl);color:var(--dim)}
.bd .hr,.sg .hr{margin:15px 0;height:1px;background:var(--line)}
.bd .tb,.sg .tb{margin:10px 0;overflow-x:auto;font-size:13.5px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.bd .tb::-webkit-scrollbar{height:0;display:none}
.bd .tb table{border-collapse:collapse;min-width:100%}
.bd .tb td,.bd .tb th{border:1px solid var(--line);padding:6px 10px;
  text-align:left;white-space:nowrap}
.bd .tb th{font-weight:600;background:var(--sel)}

/* 代码卡片 */
.ccd{margin:10px 0;border-radius:12px;overflow:hidden;background:var(--cbx)}
.cch{display:flex;align-items:center;gap:16px;padding:8px 13px;font-size:11px;
  letter-spacing:.06em;color:rgba(255,255,255,.4);background:rgba(255,255,255,.055)}
.cch b{flex:1;font-weight:400;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.cch span{flex:none;color:rgba(255,255,255,.62)}
.cch span:active{opacity:.45}
.ccp{margin:0;padding:12px 14px;overflow-x:auto;white-space:pre;
  font:12.5px/1.62 ui-monospace,Menlo,Consolas,monospace;color:var(--cbxt);
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.ccp::-webkit-scrollbar{height:0;display:none}
.ccp.wr{white-space:pre-wrap;word-break:break-all}
.ccp .ck{color:#C792EA}.ccp .cs{color:#C3E88D}
.ccp .cc{color:#7C8493;font-style:italic}
.ccp .cn{color:#F78C6C}.ccp .cf{color:#82AAFF}
#crun{position:fixed;inset:0;z-index:9999;background:#000;display:flex;
  flex-direction:column}
#crun .rh{flex:none;display:flex;align-items:center;gap:12px;color:#fff;
  font-size:13px;padding:calc(var(--st) + 10px) 16px 10px;background:#1A1A1A}
#crun .rh b{flex:1;font-weight:400;opacity:.55;letter-spacing:.12em}
#crun .rh button{color:#fff;font-size:14px;opacity:.8}
#crun iframe{flex:1;width:100%;border:0;background:#fff}

/* 图片 / 文件 / PDF / 链接 */
.pic{display:inline-block;width:74px;height:74px;object-fit:cover;
  border-radius:13px;margin:0 6px 6px 0;vertical-align:top;background:var(--sel2)}
.m.me .pic{margin:0 0 6px 6px}
.gone{font-size:12px;color:var(--dim2);background:var(--gl);border-radius:11px;
  padding:7px 12px;margin-bottom:7px;display:inline-block}
.fcd{display:flex;align-items:center;gap:11px;margin:0 0 9px;padding:11px 13px;
  border-radius:13px;background:var(--sel2);max-width:100%;box-sizing:border-box}
.m.me .fcd{margin-left:auto}
.fcd .fi{flex:none;width:26px;height:26px;border-radius:7px;background:var(--cbx);
  color:var(--cbxt);font:600 9px/26px ui-monospace,Menlo,monospace;
  text-align:center;letter-spacing:.02em;overflow:hidden}
.fcd .fi.p{background:#B4453C;color:#fff}
.fcd .fx{flex:1;min-width:0}
.fcd .fx b{display:block;font-size:13px;font-weight:500;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcd .fx s{display:block;text-decoration:none;margin-top:2px;font-size:10.5px;
  color:var(--dim2);letter-spacing:.04em}
.ucd{display:inline-flex;align-items:center;gap:9px;max-width:100%;
  margin-bottom:8px;padding:8px 12px;border-radius:12px;background:var(--sel2);
  text-align:left;box-sizing:border-box}
.m.me .ucd{margin-left:auto}
.ucd b{font-size:12.5px;font-weight:500;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ucd i{flex:none;font-style:normal;font-size:10.5px;color:var(--dim2)}

/* 引用 / 思考 / 翻查 / 小字 */
.qt{border-left:2px solid var(--dl);padding:2px 0 2px 13px;max-width:100%;
  box-sizing:border-box;overflow:hidden;margin:2px 0 14px}
.qt .qh{font-size:11.5px;color:var(--dim2);font-weight:600;margin-bottom:6px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.qt .qh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.qt .qb{font-size:13.5px;line-height:1.7;color:var(--dim);white-space:pre-wrap;
  overflow-wrap:anywhere;word-break:break-word}
.thk{margin-bottom:11px}
.thk button{display:inline-flex;align-items:center;gap:6px;padding:1px 0;
  text-align:left}
.thk span{font-size:13px;color:var(--dim);max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.thk .nk{font-size:12.5px;color:var(--dim2);letter-spacing:.02em}
.wbx{margin-bottom:13px;border-left:1px solid var(--dl);padding:1px 0 1px 12px;
  overflow:hidden}
.wbx .wh{display:flex;align-items:center;gap:7px;font-size:11.5px;
  color:var(--dim2);font-weight:500;letter-spacing:.03em}
.wbx .wh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0}
.wbx .wh svg{opacity:.55}
.act{display:flex;align-items:baseline;gap:8px;margin-top:9px;font-size:11.5px;
  color:var(--dim2);line-height:1.7}
.act .ai2{color:var(--dim);font-weight:500;flex:none}
.ops{display:flex;align-items:center;gap:14px;margin-top:10px;opacity:.62}
.eo{display:flex;align-items:center;justify-content:flex-end;gap:11px;
  margin-top:4px;opacity:.55}
.eo button{width:25px;height:25px;display:flex;align-items:center;
  justify-content:center}
.nav{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim2);
  font-weight:600;font-variant-numeric:tabular-nums}
.nav button{width:20px;height:20px;display:flex;align-items:center;
  justify-content:center}
.nav button[disabled]{opacity:.28}
.err{margin-top:9px;font-size:12.5px;color:var(--red2);line-height:1.6}
.err button{color:var(--rose);font-weight:600;font-size:12.5px;margin-left:8px}
.typ{display:flex;gap:4px;padding:2px 0 4px;align-items:center}
.typ i{width:5px;height:5px;border-radius:50%;background:var(--dim2);
  animation:dots 1.4s ease-in-out infinite}
.typ i:nth-child(2){animation-delay:.15s}
.typ i:nth-child(3){animation-delay:.3s}
.typ span{margin-left:7px;font-size:12.5px;color:var(--dim2)}
.wm{position:sticky;top:46%;left:50%;transform:translate(-50%,-50%);width:0;
  height:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0}
.mfar{display:block;width:100%;margin:2px 0 24px;padding:10px 0;font-size:11.5px;
  letter-spacing:.12em;color:var(--dim2);text-align:center;font-family:var(--min)}
.m.far,.gsep.far{display:none}
.m.pick .mbody{position:relative;padding-left:30px}
.m.pick.me .mbody{padding-left:0;padding-right:30px}
.ck{position:absolute;top:2px;left:0;width:21px;height:21px;border-radius:50%;
  border:1.6px solid var(--dl);background:var(--ibx)}
.m.pick.me .ck{left:auto;right:0}
.m.on .ck{background:var(--ink);border-color:var(--ink)}
.m.on .ck:after{content:'';position:absolute;left:6px;top:5px;width:6px;height:9px;
  border-right:2px solid var(--onink);border-bottom:2px solid var(--onink);
  transform:rotate(40deg)}
#dn{position:absolute;right:calc(18px + var(--sr));bottom:calc(18px + var(--kb));
  width:36px;height:36px;border-radius:50%;background:var(--card);z-index:9;
  border:1px solid var(--ln2);box-shadow:0 4px 14px -4px var(--sd2);
  display:flex;align-items:center;justify-content:center;opacity:0;

var _db=null;
function dbOpen(){
  return new Promise(function(ok,no){
    if(_db)return ok(_db);
    var rq=indexedDB.open(DB,1);
    rq.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');

      if(!d.objectStoreNames.contains('pic'))d.createObjectStore('pic');};

      ok(_db);};
    rq.onerror=function(){no(rq.error);};});}
function tx(store,mode){
  return dbOpen().then(function(d){

function dbGet(store,k){
  return tx(store,'readonly').then(function(s){
    return new Promise(function(ok,no){
      var r=s.get(k);

      r.onerror=function(){no(r.error);};});});}

function today(){
  var n=new Date();
  return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function d0(t){
  var d=new Date(t);
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function pd(s){
  if(!s)return null;
  var p=String(s).split('-');
  return new Date(+p[0],+p[1]-1,+p[2]);}
function dayN(){var d=pd(D.start);return d?Math.floor((today()-d)/MS)+1:null;}
function nextAn(s){
  var d=pd(s);if(!d)return null;
  var t=today(),y=t.getFullYear();
  var n=new Date(y,d.getMonth(),d.getDate());
  if(n<t)n=new Date(y+1,d.getMonth(),d.getDate());
  return{days:Math.round((n-t)/MS)};}
function hm(ts){
  var d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'
    +String(d.getMinutes()).padStart(2,'0');}
function dlab(ts){
  var df=Math.round((d0(Date.now())-d0(ts))/MS),d=new Date(ts);
  if(df===0)return'今天';
  if(df===1)return'昨天';
  if(df===2)return'前天';
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
function dtl(ts){return dlab(ts)+' '+hm(ts);}
function tstamp(ts){

    ?hm(ts):(dlab(ts)+' '+hm(ts));}
function ago(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'刚刚';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时前';
  return dlab(ts);}
function dur(ms2){
  var h=Math.floor(ms2/3600000);
  if(h<1)return Math.max(1,Math.floor(ms2/60000))+' 分钟';
  if(h<24)return h+' 小时';
  var d=Math.floor(h/24),r=h%24;
  return d+' 天'+(r>=2?' '+r+' 小时':'');}
function hello(){

  if(h<11)return'早安';

function fmtMB(b){
  if(b<1024)return b+' B';
  if(b<1048576)return(b/1024).toFixed(0)+' KB';
  if(b<1073741824)return(b/1048576).toFixed(1)+' MB';
  return(b/1073741824).toFixed(2)+' GB';}
function stamp(){
  var d=new Date(),p=function(n){return String(n).padStart(2,'0');};

    +'-'+p(d.getHours())+p(d.getMinutes());}

var de=document.documentElement,BGDATA=null,_dk=-1,VEIL=0.12;
function isDark(){

function edgeColor(){
  var base=isDark()?[22,20,15]:[245,243,238];
  if(!D.bgOn||!D.bgc||D.bgc.length!==3)return'rgb('+base.join(',')+')';
  var a=(D.bgv==null?45:D.bgv)/100;

function bgLoad(){
  if(!D.bgOn){BGDATA=null;return Promise.resolve();}
  return dbGet('pic','__bg').then(function(r){
    if(!r||!r.d){D.bgOn=0;BGDATA=null;return;}
    BGDATA=r.d;
    if(D.bgc&&D.bgc.length===3)return;
    return new Promise(function(ok){
      bgSample(r.d,function(c){if(c)D.bgc=c;ok();});});
  },function(){});}
function bgPaint(){
  try{
    de.style.setProperty('--edge',edgeColor());
    if(!D.bgOn||!BGDATA){
      de.classList.remove('hasbg');
      de.style.removeProperty('background-image');
      de.style.removeProperty('background-color');
      return;}
    var a=(D.bgv==null?45:D.bgv)/100;
    a=a+VEIL*(1-a);
    var c=isDark()?'22,20,15':'248,246,242';
    var v='rgba('+c+','+(Math.round(a*1000)/1000)+')';
    de.style.backgroundImage=
      'linear-gradient('+v+','+v+'),url("'+BGDATA+'")';
    de.style.backgroundColor=edgeColor();
    de.classList.add('hasbg');
  }catch(e){}}
function bgSample(u,cb){
  var im=new Image();
  im.onerror=function(){cb(null);};
  im.onload=function(){
    try{
      var vw=Math.max(1,window.innerWidth||360);
      var vh=Math.max(1,window.innerHeight||640);
      var ar=vw/vh,iw=im.width,ih=im.height;
      if(!iw||!ih){cb(null);return;}
      var iar=iw/ih,sx,sy,sw,sh;
      if(iar>ar){sh=ih;sw=ih*ar;sx=(iw-sw)/2;sy=0;}
      else{sw=iw;sh=iw/ar;sx=0;sy=(ih-sh)/2;}
      var W=48,H=Math.max(6,Math.round(W/ar));
      var cv=document.createElement('canvas');cv.width=W;cv.height=H;
      var x=cv.getContext('2d');
      x.drawImage(im,sx,sy,sw,sh,0,0,W,H);
      var rows=Math.max(2,Math.round(H*0.05));
      var d=x.getImageData(0,H-rows,W,rows).data;
      var r=0,g=0,b=0,n=0;
      for(var i=0;i<d.length;i+=4){
        if(d[i+3]<8)continue;
        r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
      cb(n?[Math.round(r/n),Math.round(g/n),Math.round(b/n)]:null);
    }catch(e){cb(null);}};
  im.src=u;}
function bgReSample(){
  if(!D.bgOn||!BGDATA)return;
  bgSample(BGDATA,function(c){
    if(!c)return;
    var o=D.bgc;
    if(o&&o.length===3&&Math.abs(o[0]-c[0])<3
      &&Math.abs(o[1]-c[1])<3&&Math.abs(o[2]-c[2])<3)return;
    D.bgc=c;saveD();bgPaint();});}

  setTimeout(bgReSample,650);});

      navigator.share({files:[f]}).then(function(){mk();toast('存好了');},
        function(err){

function impFile(){

function takeIn(txt){
  var o;

  catch(e){toast('内容不是备份格式');return false;}
  if(!o||typeof o!=='object'){toast('这不像我们的备份');return false;}
  var nD,nL,nM,nP=null;
  if(o.v>=6&&o.D&&o.list){nD=o.D;nL=o.list;nM=o.msg||{};nP=o.pic||null;}
  else if(o.sess){
    nD=Object.assign({},o);delete nD.sess;
    nL=[];nM={};
    (o.sess||[]).forEach(function(s){
      var id=s.id||uid();
      nL.push({id:id,ti:s.ti||'对话',at:s.at||Date.now()});
      nM[id]=s.ms||[];});}
  else{toast('这不像我们的备份');return false;}
  toast('正在恢复…');
  RAWPUT=1;
  setTimeout(function(){RAWPUT=0;},30000);
  Promise.all([tx('msg','readwrite'),tx('pic','readwrite')]).then(function(st){
    st[0].clear();
    if(nP)st[1].clear();
    D=Object.assign(fresh(),nD);
    delete D.sess;
    SS=nL;MSG=nM;
    var jobs=[];
    if(nP)Object.keys(nP).forEach(function(k){
      jobs.push(dbPutRaw('pic',k,nP[k]));});
    norm();
    SVQ.d=1;SVQ.list=1;
    SS.forEach(function(s){SVQ[s.id]=1;});
    return Promise.all(jobs).then(doFlushP);
  }).then(function(){
    RAWPUT=0;
    toast('回来了');
    setTimeout(function(){location.reload();},700);
  },function(){RAWPUT=0;toast('恢复失败，文件可能太大');});

var PUNC=/[\s\u3000，。、！？；：…~,.!?;:「」『』（）()"'’“”\[\]【】\-—_·]/g;

function nrm(s){return String(s||'').toLowerCase().replace(PUNC,'');}
function bigr(s){
  var o=[],x=nrm(s),i;
  for(i=0;i<x.length-1;i++)o.push(x.substr(i,2));

function ovl(a,b){
  var A=bigr(a),B={},n=0;
  bigr(b).forEach(function(x){B[x]=(B[x]||0)+1;});
  A.forEach(function(x){if(B[x]>0){n++;B[x]--;}});
  return n;}
function simRate(a,b){
  var la=bigr(a).length,lb=bigr(b).length;
  if(!la||!lb)return 0;
  return ovl(a,b)/Math.max(4,Math.min(la,lb));}
function expand(w){
  var o=[w];
  SYN.forEach(function(g){if(g.indexOf(w)>=0)o=o.concat(g);});
  return o.filter(function(x,i,a){return a.indexOf(x)===i;});}

function parseDate(s){
  s=(s||'').replace(/\s/g,'');
  if(!s)return null;
  var t=today(),y=t.getFullYear(),m;
  if(/^(今天|today)$/i.test(s))return{a:d0(t),b:d0(t)+MS,lab:'今天'};
  if(/^昨天$/.test(s))return{a:d0(t)-MS,b:d0(t),lab:'昨天'};
  if(/^前天$/.test(s))return{a:d0(t)-2*MS,b:d0(t)-MS,lab:'前天'};
  if(/^(最近|近来|这几天)$/.test(s))
    return{a:d0(t)-2*MS,b:d0(t)+MS,lab:'最近几天'};
  if(/^前几天$/.test(s))return{a:d0(t)-6*MS,b:d0(t),lab:'前几天'};
  if(/^(刚才|刚刚)$/.test(s))
    return{a:Date.now()-3*3600000,b:Date.now()+60000,lab:'刚才'};
  m=s.match(/^(\d+)天前$/);
  if(m){var n=+m[1];return{a:d0(t)-n*MS,b:d0(t)-(n-1)*MS,lab:n+'天前'};}
  if(/^(这周|本周)$/.test(s)){
    var w=(t.getDay()+6)%7;
    return{a:d0(t)-w*MS,b:d0(t)+MS,lab:'这周'};}
  if(/^上周$/.test(s)){
    var w2=(t.getDay()+6)%7,bb=d0(t)-w2*MS;
    return{a:bb-7*MS,b:bb,lab:'上周'};}
  if(/^(这个月|本月)$/.test(s))
    return{a:new Date(y,t.getMonth(),1).getTime(),b:d0(t)+MS,lab:'这个月'};
  if(/^(上个月|上月)$/.test(s))
    return{a:new Date(y,t.getMonth()-1,1).getTime(),
      b:new Date(y,t.getMonth(),1).getTime(),lab:'上个月'};
  m=s.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){
    var d=new Date(+m[1],+m[2]-1,+m[3]);
    return{a:d0(d),b:d0(d)+MS,lab:dlab(d.getTime())};}
  m=s.match(/^(\d{4})[-\/年](\d{1,2})月?$/);
  if(m)return{a:new Date(+m[1],+m[2]-1,1).getTime(),
    b:new Date(+m[1],+m[2],1).getTime(),lab:m[1]+'年'+(+m[2])+'月'};
  m=s.match(/^(\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){
    var d2=new Date(y,+m[1]-1,+m[2]);
    if(d0(d2)>d0(t))d2=new Date(y-1,+m[1]-1,+m[2]);
    return{a:d0(d2),b:d0(d2)+MS,lab:dlab(d2.getTime())};}
  m=s.match(/^(\d{1,2})月$/);
  if(m){
    var mo=+m[1]-1,yy=y;
    if(mo>t.getMonth())yy=y-1;
    return{a:new Date(yy,mo,1).getTime(),
      b:new Date(yy,mo+1,1).getTime(),lab:(mo+1)+'月'};}
  m=s.match(/^(\d{4})年?$/);
  if(m){
    var y3=+m[1];
    if(y3>=2000&&y3<=2100)
      return{a:new Date(y3,0,1).getTime(),
        b:new Date(y3+1,0,1).getTime(),lab:y3+' 年'};}
  return null;}

/* 从一句话里挑出要找的那几个字 */
function grabKw(raw){
  var out=[];
  String(raw||'').replace(/[「『"'“”]([^」』"'“”\n]{1,20})[」』"'“”]/g,
    function(mm,inner){
      inner=inner.trim();
      if(inner&&out.indexOf(inner)<0)out.push(inner);
      return'';});
  String(raw||'')
    .replace(/[「『"'“”][^」』"'“”\n]{1,20}[」』"'“”]/g,' ')
    .replace(FRAME,' ')
    .split(PUNC).forEach(function(seg){
      seg=seg.trim();
      if(!seg)return;
      if(seg.length<=4){
        if(seg.length>=2&&out.indexOf(seg)<0)out.push(seg);
        return;}
      seg.split(CUTW).forEach(function(f){
        f=f.trim();
        if(f.length>=2&&out.indexOf(f)<0)out.push(f);});});
  out.sort(function(a,b){return b.length-a.length;});
  return out.slice(0,3);}

function splitQ(q){
  KWSHOW='';
  var s=String(q||'').trim();
  if(!s)return{dr:null,kw:[]};
  var whole=parseDate(s);
  if(whole)return{dr:whole,kw:[]};
  var dr=null,rest=s,m=s.match(DRE);
  if(m){
    var d=parseDate(m[0]);
    if(d){dr=d;rest=s.replace(m[0],' ');}}
  var raw=[];
  rest.split(/\s+/).filter(Boolean).forEach(function(p){
    var dd2=parseDate(p);
    if(dd2&&!dr)dr=dd2;else raw.push(p);});
  if(!raw.length)return{dr:dr,kw:[]};
  var body=raw.join(' ');
  if(dr){
    FRAME.lastIndex=0;
    var left=body.replace(FRAME,'').replace(PUNC,'').trim();
    if(left.length<2)return{dr:dr,kw:[]};}
  FRAME.lastIndex=0;
  var need=(nrm(body).length>8)||FRAME.test(body);
  FRAME.lastIndex=0;
  if(!need)return{dr:dr,kw:raw.slice(0,4)};
  var kw=grabKw(body);
  if(!kw.length)return{dr:dr,kw:raw.slice(0,4)};
  KWSHOW=kw.join(' ');
  return{dr:dr,kw:kw};}

function score(t,kw){
  if(!kw.length)return 1;
  var low=nrm(t),sc=0,got=0,exact=0;
  kw.forEach(function(w){
    var nw=nrm(w);
    if(!nw)return;
    var hit=0;
    if(low.indexOf(nw)>=0){hit=10;exact++;}
    else expand(w).forEach(function(x){
      var nx=nrm(x);
      if(nx!==nw&&nx.length>=2&&low.indexOf(nx)>=0)hit=Math.max(hit,4);});
    if(hit)got++;
    sc+=hit;});
  if(!got)return 0;
  if(SOFTQ)return sc+got*3;
  if(!KWSHOW&&got<kw.length)return 0;
  return sc+got*4+(exact===kw.length?6:0);}

function hlq(t,kw){
  var s=esc(t);
  (kw||[]).forEach(function(w){
    if(!w)return;
    try{
      var r=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      s=s.replace(r,function(x){return'<mark>'+x+'</mark>';});
    }catch(e){}});
  return s;}
function cut(t,kw,n){
  n=n||110;
  if(!t)return'';
  if(t.length<=n)return t;
  var p=-1;
  (kw||[]).forEach(function(w){
    if(p<0&&w){
      var i=t.toLowerCase().indexOf(w.toLowerCase());
      if(i>=0)p=i;}});
  if(p<0)return t.slice(0,n)+'…';
  var a=Math.max(0,p-30);
  return(a?'…':'')+t.substr(a,n)+(a+n<t.length?'…':'');}

    return b.sc-a.sc||b.m.ts-a.m.ts;});
  else res.sort(function(a,b){return b.m.ts-a.m.ts;});
  return res;}

  if(id)return memById(id);
  var hit=null;
  D.mems.forEach(function(m){
    if(!hit&&String(m.id||'').toLowerCase().slice(-c.length)===c)hit=m;});
  if(hit)return hit;
  if(/^[#A-Za-z0-9]+$/.test(raw))return null;
  if(raw.length<6)return null;
  var best=null,bs=0;
  D.mems.forEach(function(m){
    var r=simRate(m.t,raw);
    if(r>bs){bs=r;best=m;}});
  return bs>=0.5?best:null;}

  var best=null,bs=0,lt=String(t||'').length;

function pickMems(q){
  var ls=D.mems.slice();
  if(ls.length<=MEMCAP)return ls;
  var lk=[],rest=[],now=Date.now(),sc={};
  ls.forEach(function(m){(m.lock?lk:rest).push(m);});
  rest.forEach(function(m){
    var rel=q?ovl(m.t,q):0;
    var age=Math.max(0,1-(now-m.ts)/(120*MS));
    var warm=m.used?Math.max(0,1-(now-m.used)/(14*MS)):0;
    sc[m.id]=rel*6+(m.imp||2)*4+warm*3+age*5;});
  rest.sort(function(a,b){return sc[b.id]-sc[a.id];});
  return lk.concat(rest.slice(0,Math.max(0,MEMCAP-lk.length)));}

var UZ={m:'',in:0,hit:0,w:0,st:0};
function usages(s){
  var out=[],i=0,n=s.length;
  while(i<n){
    var a=s.indexOf('"usage"',i);
    if(a<0)break;
    var p=a+7;
    while(p<n&&/[\s:]/.test(s.charAt(p)))p++;
    if(s.charAt(p)!=='{'){i=a+7;continue;}
    var d=0,k=p,ok=0;
    for(;k<n;k++){
      var ch=s.charAt(k);
      if(ch==='{')d++;
      else if(ch==='}'){d--;if(!d){ok=1;break;}}}
    if(!ok)break;
    try{out.push(JSON.parse(s.slice(p,k+1)));}catch(e){}
    i=k+1;}
  return out;}
function eatUsage(txt){
  var us=usages(txt),r=0,w=0,i=0,got=0;
  us.forEach(function(u){
    var pd2=u.prompt_tokens_details;
    if(pd2&&pd2.cached_tokens!=null){
      r=Math.max(r,pd2.cached_tokens);got=1;}
    if(u.cache_read_input_tokens!=null){
      r=Math.max(r,u.cache_read_input_tokens);got=1;}
    if(u.prompt_cache_hit_tokens!=null){
      r=Math.max(r,u.prompt_cache_hit_tokens);got=1;}
    if(u.cache_creation_input_tokens!=null){
      w=Math.max(w,u.cache_creation_input_tokens);got=1;}
    if(u.input_tokens!=null){i=Math.max(i,u.input_tokens);got=1;}
    else if(u.prompt_cache_miss_tokens!=null){
      i=Math.max(i,u.prompt_cache_miss_tokens);got=1;}
    else if(u.prompt_tokens!=null){i=Math.max(i,u.prompt_tokens);got=1;}});
  if(!got||(i+r+w)===0){if(UZ.st===1)UZ.st=3;return;}
  if(r&&i>=r)i-=r;
  UZ.in+=i+r;UZ.hit+=r;UZ.w+=w;UZ.st=2;}
function errOf(chunk){
  var s=String(chunk||'');
  if(s.indexOf('"error"')<0&&s.indexOf('msg_err_')<0)return'';
  var m=s.match(/"error"\s*:\s*\{([\s\S]{0,400}?)\}/);
  if(m){
    var t=m[1].match(/"type"\s*:\s*"([^"]{0,60})"/);
    var g=m[1].match(/"message"\s*:\s*"([^"]{0,200})"/);
    var k=(t?t[1]:'')+' '+(g?g[1]:'');
    if(/overload|unavailable|capacity|busy/i.test(k))
      return'上游正忙，过一会儿再说一次。';
    if(/rate.?limit|too.?many/i.test(k))return'被限流了，等一下再试。';
    if(/quota|balance|insufficient|额度|余额/i.test(k))
      return'这个 key 的额度不够了。';
    return'上游报错：'+((g?g[1]:(t?t[1]:'没说原因'))).slice(0,80);}
  if(s.indexOf('"id":"msg_err_')>=0)return'上游返回了一个错误响应。';
  return'';}

function apiFetch(body){
  var an=(D.fmt!=='openai');
  var hd=an
    ?{'Content-Type':'application/json','x-api-key':D.apiKey,
      'anthropic-version':'2023-06-01'}
    :{'Content-Type':'application/json',
      'Authorization':'Bearer '+D.apiKey};
  if(an&&!NOTTL)hd['anthropic-beta']='extended-cache-ttl-2025-04-11';
  var ac=window.AbortController?new AbortController():null;
  ABORT=ac;
  function go2(b,tries){
    return fetch(D.apiUrl,{method:'POST',
      signal:ac?ac.signal:undefined,headers:hd,
      body:JSON.stringify(b)})
    .then(function(r){
      if(r.ok)return r;
      if((r.status!==400&&r.status!==422)||tries>=4)return r;
      return r.clone().text().then(function(t){
        var s=String(t),ch=0;
        if(b.stream_options
          &&/stream_options|unsupported|unrecognized/i.test(s)){
          delete b.stream_options;NOSU=1;APIF.su=1;ch=1;}
        if(/document|pdf|media_type/i.test(s)&&stripPdf(b)){
          NOPDF=1;APIF.pdf=1;ch=1;
          setTimeout(function(){
            toast('这家中转不收 PDF，记下了');},400);}
        if(/max_tokens|max output|too large|exceed/i.test(s)
          &&b.max_tokens){
          var mm=s.match(/(\d{3,6})/g),cap=0,j;
          if(mm)for(j=0;j<mm.length;j++){
            var v=parseInt(mm[j],10);
            if(v>=1024&&v<b.max_tokens&&(!cap||v>cap))cap=v;}
          if(!cap)cap=Math.max(1024,Math.floor(b.max_tokens/2));
          MTCAP=cap;APIF.mt=cap;
          b.max_tokens=cap;
          if(b.thinking&&b.thinking.type==='enabled')
            b.thinking.budget_tokens=
              Math.max(1024,Math.min(cap-1024,Math.round(cap*0.4)));
          ch=1;
          setTimeout(function(){
            toast('这家一次最多 '+cap+'，已经调下来了');},400);}
        if(/\bttl\b|extended-cache/i.test(s)&&!/cache_control/i.test(s)){
          if(dropCC(b,1)){
            NOTTL=1;APIF.ttl=1;
            delete hd['anthropic-beta'];ch=1;}}
        else if(/cache_control/i.test(s)){
          if(dropCC(b,0)){NOCC=1;APIF.cc=1;UZ.st=4;ch=1;}}
        if(b.thinking&&/think|budget/i.test(s)){delete b.thinking;ch=1;}
        if(b.temperature!=null&&b.temperature!==1
          &&/temperature/i.test(s)){b.temperature=1;ch=1;}
        if(!ch)return r;
        APIF.u=D.apiUrl;apifSave();
        return go2(b,tries+1);
      },function(){return r;});});}
  return go2(body,0);}

function peek(res,m){
  try{
    var c=res.clone();
    if(!c.body){
      c.text().then(function(t){
        eatUsage(t);
        if(!String(m.t||'').trim()&&!m.err){
          var e=errOf(t);
          if(e)m.err=e;}},function(){});
      return;}
    var rd=c.body.getReader(),dec=new TextDecoder();
    var head='',tail='';
    (function loop(){
      rd.read().then(function(x){
        if(x.done){eatUsage(head+'\n'+tail);return;}
        var s2=dec.decode(x.value,{stream:true});
        if(head.length<4096)head+=s2.slice(0,4096-head.length);
        tail+=s2;
        if(tail.length>24576)tail=tail.slice(-24576);
        if(!m.err){var e=errOf(s2);if(e)m.err=e;}
        loop();
      },function(){eatUsage(head+'\n'+tail);});})();
  }catch(e){}}

function pump(res,m,an,sid){

    return rd.read().then(function(r){
      if(r.done)return;

      bf=ls.pop();
      ls.forEach(function(ln){
        ln=ln.trim();

        var d=ln.slice(5).trim();
        if(!d||d==='[DONE]')return;
        var j;
        try{j=JSON.parse(d);}catch(e){return;}
        if(an){
          if(j.type==='content_block_delta'&&j.delta){
            if(j.delta.type==='text_delta')m.t+=(j.delta.text||'');
            else if(j.delta.type==='thinking_delta'&&wantK)
              m.k+=(j.delta.thinking||'');}
          else if(j.type==='error'&&j.error)
            m.err=j.error.message||'接口报错';
        }else{
          var c=(j.choices||[])[0];
          if(c&&c.delta){
            if(c.delta.content)m.t+=c.delta.content;
            if(c.delta.reasoning_content&&wantK)
              m.k+=c.delta.reasoning_content;}}});
      var s=S();
      if(!sid||(s&&s.id===sid)){

/* ══ 标记扫描：找最近的收尾，绝不越界 ══ */
var MKKEY=['查','展开','引用','记住','锁住','改','忘掉'];
function scanMarks(t){
  var s=String(t||''),out=[],i=0,n=s.length;
  while(i<n){
    var a=s.indexOf('[',i);
    if(a<0)break;
    var dbl=(s.charAt(a+1)==='[')?1:0;
    var j=a+1+dbl,k='',q;
    while(j<n&&/\s/.test(s.charAt(j)))j++;
    for(q=0;q<MKKEY.length;q++)
      if(s.substr(j,MKKEY[q].length)===MKKEY[q]){k=MKKEY[q];break;}
    if(!k){i=a+1;continue;}
    var p=j+k.length;
    while(p<n&&/\s/.test(s.charAt(p)))p++;
    var c=s.charAt(p);
    if(c!==':'&&c!=='：'){i=a+1;continue;}
    p++;
    var e=s.indexOf(']',p),b,v;
    if(e<0){
      var nl=s.indexOf('\n',p);
      b=(nl<0?n:nl);
      v=s.slice(p,b);
    }else{
      v=s.slice(p,e);
      b=(s.charAt(e+1)===']')?e+2:e+1;}
    v=v.trim();
    out.push({k:k,v:(v&&v.length<=3000)?v:'',a:a,b:b});
    i=b;}
  return out;}
function findMarks(t){
  var o=[];
  scanMarks(t).forEach(function(x){
    if(!x.v)return;
    if(x.k==='展开'){
      var g=x.v.match(/[|｜]\s*(\d{1,2})/);
      OPENW=g?Math.max(1,Math.min(20,parseInt(g[1],10)||5)):5;}
    o.push({k:x.k,v:x.v});});
  return o;}
function stripMarks(t){
  var s=String(t||''),o='',pos=0;
  scanMarks(s).forEach(function(x){o+=s.slice(pos,x.a);pos=x.b;});
  o+=s.slice(pos);
  return o.replace(/\[\[[^\[\]\n]{0,80}\]\]/g,'')
    .replace(/\[\[[^\[\]\n]{0,30}$/,'')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n').trim();}
function splitCat(v){
  var i=Math.max(v.lastIndexOf('|'),v.lastIndexOf('｜'));
  if(i>0){
    var c=v.slice(i+1).trim();
    if(c&&c.length<=8&&!/["'\\<>]/.test(c))
      return{t:v.slice(0,i).trim(),c:c};}
  return{t:v,c:''};}

function lookAdd(q){

/* ══ 引用 ══ */
function quotePart(v){
  var n=parseInt(String(v).replace(/[^0-9]/g,''),10);
  if(!n)return null;
  var p=LOOKMAP[n];
  if(!p)return null;
  var arr=MSG[p.sid]||[],s=sessById(p.sid),mm=arr[p.i];
  if(!mm||mm.sys||!alive(mm))return null;
  var a=Math.max(0,p.i-1),b=Math.min(arr.length-1,p.i+1),ls=[],j,x,t;
  for(j=a;j<=b;j++){
    x=arr[j];
    if(!x||x.sys||!alive(x)||x.r==='gap'||x.r==='quote')continue;
    t=String(fullT(x)||'').replace(/\s+/g,' ').trim()||picWord(x);
    if(!t)continue;
    ls.push((x.r==='me'?D.me:D.you)+'：'+t.slice(0,240));}
  if(!ls.length)return null;
  return{ty:'q',sid:p.sid,mid:mm.id,
    from:(s?(s.ti||'对话'):'对话')+' · '+dlab(mm.ts),
    t:ls.join('\n')};}
function applyQuotes(m,raw){
  var qs=scanMarks(raw).filter(function(x){
    return x.k==='引用'&&x.v;});
  if(!qs.length)return 0;
  var pos=0,segs=[],n=0;
  qs.forEach(function(x){
    if(n>=2)return;
    var q=quotePart(x.v);
    if(!q)return;
    n++;
    segs.push({ty:'t',t:stripMarks(raw.slice(pos,x.a))});
    segs.push(q);
    pos=x.b;});
  if(!n)return 0;
  m.parts=m.parts||[];
  segs.forEach(function(sg){
    if(sg.ty==='t'&&!String(sg.t||'').trim())return;
    m.parts.push(sg);});
  m.t=stripMarks(raw.slice(pos));

/* ══ 动作执行 ══ */
function runActs(m,after,q,sid){
  var raw=m.t||'';
  if(m.err){m.t=stripMarks(raw);return 0;}
  if(raw.indexOf('[')<0&&!(m.parts&&m.parts.length)){
    m.t=stripMarks(raw);return 0;}
  var quoted=0;
  if(D.acts){
    try{quoted=applyQuotes(m,raw);}
    catch(e){keepErr('引用',e);quoted=0;}}
  if(!quoted)m.t=stripMarks(raw);
  if(!D.acts)return 0;

  var mk=findMarks(raw),acts=[],touched=0,nEd=0,jobs=[];
  var first=!(m.lkn||0);
  function okCat(c){
    if(!c)return'';
    if(/["'\\<>]/.test(c))return'';
    return c.slice(0,8);}
  mk.forEach(function(x){
    if(x.k==='引用')return;

    if(x.k==='查'||x.k==='展开'){
      if(!first||jobs.length>=QMAX)return;
      if(x.k==='查'){
        var k=nrm(x.v),dup=0;
        if(!k)return;
        jobs.forEach(function(j){
          if(j.k==='查'&&nrm(j.v)===k)dup=1;});
        if(!dup)jobs.push({k:'查',v:x.v});
      }else{
        var n=parseInt(x.v,10);
        if(n>0)jobs.push({k:'展开',v:n});}
      return;}

    if(x.k==='忘掉'){
      if(nEd>=3)return;
      var tg=memByCode(x.v);
      if(!tg||tg.lock)return;
      D.mems=D.mems.filter(function(y){return y.id!==tg.id;});
      acts.push({s:'forget',t:tg.t});touched=1;nEd++;
      return;}

    if(x.k==='改'){
      if(nEd>=3)return;
      var em=String(x.v).match(
        /^\s*[#]?([A-Za-z0-9]{2,12})\s*[|｜:：]\s*([\s\S]+)$/);
      if(!em)return;
      var t2=memByCode(em[1]);
      if(!t2||t2.lock)return;
      var nv=splitCat(String(em[2]).trim());
      if(!nv.t)return;
      var was=t2.t||'';
      t2.t=nv.t.slice(0,200);
      var c2=okCat(nv.c);
      if(c2)t2.cat=c2;
      t2.ts=Date.now();
      if(t2.t!==was)acts.push({s:'edit',t:t2.t});
      touched=1;nEd++;
      return;}

    /* 记住 / 锁住 */
    var lock=(x.k==='锁住');
    var sc=splitCat(x.v);
    if(!sc.t)return;
    var txt=sc.t.slice(0,200),cat=okCat(sc.c);
    var dp=dupOf(txt);
    var tgt=dp?dp.m:null;
    if(tgt){
      var oldT=tgt.t||'';
      if(txt.length>=oldT.length*0.6)tgt.t=txt;
      if(lock)tgt.lock=1;
      if((lock?3:2)>(tgt.imp||2))tgt.imp=lock?3:2;
      if(cat)tgt.cat=cat;
      tgt.ts=Date.now();
      acts.push({s:(tgt.t!==oldT?'edit':'mem'),t:tgt.t});
      touched=1;
      return;}
    addMem(txt,cat,lock?3:2,'ai',
      {sid:sid||S().id,mid:m.id},lock);
    acts.push({s:'mem',t:txt});touched=1;});

  if(acts.length)m.acts=(m.acts||[]).concat(acts);
  if(touched)saveD();
  PENDQ=[];

  if(!jobs.length){
    if(realT(m))return 0;
    if((m.fx||0)>=1)return 0;
    if(!(m.parts&&m.parts.length))return 0;
    m.fx=1;
    return nextRound(m,after,q,sid,'翻完了。直接对她说话。');}

  m.parts=m.parts||[];
  if(m.t&&m.t.trim())m.parts.push({ty:'t',t:m.t});
  var said=realT(m),got=0,blanks=[];
  jobs.forEach(function(job){
    var r;
    if(job.k==='查'){
      r=lookAdd(job.v);
      if(r.empty)blanks.push(r.raw);}
    else r=openAdd(job.v);
    got+=(r.n||0);
    m.parts.push({ty:'look',q:r.lab,n:r.n});});
  m.lkn=1;

  function fire(){
    return nextRound(m,after,q,sid,
      (got?'翻到的在上面。':'没翻到。别编，不知道就直接问她。')
      +(said?'接着往下说。':'你还没开口，这轮说点什么。'));}

  /* 翻空了，让杂活模型换个说法再翻一次 */
  if(!got&&blanks.length&&D.apiUrl&&D.apiKey){
    m.st=1;m.wst=1;BUSY=true;
    saveS(sid||S().id);
    if(CV==='chat'){paint();btn();}
    utilWords(blanks[0]).then(function(alt){
      var used='';
      alt.forEach(function(w){
        if(used||!w)return;
        var k2=nrm(w);
        if(LOOKSEEN[k2])return;
        var r2=lookAdd(w);
        if(r2.n){
          used=r2.lab;got+=r2.n;
          m.parts.push({ty:'look',q:r2.lab,n:r2.n});}});
      m.wst=0;
      if(CV==='chat')paint();
      fire();
    },function(){
      m.wst=0;
      if(CV==='chat')paint();
      fire();});
    return 1;}
  return fire();}

function grabUrl(s){
  var out=[],re=/https?:\/\/[^\s<>"'，。、！？）)】]+/g,m;
  while((m=re.exec(String(s||'')))){
    var u=m[0].replace(/[.,;:!?。，、）)】]+$/,'');
    if(u.length>10&&out.indexOf(u)<0)out.push(u);
    if(out.length>=PGN)break;}
  return out;}
function readOne(u,cb){
  var c=PC[u];
  if(c&&Date.now()-c.ts<30*60000){cb(c);return;}
  var fired=0;
  function once(o){if(fired)return;fired=1;cb(o);}
  setTimeout(function(){once(null);},PGWAIT);
  var h={'X-Return-Format':'markdown'};
  if(D.jkey)h['Authorization']='Bearer '+D.jkey;
  fetch('https://r.jina.ai/'+u,{headers:h})
  .then(function(r){
    if(!r.ok)throw new Error('x');
    return r.text();})
  .then(function(t){
    var s=String(t||'').replace(/\r/g,'')
      .replace(/\n{3,}/g,'\n\n').trim();
    if(s.length<40){once(null);return;}
    var tm=s.match(/^Title:\s*(.+)$/m);
    var o={u:u,t:(tm?tm[1]:u).slice(0,70),
      body:s.slice(0,PGMAX),cut:s.length>PGMAX,ts:Date.now()};
    PC[u]=o;
    var ks=Object.keys(PC);
    if(ks.length>8)delete PC[ks[0]];
    once(o);
  },function(){once(null);});}
function readPages(q){
  var us=grabUrl(q);

  if(!us.length)return Promise.resolve(null);
  return new Promise(function(ok){
    var got=[],n=0,fired=0;
    function fin(){
      if(fired)return;fired=1;
      if(got.length)
        PAGETXT=WALL+got.map(function(x){
          return'〔'+x.t+'〕\n'+x.u+'\n'+tame(x.body)
            +(x.cut?'\n…（后面截断了）':'');}).join('\n\n');
      ok(got.map(function(x){return{u:x.u,t:x.t};}));}
    setTimeout(fin,PGWAIT+1500);
    us.forEach(function(u){
      readOne(u,function(o){
        if(o)got.push(o);
        if(++n>=us.length)fin();});});});}

var KW=/\b(var|let|const|function|return|if|else|elif|for|while|new|this|try|catch|finally|throw|typeof|instanceof|class|extends|import|from|export|default|async|await|yield|switch|case|break|continue|delete|in|of|def|lambda|pass|with|as|not|and|or|is|None|True|False|print|null|true|false|undefined|self)\b/g;
var HC={},HQ=[];
function pkey(n){
  var s='';n++;
  while(n>0){s+=String.fromCharCode(97+n%26);n=Math.floor(n/26);}
  return s;}
function hl(code){
  var t=esc(code),map={},n=0;
  function keep(c,s){
    var k='\u0001'+pkey(n++)+'\u0001';
    map[k]='<i class="'+c+'">'+s+'</i>';
    return k;}
  t=t.replace(/(&quot;|&#39;)(?:\\[\s\S]|(?!\1)[\s\S])*?\1/g,
    function(m){return keep('cs',m);});
  t=t.replace(/`[^`\n]*`/g,function(m){return keep('cs',m);});
  t=t.replace(/\/\*[\s\S]*?\*\//g,function(m){return keep('cc',m);});
  t=t.replace(/\/\/[^\n]*/g,function(m){return keep('cc',m);});
  t=t.replace(/#[^\n]*/g,function(m){return keep('cc',m);});
  t=t.replace(KW,'<i class="ck">$1</i>');
  t=t.replace(/\b\d+(?:\.\d+)?\b/g,'<i class="cn">$&</i>');
  t=t.replace(/([A-Za-z_$][\w$]*)(\s*\()/g,'<i class="cf">$1</i>$2');
  return t.replace(/\u0001[a-z]+\u0001/g,function(k){return map[k]||k;});}
function hlc(c){
  if(c.length>20000)return esc(c);
  if(HC[c]!=null)return HC[c];
  var r;
  try{r=hl(c);}catch(e){r=esc(c);}
  HC[c]=r;HQ.push(c);
  if(HQ.length>12)delete HC[HQ.shift()];
  return r;}
var RUNOK=/^(html|htm|xml|svg|js|javascript|jsx|mjs)$/;
function codeCard(lang,code,open){
  var L=String(lang||'').trim().toLowerCase();
  var h='<div class="ccd"><div class="cch"><b>'+esc(L||'code')+'</b>';
  if(!open){
    if(RUNOK.test(L))h+='<span data-a="run">运行</span>';
    h+='<span data-a="wrap">换行</span><span data-a="copy">复制</span>';}
  return h+'</div><pre class="ccp"><code>'
    +(open?esc(code):hlc(code))+'</code></pre></div>';}
function inl(s){
  var t=esc(s);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
  t=t.replace(/\[([^\]\n]{1,80})\]\((https?:\/\/[^\s)]{1,300})\)/g,
    function(m,a,b){
      return'<a href="'+b+'" target="_blank" rel="noreferrer">'+a+'</a>';});
  t=t.replace(/(^|[\s（(])(https?:\/\/[^\s<（）)]{4,300})/g,
    function(m,p,u){
      if(/["'=]$/.test(p))return m;
      return p+'<a href="'+u+'" target="_blank" rel="noreferrer">'
        +u+'</a>';});
  return t;}
function cells(l){
  return l.replace(/^\s*\|?/,'').replace(/\|?\s*$/,'').split('|')
    .map(function(x){return x.trim();});}
function render(src){
  var ls=String(src==null?'':src).split('\n'),out=[],buf=[],i;
  function flush(){
    if(!buf.length)return;
    out.push(inl(buf.join('\n')));
    buf=[];}
  for(i=0;i<ls.length;i++){
    var l=ls[i],m;
    /* 代码块 */
    m=l.match(/^\s{0,3}```([A-Za-z0-9+#._-]*)\s*$/);
    if(m){
      flush();
      var lang=m[1],body=[],closed=0;
      i++;
      while(i<ls.length){
        if(/^\s{0,3}```\s*$/.test(ls[i])){closed=1;break;}
        body.push(ls[i]);i++;}
      out.push(codeCard(lang,body.join('\n'),closed?0:1));
      continue;}
    if(/^\s{0,3}(\*\s*){3,}$/.test(l)||/^\s{0,3}(-\s*){3,}$/.test(l)
      ||/^\s{0,3}(_\s*){3,}$/.test(l)){
      flush();out.push('<div class="hr"></div>');continue;}
    m=l.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
    if(m){
      flush();
      out.push('<h4>'+inl(m[2].replace(/\s*#+\s*$/,''))+'</h4>');
      continue;}
    m=l.match(/^\s{0,3}>\s?(.*)$/);
    if(m){
      flush();
      var q=[m[1]];
      while(i+1<ls.length){
        var n2=ls[i+1].match(/^\s{0,3}>\s?(.*)$/);
        if(!n2)break;
        q.push(n2[1]);i++;}
      out.push('<div class="bq">'+inl(q.join('\n'))+'</div>');
      continue;}
    m=l.match(/^\s{0,4}[-*•+]\s+(.+)$/);
    if(m){
      flush();
      out.push('<div class="li"><i>·</i><span>'+inl(m[1])+'</span></div>');
      continue;}
    m=l.match(/^\s{0,4}(\d{1,3})[.、)]\s+(.+)$/);
    if(m){
      flush();
      out.push('<div class="li"><i>'+m[1]+'.</i><span>'
        +inl(m[2])+'</span></div>');
      continue;}

/* 周期推进 */
function btick(now,silent){
  var B=bd();
  if(!B)return;
  if(!B.tk)B.tk=now;
  if(now<=B.tk)return;
  var seg=0;
  while(B.tk<now&&seg<MAXSEG){
    seg++;
    var nx=Math.min(now,B.tk+MAXTICK*3600000);
    var el=(nx-B.tk)/3600000,k;
    if(B.ek&&B.ee&&nx>=B.ee&&EV[B.ek]){
      var de=CAT[EV[B.ek].c].e;
      for(k in de)B.v[k]=bcl(k,(B.v[k]||0)+de[k]);
      B.cool[B.ek]=B.ee;B.last=B.ek;B.lastEnd=B.ee;
      B.ek='';B.ee=0;}
    if(nx>=B.ce){
      var key=(B.cy==='ebb'&&(B.v.fatigue||0)>=70)
        ?'recovery':CY[B.cy].nx;
      var c0=CY[key]||CY.stable;
      B.cy=key;B.cs=nx;B.ce=nx+rnd(c0.h[0],c0.h[1])*3600000;
      bnote(B,c0.n);}
    var c=CY[B.cy];
    B.v.reserve=bcl('reserve',(B.v.reserve||0)+c.g*el);
    var K={heat:0.18,pressure:0.14,sensitivity:0.12,
      control:0.16,possessiveness:0.10};
    for(var f in K){
      var tg=c.t[f];
      if(tg==null)continue;
      B.v[f]=bcl(f,(B.v[f]||0)+(tg-(B.v[f]||0))*K[f]*Math.min(1,el/6));}
    var ft=c.t.fatigue||0;
    if((B.v.fatigue||0)>ft){
      var sp=silent>=360?0.30:(silent>=120?0.22:(silent>=30?0.16:0.12));
      B.v.fatigue=bcl('fatigue',
        B.v.fatigue+(ft-B.v.fatigue)*sp*Math.min(1,el/6));}
    if(B.ek&&EV[B.ek]){
      var td=CAT[EV[B.ek].c].t;
      for(k in td)B.v[k]=bcl(k,(B.v[k]||0)+td[k]*el);}
    if(silent>=30){
      var pp=silent>=120?2.0:(silent>=60?1.5:0.8);
      var po=silent>=120?0.9:(silent>=60?0.6:0.3);
      B.v.pressure=bcl('pressure',B.v.pressure+pp*el);
      B.v.possessiveness=bcl('possessiveness',
        B.v.possessiveness+po*el);
      if(silent>=120)
        B.v.control=bcl('control',B.v.control-0.6*el);}
    B.tk=nx;}
  saveD();}

function bpick(now,silent,hit){
  var B=bd();
  if(!B)return;
  if(B.ek&&B.ee&&now<B.ee)return;
  if(B.rf&&now<B.rf&&(B.rp||0)<2)return;
  if(B.ck&&now-B.ck<CHECKMIN*60000)return;
  B.ck=now;
  var v=B.v,cy=B.cy,h=hrNow(),cand=[],sens=(cy==='sensitive');
  function add(k,p){
    if(WIN[k]&&!inWin(WIN[k],h))return;

    if(t&&(now-t)<(CD[k]||4)*3600000)return;
    if(Math.random()<p*(sens?1.1:1))cand.push(k);}
  if(v.heat>=45||cy!=='stable')
    add('morning_arousal',(cy==='preheat'||sens)?0.75:0.45);
  if(silent>=30&&(v.reserve>=55||v.heat>=60))
    add('night_heat',sens?0.6:0.3);
  if(sens&&(v.heat>=75||v.reserve>=70))add('cycle_surge',0.5);
  if(v.heat>=70&&v.control>=35)add('holding_back',0.7);
  if(sens||(v.heat>=65&&v.pressure>=55))add('demanding',0.35);
  if(v.possessiveness>=60&&(silent>=60||sens))
    add('marking_impulse',0.4);
  if(v.fatigue>=35||v.possessiveness>=55)add('nesting',0.3);
  if(v.control<=35&&(v.heat>=70||v.pressure>=70))
    add('control_slip',0.6);
  if((sens||cy==='ebb'||cy==='recovery')
    &&v.sensitivity>=60&&v.fatigue<=75)add('closeness_hunger',0.35);
  if(sens)add('pheromone_disorder',0.3);
  if(silent>=60&&silent<=180&&(v.pressure>=55||v.possessiveness>=60))
    add('waiting_restless',0.3);
  if(v.sensitivity>=60&&v.heat>=45&&v.heat<70)
    add('low_fever_cling',0.3);
  if(v.reserve>=70&&B.lastEnd&&now-B.lastEnd>=8*3600000)
    add('restraint_rebound',0.25);
  if(B.last&&STRONG[B.last]&&B.lastEnd&&now-B.lastEnd<=3*3600000)
    add('scent_aftereffect',0.6);
  else if(cy==='ebb')add('scent_aftereffect',0.4);
  if(hit)add('voice_or_name_trigger',0.25);
  if(B.miss&&now-B.miss>=30*60000&&now-B.miss<=180*60000
    &&(v.heat>=55||v.pressure>=55))add('delayed_heat',0.35);
  if(!cand.length){
    if(v.heat>=65||v.pressure>=65){
      B.miss=now;
      if(Math.random()<0.25)add('strange_calm',1);}
    if(!cand.length){saveD();return;}}
  var best='',bi=99;
  cand.forEach(function(k){
    var i=PRI.indexOf(k);
    if(i>=0&&i<bi){bi=i;best=k;}});
  if(!best){saveD();return;}
  var e=EV[best];
  B.ek=best;B.ee=now+rnd(e.m[0],e.m[1])*60000;
  B.miss=0;
  bnote(B,e.n);
  saveD();}

/* 事后 */
function bafter(B,mild){
  var now=Date.now();
  B.rn=(B.rt&&now-B.rt<6*3600000)?Math.min(4,(B.rn||1)+1):1;
  B.rt=now;B.rp=0;
  var n=rn(B),base=(n===1?(mild?35:60):(n===2?110:210));
  B.rf=now+(base+Math.random()
    *(n===1?(mild?25:45):(n===2?80:160)))*60000;
  if(B.ek){B.cool=B.cool||{};B.cool[B.ek]=now;}
  B.ek='';B.ee=0;
  var c=RCAP2[n-1];
  B.v.heat=Math.min(B.v.heat||0,c.h-6);
  B.v.pressure=Math.min(B.v.pressure||0,c.p-6);
  B.v.sensitivity=Math.min(B.v.sensitivity||0,c.s);
  B.v.reserve=Math.min(B.v.reserve||0,c.r-8);
  B.v.control=Math.max(B.v.control||0,c.c);
  B.v.possessiveness=bcl('possessiveness',
    (B.v.possessiveness||0)-7);
  B.v.fatigue=bcl('fatigue',
    (B.v.fatigue||0)+(mild?6:10)+(n-1)*7);
  if(n>=2)bnote(B,n>=3?'三回目':'二回目');
  if(B.cy!=='recovery'){
    B.cy=(B.v.fatigue>=68)?'recovery':'ebb';
    B.cs=now;

    bnote(B,CY[B.cy].n);}}

function bsane(B){

    if((B.v.heat||0)>c.h){B.v.heat=c.h;d=1;}
    if((B.v.pressure||0)>c.p){B.v.pressure=c.p;d=1;}
    if((B.v.sensitivity||0)>c.s){B.v.sensitivity=c.s;d=1;}
    if((B.v.reserve||0)>c.r){B.v.reserve=c.r;d=1;}

function bnorm(r){
  var B=bd(),o={},res=String(r.settlement_result||''),now=Date.now();
  if(!ROK[res])res='neutral';
  var ej=(r.ejaculated===true||r.ejaculated==='true');
  if(res==='released')ej=true;
  if(ej&&res==='neutral')res='released';
  if(ej&&B.rf&&now<B.rf){
    if(rn(B)>=3){ej=false;res='interrupted';}
    else if((B.rp||0)<2){ej=false;res='cooled_down';}}
  function n_(x){var n=parseInt(x,10);return isNaN(n)?0:n;}
  ['heat','pressure','control','sensitivity',
   'possessiveness','fatigue'].forEach(function(k){
    o[k]=Math.max(-LIMIT,Math.min(LIMIT,n_(r[k+'_delta'])));});
  var rv=n_(r.reserve_delta);
  if(!ej)rv=Math.max(0,Math.min(4,rv));
  else if(B.cy==='stable'||B.cy==='recovery')
    rv=Math.max(-10,Math.min(-6,rv>0?-8:rv));
  else rv=Math.max(-7,Math.min(-4,rv>0?-5:rv));
  o.reserve=rv;
  if(ej){
    if(o.fatigue<2)o.fatigue=2;
    if(o.heat>-2)o.heat=-2;
    if(o.pressure>-2)o.pressure=-2;}
  return{res:res,ej:ej,
    why:String(r.settlement_reason||'').slice(0,40),d:o};}

  if(B.ek&&B.ee&&now<B.ee&&EV[B.ek])
    h+=bone(EV[B.ek].n,lft(B.ee-now),EV[B.ek].p);
  if(B.x&&now<B.x.e&&EX[B.x.k])
    h+=bone(EX[B.x.k][0],lft(B.x.e-now),EX[B.x.k][1]);
  BORD.forEach(function(k){
    var v=B.v[k]||0,w=WORD[k][blv(v)];
    if(!w)return;
    var fl=FLOOR[k]||0;
    var pct=Math.max(3,Math.round((v-fl)/(100-fl)*100));
    var hi=(k==='control'||k==='fatigue')?0:(v>=60?1:0);
    h+='<div class="br'+(hi?' hi':'')+'">'
     +'<div class="bl"><em>'+LBL[k]+'</em>'
     +'<u><i style="width:'+pct+'%"></i></u></div>'
     +'<div class="bw">'+esc(w)+'</div></div>';});
  if(B.set){
    var x=B.set;
    h+='<div class="bkv"><div class="k">直前</div>'
     +'<div class="v">'+esc(RES[x.res]||x.res)
     +'<u>'+hm(x.ts)+'</u></div>'
     +(x.why?'<div class="r">'+esc(x.why)+'</div>':'')
     +(bds(x.d)?'<div class="n">'+esc(bds(x.d))+'</div>':'')
     +'</div>';}
  var lg=(B.log||[]).slice(-6).reverse();
  if(lg.length){
    h+='<div class="bkv"><div class="k" style="margin-bottom:8px">'
     +'これまで</div>';
    lg.forEach(function(e){
      h+='<div class="e">'+hm(e.ts)+'　<span>'
       +esc(e.n)+'</span></div>';});
    h+='</div>';}
  h+='<div class="bof"><button class="pz" onclick="bodyStop()">'
   +'とじる</button></div></div>';
  return h;}
