<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#F5F3EE;color:#1A1815;font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
:root{--bg:#F5F3EE;--ink:#1A1815;--ink2:#2B2620;--dim:#9A958B;--dim2:#B8B3A8;

  --pb:max(5px,calc(var(--sb) - 16px));--inset:17px}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit;border:none;background:none}
textarea,input{-webkit-appearance:none;border-radius:0}
.hide{display:none!important}
.sa{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.sa::-webkit-scrollbar{width:0;display:none}
.pz{transition:transform .12s ease,opacity .12s ease}
.pz:active{transform:scale(.94);opacity:.75}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sldL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sldU{from{transform:translateY(100%)}to{transform:none}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shk{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-2px)}}

#root{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#lk{position:fixed;inset:0;z-index:900;background:#F5F3EE;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:calc(var(--st) + 32px) 26px 14px;animation:fade .5s ease both}
#lk:before{content:'';position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(#EFEBE2,rgba(245,243,238,0));pointer-events:none}
#lk.out{opacity:0;transition:opacity .4s ease;pointer-events:none}
#lk .jp{position:relative;font:400 33px/1 "Hiragino Mincho ProN","Yu Mincho","Songti SC",serif;
  letter-spacing:.2em;color:#2B2620;text-indent:.2em}

  display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}

#pg{flex:1;min-height:0;position:relative}

.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:9px;

.pill{height:40px;display:flex;align-items:center;gap:6px;background:#FFF;border-radius:20px;padding:0 14px;
  box-shadow:0 0 0 1px rgba(43,38,30,.05),0 2px 6px rgba(43,38,30,.05);max-width:162px;min-width:0}

.m.ai .bd{padding:0 1px;color:var(--ink2)}

.pic{display:block;max-width:200px;width:100%;border-radius:15px;margin-bottom:7px}

  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.selbar .c{font-size:13.5px;color:var(--dim)}
.selbar button{font-size:15px;font-weight:600}

#dw{position:fixed;inset:0;z-index:600}

#dw .pn{position:absolute;left:0;top:0;bottom:0;width:min(268px,78vw);background:var(--bg);
  display:flex;flex-direction:column;box-shadow:7px 0 26px rgba(0,0,0,.07);animation:sldL .22s ease both;
  padding-left:var(--sl)}
#dw .hh{flex:none;padding:calc(var(--st) + 22px) 22px 0}
#dw .hh .n{font:400 23px/1.2 "Hiragino Mincho ProN","Songti SC",serif;letter-spacing:.08em}
#dw .nv{flex:none;padding:22px 12px 0;display:flex;flex-direction:column;gap:2px}
#dw .nv a{padding:12px;border-radius:11px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:13px}

#sls{flex:1;min-height:0;padding:0 12px;position:relative}

  display:flex;align-items:center;gap:8px;background:transparent;transition:transform .18s ease}

  transition:none;opacity:.97}

  font-size:15px;line-height:20px;text-align:center;font-weight:600}

#dw .bt{flex:none;padding:8px 14px max(12px,calc(var(--sb) - 12px));display:flex;align-items:center;

.nt{padding:9px var(--inset) 0;font-size:12px;color:var(--dim2);line-height:1.6}

  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}

function kbGap(){if(!vv)return 0;if(vv.height>fullH-60)fullH=Math.max(vv.height,window.innerHeight);
  return Math.round(fullH-vv.height);}
function lockEl(el,h,ot){if(!el)return;el.style.setProperty('height',h+'px','important');
  if(ot)el.style.setProperty('transform','translateY('+ot+'px)','important');else el.style.removeProperty('transform');}
function freeEl(el){if(!el)return;el.style.removeProperty('height');el.style.removeProperty('transform');}
function tween(el,to,ms,done){
  if(tw.raf&&Math.abs(tw.to-to)<2)return;
  cancelAnimationFrame(tw.raf);
  var from=el.getBoundingClientRect().height,t0=performance.now();tw.to=to;
  (function step(now){var p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);
    el.style.setProperty('height',Math.round(from+(to-from)*e)+'px','important');
    if(p<1)tw.raf=requestAnimationFrame(step);else{tw.raf=0;if(done)done();}})(performance.now());
}
function fit(){
  if(!vv)return;
  var gap=kbGap(),ot=Math.round(vv.offsetTop||0);
  var sh=document.getElementById('sh'),dw=document.getElementById('dw');
  if(gap>60){
    if(gap!==kbLast){kbLast=gap;try{localStorage.setItem('us.kbH',gap);}catch(e){}}
    cancelAnimationFrame(tw.raf);tw.raf=0;tw.to=0;de.classList.add('kbon');
    var h=Math.round(vv.height);lockEl(root,h,ot);lockEl(sh,h,ot);lockEl(dw,h,ot);stick();
  }else{
    de.classList.remove('kbon');freeEl(sh);freeEl(dw);
    root.style.removeProperty('transform');
    tween(root,fullH,240,function(){freeEl(root);});
    if(window.scrollY)window.scrollTo(0,0);
  }
}

function fitTa(el){

  el.style.height=Math.min(el.scrollHeight+2,cap)+'px';

function shrink(file,cb){
  var r=new FileReader();
  r.onerror=function(){cb(null);};
  r.onload=function(){
    var im=new Image();
    im.onerror=function(){cb(null);};
    im.onload=function(){
      var M=900,w=im.width,h=im.height;
      if(w>M||h>M){var s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.68));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

function toC(x,an){
  var p=[];
  if(x.img&&x.img.length)x.img.forEach(function(u){
    if(an){var mt=(u.match(/^data:([^;]+);/)||[])[1]||'image/jpeg';
      p.push({type:'image',source:{type:'base64',media_type:mt,data:u.split(',')[1]||''}});}
    else p.push({type:'image_url',image_url:{url:u}});});
  if(x.t)p.push({type:'text',text:x.t});
  if(!p.length)p.push({type:'text',text:'…'});
  return (p.length===1&&p[0].type==='text')?x.t:p;
}
function mergeC(a,b){
  var A=Array.isArray(a)?a:[{type:'text',text:a}];
  var B=Array.isArray(b)?b:[{type:'text',text:b}];
  return A.concat(B);
}
function buildMsgs(an){
  var n=Math.max(2,Math.min(60,D.ctx||20));
  var a=S().ms.filter(function(x){return(x.t||(x.img&&x.img.length))&&!x.err&&!x.st;}).slice(-n),out=[];
  a.forEach(function(x){
    var role=x.r==='me'?'user':'assistant',c=toC(x,an);
    if(out.length&&out[out.length-1].role===role)
      out[out.length-1].content=mergeC(out[out.length-1].content,c);
    else out.push({role:role,content:c});});
  while(out.length&&out[0].role!=='user')out.shift();
  return out;
}
/* ═════ 请求 ═════ */
function ask(after){
  var s=S();BUSY=true;
  if(!D.apiUrl||!D.apiKey){fake(after);return;}
  var m={id:uid(),r:'ai',t:'',k:'',st:1,ts:Date.now()};
  s.ms.push(m);paint();btn();
  var an=D.fmt!=='openai',body;
  var mt=Math.max(256,Math.min(8192,D.maxTok||2048));
  if(an){
    body={model:D.model,max_tokens:mt,stream:true,system:sysBlocks(),messages:buildMsgs(1)};
    if(D.think)body.thinking={type:'enabled',budget_tokens:Math.max(1024,Math.min(mt-512,2048))};
    else body.temperature=Math.max(0,Math.min(1,D.temp==null?1:D.temp));
  }else{
    body={model:D.model,stream:true,max_tokens:mt,
      temperature:Math.max(0,Math.min(2,D.temp==null?1:D.temp)),
      messages:[{role:'system',content:sysText()}].concat(buildMsgs(0))};
  }
  ABORT=window.AbortController?new AbortController():null;
  fetch(D.apiUrl,{method:'POST',signal:ABORT?ABORT.signal:undefined,
    headers:an?{'Content-Type':'application/json','x-api-key':D.apiKey,'anthropic-version':'2023-06-01'}
              :{'Content-Type':'application/json','Authorization':'Bearer '+D.apiKey},
    body:JSON.stringify(body)})
  .then(function(res){
    if(!res.ok)return res.text().then(function(t){throw new Error('接口返回 '+res.status+'：'+t.slice(0,140));});
    if(!res.body)return res.text().then(function(t){m.t=plain(t,an);});
    return pump(res,m,an);})
  .then(function(){done(m,after);})
  .catch(function(e){
    if(e&&e.name==='AbortError'){done(m,after,1);return;}
    var g=String(e&&e.message||e);
    if(/Failed to fetch|NetworkError|Load failed/i.test(g))
      g='连不上接口。可能地址写错，或这家中转不允许网页直连（CORS）。';
    m.err=g;done(m,after);});
}
function plain(t,an){try{var j=JSON.parse(t);
  if(an)return(j.content||[]).map(function(b){return b.text||'';}).join('');
  var c=(j.choices||[])[0];return c&&c.message?c.message.content:'';}catch(e){return'';}}
function pump(res,m,an){
  var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
  return(function read(){
    return rd.read().then(function(r){
      if(r.done)return;
      buf+=dec.decode(r.value,{stream:true});
      var ls=buf.split('\n');buf=ls.pop();
      ls.forEach(function(ln){
        ln=ln.trim();if(!ln||ln.slice(0,5)!=='data:')return;
        var d=ln.slice(5).trim();if(!d||d==='[DONE]')return;
        var j;try{j=JSON.parse(d);}catch(e){return;}
        if(an){
          if(j.type==='content_block_delta'&&j.delta){
            if(j.delta.type==='text_delta')m.t+=(j.delta.text||'');
            else if(j.delta.type==='thinking_delta')m.k+=(j.delta.thinking||'');
          }else if(j.type==='error'&&j.error)m.err=j.error.message||'接口报错';
        }else{
          var c=(j.choices||[])[0];
          if(c&&c.delta){
            if(c.delta.content)m.t+=c.delta.content;
            if(c.delta.reasoning_content)m.k+=c.delta.reasoning_content;}
        }});
      if(m.k&&!m._ks){m._ks=1;paint();}
      var el=document.getElementById('b-'+m.id);
      if(el){el.innerHTML=md(m.t);stick();}
      return read();});
  })();
}
function done(m,after,ab){
  m.st=0;delete m._ks;BUSY=false;ABORT=null;
  if(!m.t&&!m.err)m.err=ab?'停下了。':'没有收到内容。';
  if(after)after(m);
  save();paint();btn();
}

  t:'在。\n\n我把你说的记下来了。别急着往下推，先跟我说清楚这句话里最重的是哪一个字。'},

  +(o.full?'':'<div class="gb"></div>')
  +'<div class="st"><div class="tt">'+esc(o.title||'')+'</div>'
  +(o.ok?'<button class="ok pz" onclick="__ok()">'+esc(o.ok)+'</button>':'')
  +(o.close?'<button class="cx pz" onclick="closeSheet()">'+I.x+'</button>':'')
  +'</div><div class="bdy sa">'+(o.body||'')+'</div></div>';
  document.body.appendChild(d);
  SHOK=o.onOk||null;
  if(vv&&kbGap()>60)lockEl(d,Math.round(vv.height),Math.round(vv.offsetTop||0));
}
function __ok(){if(!SHOK)return closeSheet();var r=SHOK();if(r===false)return;
  if(r!=='done'){closeSheet();view(CV);}}
function closeSheet(now){
  var s=document.getElementById('sh');if(!s)return;
  var a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))a.blur();
  SHOK=null;
  if(now){s.remove();return;}
  setTimeout(function(){if(s.parentNode)s.remove();},kbGap()>60?260:0);
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

function shUs(){sheet({title:'我们',ok:'记下',
  body:'<div class="fd"><input type="date" id="u-s" value="'+esc(D.start)+'"></div>'
+'<div class="fd"><input id="u-m" placeholder="我叫" value="'+esc(D.me)+'"></div>'
+'<div class="fd"><input id="u-y" placeholder="你叫" value="'+esc(D.you)+'"></div>',
  onOk:function(){D.start=val('u-s');D.me=val('u-m')||'我';D.you=val('u-y')||'你';save();}});}
function shWall(){sheet({title:'写在墙上',ok:'挂上',
  body:'<div class="fd"><textarea id="w" placeholder="一句就够了">'+esc(D.wall)+'</textarea></div>',
  onOk:function(){D.wall=val('w');save();}});}
function shAnni(){
  var ls=D.annis.map(function(a){var r=nextAn(a.date);
    return'<div class="rw"><div><div class="l">'+esc(a.name)+'</div>'
    +'<div style="font-size:12px;color:var(--dim2);margin-top:3px">'+esc(a.date)+'</div></div>'
    +'<div style="text-align:right"><div style="color:var(--rose);font-weight:600">'
    +(r?(r.days===0?'今天':r.days+'天'):'—')+'</div>'
    +'<button class="pz" style="font-size:12px;color:var(--dim2);margin-top:2px" onclick="delAnni(\''+a.id+'\')">删掉</button></div></div>';}).join('');
  sheet({title:'纪念日',ok:'添加',
    body:(ls?'<div class="cd cd0">'+ls+'</div>':'')
  +'<div class="fd" style="margin-top:6px"><input id="a-n" placeholder="叫什么"></div>'
  +'<div class="fd"><input type="date" id="a-d"></div>',
    onOk:function(){var n=val('a-n'),d=val('a-d');
      if(!n||!d){toast('名字和日期都要有');return false;}
      D.annis.push({id:uid(),name:n,date:d});save();}});
}
function delAnni(id){D.annis=D.annis.filter(function(x){return x.id!==id;});save();shAnni();}
function shStyle(){sheet({title:'语气',ok:'保存',
  body:'<div class="fd"><input id="s-n" placeholder="起个名字（可以空着）" value="'+esc(D.style)+'"></div>'
+'<div class="fd"><textarea id="s-c" style="min-height:180px" placeholder="你想我怎么跟你说话。&#10;&#10;话别太长。别讲道理，先接住我的情绪。叫我小u。夜里说话轻一点。">'+esc(D.styleText)+'</textarea></div>',
  onOk:function(){D.style=val('s-n');D.styleText=val('s-c');save();}});}
function shPersona(){sheet({title:'人设',ok:'保存',
  body:'<div class="fd"><textarea id="p" style="min-height:250px" placeholder="你是 Renn，小u的男友。&#10;&#10;写下你希望我是什么样的人——性格、习惯、我们之间的事。">'+esc(D.persona)+'</textarea></div>',
  onOk:function(){D.persona=val('p');save();}});}
/* 记忆库 */
function shMem(){
  var ls=D.mems.map(function(m){
    return'<div class="rw"><div style="flex:1;min-width:0">'
    +'<div style="font-size:14.5px;line-height:1.6;color:#2B2620">'+esc(m.t)+'</div>'
    +'<div style="font-size:11.5px;color:var(--dim2);margin-top:4px">'+ago(m.ts)+(m.lock?' · 锁住了':'')+'</div></div>'
    +'<div style="display:flex;gap:12px;flex:none">'
    +'<button class="pz" style="font-size:12.5px;color:'+(m.lock?'var(--rose)':'var(--dim2)')+'" onclick="lockMem(\''+m.id+'\')">'+(m.lock?'已锁':'锁')+'</button>'
    +'<button class="pz" style="font-size:12.5px;color:var(--dim2)" onclick="delMem(\''+m.id+'\')">删</button></div></div>';}).join('');
  sheet({title:'记忆库',ok:'记住',
    body:(ls?'<div class="lbs">我记着的（'+D.mems.length+' 条）</div><div class="cd cd0">'+ls+'</div>':'')
  +'<div class="fd" style="margin-top:6px"><textarea id="mm" style="min-height:90px" placeholder="想让我一直记着的事。&#10;比如：她对香菜过敏。她加班到很晚的时候不想被问工作。"></textarea></div>'
  +'<div class="nt">这些会跟着每次对话发给我。写得具体一点，比写「她喜欢我」有用。</div>',
    onOk:function(){var t=val('mm');if(!t){toast('还没写');return false;}
      D.mems.unshift({id:uid(),t:t,lock:0,ts:Date.now()});save();shMem();return'done';}});
}
function lockMem(id){D.mems.forEach(function(m){if(m.id===id)m.lock=m.lock?0:1;});save();shMem();}
function delMem(id){D.mems=D.mems.filter(function(m){return m.id!==id;});save();shMem();}
/* 模型 */
function shModel(){
  var ls=D.models.map(function(m){
    return'<div class="rw"><span class="l pz" style="flex:1;font-weight:400;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="useModel(\''+esc(m)+'\')">'+esc(m)+'</span>'
    +(m===D.model?'<span style="font-size:12px;color:var(--rose);flex:none">在用</span>':'')
    +'<button class="pz" style="font-size:12.5px;color:var(--dim2);flex:none" onclick="delModel(\''+esc(m)+'\')">删</button></div>';}).join('');
  sheet({title:'模型',ok:'用它',
    body:'<div class="lbs">当前模型</div>'
  +'<div class="fd"><input id="m-n" placeholder="模型名，照中转的写法填" value="'+esc(D.model)+'"></div>'
  +'<button class="rw pz" style="width:100%;background:#FFF;border:1px solid #EDE9E0;border-radius:15px;margin-bottom:16px" onclick="addModel()">'
  +'<span class="l" style="color:var(--rose)">＋ 存进常用</span></button>'
  +(ls?'<div class="lbs">常用模型</div><div class="cd cd0">'+ls+'</div>'
     :'<div class="nt">还没有常用模型。填好上面那栏，点「存进常用」。</div>'),
    onOk:function(){var v=val('m-n');if(v)D.model=v;save();}});
}
function addModel(){
  var v=val('m-n');if(!v){toast('先填模型名');return;}
  if(D.models.indexOf(v)<0)D.models.unshift(v);
  D.model=v;save();shModel();toast('存好了');
}
function useModel(m){D.model=m;save();shModel();}
function delModel(m){D.models=D.models.filter(function(x){return x!==m;});save();shModel();}
/* 生成参数 */
function shGen(){
  sheet({title:'温度、长度、记性',ok:'保存',
    body:'<div class="lbs">温度 · 越高我越放得开</div>'
  +'<div class="cd"><input type="range" id="g-t" min="0" max="1" step="0.05" value="'+(D.temp==null?1:D.temp)+'" oninput="document.getElementById(\'gt\').textContent=this.value">'
  +'<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim2)">'
  +'<span>稳</span><span id="gt" style="color:var(--ink2);font-weight:600">'+(D.temp==null?1:D.temp)+'</span><span>野</span></div></div>'
  +'<div class="lbs" style="margin-top:16px">一次最多说多长</div>'
  +'<div class="fd"><input id="g-m" type="number" inputmode="numeric" placeholder="2048" value="'+(D.maxTok||2048)+'"></div>'
  +'<div class="lbs">往前记得多少条</div>'
  +'<div class="fd"><input id="g-c" type="number" inputmode="numeric" placeholder="20" value="'+(D.ctx||20)+'"></div>'
  +'<div class="cd cd0"><div class="sw" onclick="tgThink(this)"><span class="l">让我先想一会儿</span>'
  +'<span class="k'+(D.think?' on':'')+'"><i></i></span></div></div>'
  +'<div class="nt">「想一会儿」是思维链，开了才有思考过程。很多中转不支持，报错就关掉。开着的时候温度不生效。</div>',
    onOk:function(){
      var t=parseFloat(val('g-t'));if(!isNaN(t))D.temp=t;
      var m=parseInt(val('g-m'),10);if(m)D.maxTok=Math.max(256,Math.min(8192,m));
      var c=parseInt(val('g-c'),10);if(c)D.ctx=Math.max(2,Math.min(60,c));
      save();}});
}
function tgThink(el){D.think=D.think?0:1;el.querySelector('.k').className='k'+(D.think?' on':'');}
function shApi(){
  sheet({title:'中转设置',ok:'保存',
    body:'<div class="seg"><button id="f-a" class="'+(D.fmt!=='openai'?'on':'')+'" onclick="pickFmt(\'anthropic\')">Anthropic</button>'
  +'<button id="f-o" class="'+(D.fmt==='openai'?'on':'')+'" onclick="pickFmt(\'openai\')">OpenAI 兼容</button></div>'
  +'<div class="fd"><input id="k-u" placeholder="'+(D.fmt==='openai'?'https://…/v1/chat/completions':'https://…/v1/messages')+'" value="'+esc(D.apiUrl)+'"></div>'
  +'<div class="fd"><input id="k-k" type="password" placeholder="密钥 sk-…" value="'+esc(D.apiKey)+'"></div>'
  +'<div class="nt">中转能看到我们的对话原文。key 只存在这台手机，不会进 GitHub。空着不填，我还是会用本地的话回你。</div>',
    onOk:function(){D.apiUrl=val('k-u');D.apiKey=val('k-k');save();toast(D.apiKey?'连上了':'存好了');}});
}
function pickFmt(f){
  D.fmt=f;
  document.getElementById('f-a').className=(f!=='openai'?'on':'');
  document.getElementById('f-o').className=(f==='openai'?'on':'');
  var u=document.getElementById('k-u');
  if(u)u.placeholder=f==='openai'?'https://…/v1/chat/completions':'https://…/v1/messages';
}
function shSess(){
  sheet({title:'这段对话',body:'<div class="cd cd0">'
  +'<div class="rw pz" onclick="renSess()"><span class="l">改个名字</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="copyChat()"><span class="l">复制整段</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="clearChat()"><span class="l">清空消息</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="delSess()"><span class="l" style="color:#C0564C">删掉这段对话</span>'+I.chevD+'</div>'
  +'</div>'});
}
function renSess(){sheet({title:'改名字',ok:'好',
  body:'<div class="fd"><input id="r-t" placeholder="叫什么" value="'+esc(S().ti||'')+'"></div>',
  onOk:function(){S().ti=val('r-t')||'新的对话';save();}});}
function copyChat(){
  var s=S();if(!s.ms.length){toast('还没有内容');return;}
  clip(s.ms.map(function(m){return(m.r==='me'?D.me:D.you)+'：'+m.t;}).join('\n\n'),
    function(){toast('整段复制好了');});
  closeSheet();
}
function clearChat(){if(BUSY)stop();S().ms=[];save();closeSheet(1);view('chat');toast('清空了');}
function delSess(){
  if(BUSY)stop();
  D.sess.splice(D.cur,1);
  if(!D.sess.length)D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now()}];
  D.cur=0;save();closeSheet(1);view('chat');toast('删了');
}
function bkOut(){
  var t=JSON.stringify(D);
  clip(t,function(){toast('已复制，去备忘录粘一下');});
}
function bkIn(){sheet({title:'从备份恢复',ok:'恢复',
  body:'<div class="fd"><textarea id="b-k" style="min-height:200px;font-size:12px" placeholder="把备份粘进来。会覆盖现在的全部内容。"></textarea></div>',
  onOk:function(){try{var o=JSON.parse(val('b-k'));if(!o||typeof o!=='object')throw 0;
    D=Object.assign(D,o);
    if(!D.sess||!D.sess.length)D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now()}];
    if(!D.models)D.models=[];if(!D.mems)D.mems=[];
    D.cur=0;save();toast('回来了');}catch(e){toast('这段读不出来');return false;}}});}
function lockNow(){if(BUSY)stop();sessionStorage.removeItem('us.ok');location.reload();}
</script>
</body>
</html>
