<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I MISS U">
<meta name="format-detection" content="telephone=no">
<title>I MISS U</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
:root{--bg:#F5F3EE;--ink:#1A1815;--ink2:#2B2620;--dim:#9A958B;--dim2:#B8B3A8;
  --line:#ECE8DF;--card:#FFF;--me:#ECEAE4;--rose:#C97B6E;--onink:#F5F3EE;
  --i1:#48453E;--i2:#9A958B;--i3:#D1CCC2;
  --fld:#FFF;--fldb:#E7E3DA;--ibx:#FBFAF7;--chip:#F2EFE8;--cbx:#2B2620;--cbxt:#F0EDE6;
  --tag1:#EDEAE2;--tag1t:#7C766C;--tag2:#E8EDE4;--tag2t:#65735A;
  --tag3:#F3E4DF;--tag3t:#A9736A;--tag4:#E7EAEE;--tag4t:#6D7480;
  --hi:rgba(201,123,110,.2);--sd:rgba(43,38,30,.05);--sd2:rgba(43,38,30,.1);
  --gl:#EFEBE2;--tstb:rgba(255,255,255,.9);--tstt:#4A443C;--ovl:rgba(0,0,0,.2);
  --dr:#EBE7DF;--dr2:#F0ECE4;--dl:#E4DED4;--red:#C0564C;--red2:#B5514A;--gr:#8C9E7E;
  --edge:#F5F3EE;
  --st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --pb:max(0px,calc(var(--sb) - 27px));--inset:17px}
html.dark{--bg:#16140F;--ink:#EAE5DA;--ink2:#DED8CC;--dim:#8B857A;--dim2:#6E6961;
  --line:#2A261F;--card:#1E1B16;--me:#2C2822;--rose:#D48F80;--onink:#16140F;
  --i1:#C6C0B4;--i2:#8B857A;--i3:#4E483F;
  --fld:#1C1914;--fldb:#302B24;--ibx:#1B1813;--chip:#272319;--cbx:#0D0B08;--cbxt:#DDD7CB;
  --tag1:#2A2620;--tag1t:#9A9488;--tag2:#232A20;--tag2t:#93A085;
  --tag3:#33231F;--tag3t:#C08F84;--tag4:#22262C;--tag4t:#8A929E;
  --hi:rgba(212,143,128,.26);--sd:rgba(0,0,0,.32);--sd2:rgba(0,0,0,.5);
  --gl:#1D1A15;--tstb:rgba(48,44,37,.94);--tstt:#E6E1D6;--ovl:rgba(0,0,0,.55);
  --dr:#26221C;--dr2:#231F1A;--dl:#332E27;--red:#D4736A;--red2:#D4736A;--gr:#7E8F70;
  --edge:#16140F}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit;border:none;background:none}
textarea,input{-webkit-appearance:none;border-radius:0}
input[type=date]{color-scheme:light}
html.dark input[type=date]{color-scheme:dark;color:var(--ink2)}
.hide{display:none!important}
.nosel{-webkit-user-select:none;user-select:none}
.sa{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.sa::-webkit-scrollbar{width:0;display:none}
.pz{transition:transform .12s ease,opacity .12s ease}
.pz:active{transform:scale(.95);opacity:.75}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sldL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sldU{from{transform:translateY(100%)}to{transform:none}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shk{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-2px)}}
@keyframes fl{0%{background:var(--hi)}100%{background:transparent}}
@keyframes wdrop{from{transform:translateY(-100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

#bgl{position:fixed;left:0;right:0;top:0;bottom:0;z-index:-2;background-position:center;
  background-size:cover;background-repeat:no-repeat;pointer-events:none}
#bgv{position:fixed;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none}
html.hasbg body{background-color:var(--edge)!important}
html.hasbg #root,html.hasbg #pg{background:transparent}
html.hasbg .mw .fg{display:none}

#boot{position:fixed;inset:0;z-index:990;background:var(--bg);display:flex;
  align-items:center;justify-content:center}
#boot i{width:22px;height:22px;border-radius:50%;border:2px solid var(--dl);
  border-top-color:var(--rose);animation:spin .7s linear infinite}
#root{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#warn{flex:none;background:#B4453C;color:#FFF;padding:calc(var(--st) + 9px) 16px 11px;
  display:flex;align-items:center;gap:11px;animation:wdrop .3s ease both;z-index:50}
#warn .wt{flex:1;font-size:13px;line-height:1.5;font-weight:500}
#warn .wb{flex:none;background:rgba(255,255,255,.2);border-radius:14px;padding:7px 13px;
  font-size:13px;font-weight:600;color:#FFF}
#warn .wx{flex:none;width:26px;height:26px;opacity:.7;font-size:17px;line-height:26px;text-align:center}
html.warned .hd{padding-top:9px}
html.warned .pgw{padding-top:2px}

#lk{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:calc(var(--st) + 32px) 26px 14px;animation:fade .5s ease both}
#lk:before{content:'';position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(var(--gl),transparent);pointer-events:none}
#lk.out{opacity:0;transition:opacity .4s ease;pointer-events:none}
#lk .jp{position:relative;font:400 33px/1 "Hiragino Mincho ProN","Yu Mincho","Songti SC",serif;
  letter-spacing:.2em;color:var(--ink2);text-indent:.2em}
#lk .en{margin-top:15px;font-size:10.5px;letter-spacing:.38em;color:var(--dim2);font-weight:500}
#dts{display:flex;gap:15px;margin:38px 0 34px}
#dts i{width:9px;height:9px;border-radius:50%;background:var(--dl);transition:.2s}
#dts i.on{background:var(--dim);transform:scale(1.25)}
#lk.er #dts{animation:shk .44s}
#pad{display:grid;grid-template-columns:repeat(3,78px);gap:17px}
#pad button{height:78px;border-radius:50%;background:var(--ibx);font:300 27px/1 -apple-system;color:var(--ink2);
  box-shadow:0 1px 2px var(--sd),0 8px 20px -12px var(--sd2);
  display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
#pad button:active{transform:scale(.9);background:var(--dr2)}
#pad button.f{background:none;box-shadow:none}

#pg{flex:1;min-height:0;position:relative}
.vw{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .22s ease both}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:9px;
  padding:calc(var(--st) + 8px) calc(14px + var(--sr)) 9px calc(14px + var(--sl))}
.cb{width:40px;height:40px;flex:none;border-radius:50%;background:var(--card);display:flex;align-items:center;
  justify-content:center;box-shadow:0 0 0 1px var(--sd),0 2px 6px var(--sd)}
.pill{height:40px;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:20px;padding:0 14px;
  box-shadow:0 0 0 1px var(--sd),0 2px 6px var(--sd);min-width:0}
.pill span{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.hdt{font-size:15px;font-weight:600}
.pgw{flex:1;min-height:0;padding:2px calc(20px + var(--sr)) 24px calc(20px + var(--sl))}
.big{font:700 30px/1.2 -apple-system;letter-spacing:-.03em}
.sub{margin-top:5px;font-size:14px;color:var(--dim)}

.mw{flex:1;min-height:0;position:relative}
.mw .fg{position:absolute;left:0;right:0;height:22px;z-index:4;pointer-events:none}
.mw .fg.t{top:0;background:linear-gradient(var(--bg),transparent)}
.mw .fg.b{bottom:0;background:linear-gradient(transparent,var(--bg))}
#ms{position:absolute;inset:0;padding:12px calc(20px + var(--sr)) 22px calc(20px + var(--sl))}
.gsep{display:flex;align-items:center;gap:10px;margin:2px 0 26px}
.gsep i{flex:1;height:1px;background:var(--line)}
.gsep span{flex:none;font-size:11px;color:var(--dim2);letter-spacing:.04em}
.m{margin-bottom:28px;display:flex;flex-direction:column;animation:up .3s ease both}
.m.me{align-items:flex-end}.m.ai{align-items:flex-start}
.m .in{max-width:100%;width:100%}
.m.me .in{max-width:84%;width:auto;text-align:right}
.bd{font-size:16px;line-height:1.78;letter-spacing:-.008em;word-break:break-word;white-space:pre-wrap}
.m.me .bd{background:var(--me);border-radius:22px;padding:12px 17px;color:var(--ink2);text-align:left}
.m.ai .bd{padding:0 1px;color:var(--ink2)}
.m.flash .bd{animation:fl 1.9s ease}
.bd.clip{max-height:330px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);
  mask-image:linear-gradient(180deg,#000 72%,transparent)}
.more{display:inline-block;margin-top:7px;font-size:12.5px;color:var(--rose);font-weight:600}
.bd b{font-weight:600}.bd em{font-style:italic}
.bd code{background:var(--chip);border-radius:5px;padding:1px 5px;font:13.5px ui-monospace,Menlo,monospace}
.bd .cbx{background:var(--cbx);color:var(--cbxt);border-radius:12px;padding:12px 14px;margin:9px 0;
  font:13px/1.6 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
.pic{display:inline-block;width:74px;height:74px;object-fit:cover;border-radius:13px;
  margin:0 0 6px 6px;vertical-align:top;background:var(--chip)}
.m.ai .pic{margin:0 6px 6px 0}
.gone{font-size:12px;color:var(--dim2);background:var(--gl);border-radius:11px;padding:7px 12px;
  margin-bottom:7px;display:inline-block}
.qt{border-left:2.5px solid var(--dl);padding:2px 0 2px 13px}
.qt .qh{font-size:11.5px;color:var(--dim2);font-weight:600;margin-bottom:6px;display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.qt .qb{font-size:13.5px;line-height:1.7;color:var(--dim);white-space:pre-wrap}
.thk{margin-bottom:11px}
.thk button{display:inline-flex;align-items:center;gap:6px;padding:1px 0;text-align:left}
.thk span{font-size:13px;color:var(--dim);max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.wbx{margin-bottom:13px;border-left:2.5px solid var(--tag4t);padding:1px 0 1px 12px}
.wbx.lk{border-color:var(--tag2t)}
.wbx .wh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
.wbx .wl{margin-top:5px;font-size:12.5px;line-height:1.8}
.wbx .wl a{color:var(--tag4t);text-decoration:none;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;align-items:baseline;gap:8px;margin-top:11px;font-size:11.5px;
  color:var(--dim2);line-height:1.7;flex-wrap:wrap}
.act .ai2{color:var(--tag2t);font-weight:600;flex:none}
.act .at{flex:1;min-width:0}
.ops{display:flex;align-items:center;gap:14px;margin-top:10px;opacity:.62}
.tm{font-size:11px;color:var(--dim2);flex:none;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim2);font-weight:600;
  font-variant-numeric:tabular-nums}
.nav button{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.nav button[disabled]{opacity:.28}
.eo{display:flex;align-items:center;justify-content:flex-end;gap:11px;margin-top:6px;opacity:.55}
.eo button{width:25px;height:25px;display:flex;align-items:center;justify-content:center}
.err{margin-top:9px;font-size:12.5px;color:var(--red2);line-height:1.6}
.err button{color:var(--rose);font-weight:600;font-size:12.5px;margin-left:8px}
.typ{display:flex;gap:4px;padding:2px 0 4px;align-items:center}
.typ i{width:5px;height:5px;border-radius:50%;background:var(--dim2);animation:dots 1.4s ease-in-out infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
.typ span{margin-left:7px;font-size:12.5px;color:var(--dim2)}
.wm{position:sticky;top:46%;left:50%;transform:translate(-50%,-50%);width:0;height:0;
  display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.m.pick .in{position:relative;padding-left:30px}
.m.pick.me .in{padding-left:0;padding-right:30px}
.ck{position:absolute;top:2px;left:0;width:21px;height:21px;border-radius:50%;
  border:1.6px solid var(--dl);background:var(--ibx)}
.m.pick.me .ck{left:auto;right:0}
.m.on .ck{background:var(--ink);border-color:var(--ink)}
.m.on .ck:after{content:'';position:absolute;left:6px;top:5px;width:6px;height:9px;
  border-right:2px solid var(--onink);border-bottom:2px solid var(--onink);transform:rotate(40deg)}

.ib{flex:none;padding:5px calc(13px + var(--sr)) var(--pb) calc(13px + var(--sl))}
html.kbon .ib{padding-bottom:4px}
.ibx{background:var(--ibx);border:1px solid var(--fldb);border-radius:25px;padding:15px 16px 10px;
  box-shadow:0 1px 3px var(--sd)}
.att{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.att .a{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--chip)}
.att .a img{width:100%;height:100%;object-fit:cover;display:block}
.att .a button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;
  background:rgba(26,24,21,.72);color:#fff;font-size:12px;line-height:19px;text-align:center}
#ta{display:block;width:100%;min-height:26px;resize:none;outline:none;background:none;font-size:16px;
  line-height:1.55;color:var(--ink2);padding:1px 3px 12px;font-weight:300}
#ta::placeholder{color:var(--dim2);font-weight:300}
.ibr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{width:31px;height:31px;flex:none;border-radius:50%;background:var(--chip);
  display:flex;align-items:center;justify-content:center}
.mini.on{background:var(--tag4t)}
.mini.on .ic{color:#FFF}
.mini.on2{background:var(--tag3t)}
.mini.on2 .ic{color:#FFF}
.mchip{display:flex;align-items:center;background:var(--chip);border-radius:17px;padding:7px 12px;max-width:120px}
.mchip span{font-size:12.5px;font-weight:500;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.snd{width:39px;height:39px;flex:none;border-radius:50%;background:var(--ink);display:flex;
  align-items:center;justify-content:center;transition:opacity .18s,transform .12s}
.snd.off{opacity:.26}
.selbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px calc(20px + var(--sr)) var(--pb) calc(20px + var(--sl));background:var(--ibx);
  border-top:1px solid var(--line)}
.selbar .c{font-size:13.5px;color:var(--dim)}
.selbar button{font-size:15px;font-weight:600}

.sbox{flex:none;padding:0 calc(20px + var(--sr)) 12px calc(20px + var(--sl))}
.sbox .w{display:flex;align-items:center;gap:9px;background:var(--fld);border:1px solid var(--fldb);
  border-radius:16px;padding:12px 14px}
.sbox input{flex:1;min-width:0;outline:none;font-size:16px}
.sbox input::placeholder{color:var(--dim2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 calc(20px + var(--sr)) 12px calc(20px + var(--sl))}
.chips button{flex:none;border:1px solid var(--fldb);background:var(--fld);border-radius:15px;
  padding:7px 13px;font-size:13px;color:var(--dim)}
.chips button.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.res{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  margin-bottom:10px;box-shadow:0 1px 2px var(--sd),0 8px 22px -14px var(--sd2)}
.res .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.res .rt{font-size:11.5px;color:var(--dim2);font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.res .who{font-size:12px;color:var(--rose);font-weight:600;flex:none}
.res .rb{font-size:14.5px;line-height:1.7;color:var(--ink2);word-break:break-word}
.res .rc{font-size:13px;line-height:1.65;color:var(--dim);margin-top:7px;
  padding-left:10px;border-left:2px solid var(--line);white-space:pre-wrap}
.res .ra{display:flex;gap:18px;margin-top:12px}
.res .ra button{font-size:13px;font-weight:600;color:var(--rose)}
.res .ra button.g{color:var(--dim)}
mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:13vh 24px;color:var(--dim2);font-size:14px;line-height:1.85}

.mcd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 17px 13px;
  margin-bottom:11px;box-shadow:0 1px 2px var(--sd),0 8px 22px -14px var(--sd2)}
.mcd.lk{border-color:var(--tag3t)}
.mcd.pk{position:relative;padding-left:46px}
.mcd.pk .ck2{position:absolute;left:16px;top:16px;width:21px;height:21px;border-radius:50%;
  border:1.6px solid var(--dl);background:var(--fld)}
.mcd.pk.on{border-color:var(--rose)}
.mcd.pk.on .ck2{background:var(--rose);border-color:var(--rose)}
.mcd.pk.on .ck2:after{content:'';position:absolute;left:6px;top:5px;width:6px;height:9px;
  border-right:2px solid #FFF;border-bottom:2px solid #FFF;transform:rotate(40deg)}
.mcd .t{font-size:15px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.mcd .mt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}
.tag{font-size:10.5px;font-weight:600;border-radius:6px;padding:2.5px 7px;flex:none}
.tag.me{background:var(--tag1);color:var(--tag1t)}
.tag.ai{background:var(--tag2);color:var(--tag2t)}
.tag.lk{background:var(--tag3);color:var(--tag3t)}
.tag.ct{background:var(--tag4);color:var(--tag4t)}
.imp{display:flex;align-items:center;gap:2.5px;flex:none}
.imp i{width:5px;height:5px;border-radius:50%;background:var(--dl)}
.imp i.on{background:var(--tag3t)}
.mcd .f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.mcd .ts{font-size:11.5px;color:var(--dim2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mcd .ts b{font-weight:500;color:var(--rose)}
.mcd .a{display:flex;gap:15px;flex:none}
.mcd .a button{font-size:12.5px;color:var(--dim2);font-weight:500}
.mcd .a button.r{color:var(--rose)}
.exb{background:var(--card);border:1px solid var(--tag3t);border-radius:18px;padding:14px 16px;
  margin-bottom:13px;display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 2px var(--sd),0 8px 22px -14px var(--sd2)}
.exb .x1{flex:1;min-width:0}
.exb .x1 b{display:block;font-size:14.5px;font-weight:600}
.exb .x1 s{text-decoration:none;display:block;font-size:12px;color:var(--dim2);margin-top:3px}
.exb .x2{flex:none;background:var(--ink);color:var(--onink);border-radius:15px;padding:9px 15px;
  font-size:13.5px;font-weight:600}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--dl);
  border-top-color:var(--rose);animation:spin .7s linear infinite;flex:none}

.stc{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px;
  margin-bottom:11px;box-shadow:0 1px 2px var(--sd),0 10px 28px -14px var(--sd2)}
.stc .n{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

var _db=null;
function dbOpen(){
  return new Promise(function(ok,no){
    if(_db)return ok(_db);
    var rq=indexedDB.open(DB,1);
    rq.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('msg'))d.createObjectStore('msg');
      if(!d.objectStoreNames.contains('pic'))d.createObjectStore('pic');};
    rq.onsuccess=function(){_db=rq.result;
      _db.onversionchange=function(){try{_db.close();}catch(e){}_db=null;};
      ok(_db);};
    rq.onerror=function(){no(rq.error);};});
}
function tx(store,mode){
  return dbOpen().then(function(d){
    return d.transaction(store,mode).objectStore(store);});
}
function dbGet(store,k){
  return tx(store,'readonly').then(function(s){
    return new Promise(function(ok,no){
      var r=s.get(k);
      r.onsuccess=function(){ok(r.result);};
      r.onerror=function(){no(r.error);};});});
}
function dbPut(store,k,v){
  return tx(store,'readwrite').then(function(s){
    return new Promise(function(ok,no){
      var r=s.put(v,k);
      r.onsuccess=function(){ok(1);};
      r.onerror=function(){no(r.error);};});});
}
function dbDel(store,k){
  return tx(store,'readwrite').then(function(s){
    return new Promise(function(ok){
      var r=s.delete(k);
      r.onsuccess=function(){ok(1);};
      r.onerror=function(){ok(0);};});});
}
function dbKeys(store){

function doFlush(){
  if(SVBUSY)return;

  SVBUSY=1;
  var jobs=[];
  if(q.d)jobs.push(dbPut('kv','D',D));

  keys.forEach(function(k){

  Promise.all(jobs).then(function(){
    SVBUSY=0;

    if(Object.keys(SVQ).length)flush(1);

function ovl(a,b){

  rest.forEach(function(m){

    m._s=rel*5+(m.imp||2)*4+Math.min(8,(m.hits||0))+age*6;});

function plain(t,an){try{var j=JSON.parse(t);

  var c=(j.choices||[])[0];return c&&c.message?c.message.content:'';}catch(e){return'';}}
function pump(res,m,an,sid){
  var rd=res.body.getReader(),dec=new TextDecoder(),bf='';
  return(function read(){
    return rd.read().then(function(r){
      if(r.done)return;
      bf+=dec.decode(r.value,{stream:true});
      var ls=bf.split('\n');bf=ls.pop();
      ls.forEach(function(ln){
        ln=ln.trim();if(!ln||ln.slice(0,5)!=='data:')return;
        var d=ln.slice(5).trim();if(!d||d==='[DONE]')return;
        var j;try{j=JSON.parse(d);}catch(e){return;}
        if(an){
          if(j.type==='content_block_delta'&&j.delta){
            if(j.delta.type==='text_delta')m.t+=(j.delta.text||'');
            else if(j.delta.type==='thinking_delta')m.k+=(j.delta.thinking||'');
          }else if(j.type==='error'&&j.error)m.err=j.error.message||'接口报错';
        }else{
          var c=(j.choices||[])[0];
          if(c&&c.delta){
            if(c.delta.content)m.t+=c.delta.content;
            if(c.delta.reasoning_content)m.k+=c.delta.reasoning_content;}}});
      var s=S();
      if(!sid||(s&&s.id===sid)){
        if(m.k&&!m._ks){m._ks=1;paint();}
        var el=document.getElementById('b-'+m.id);
        if(el){el.innerHTML=md(stripMarks(m.t));stick();}}
      return read();});})();}
function findMarks(t){
  var out=[],re=/\[\[\s*(记住|锁住|查|展开)\s*[:：]([\s\S]{1,200}?)\]\]/g,x;
  while((x=re.exec(String(t||'')))){
    var v=String(x[2]||'').replace(/\s+/g,' ').trim();
    if(v)out.push({k:x[1],v:v.slice(0,160)});
    if(out.length>=8)break;}
  return out;}
function stripMarks(t){
  return String(t||'').replace(
    /\[\[\s*(记住|锁住|查|展开)\s*[:：][\s\S]{1,200}?\]\]/g,'')
    .replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();}
function splitCat(v){
  var i=Math.max(v.lastIndexOf('|'),v.lastIndexOf('｜'));
  if(i>0){
    var c=v.slice(i+1).trim();
    if(CATS.indexOf(c)>=0)return{t:v.slice(0,i).trim(),c:c};}
  return{t:v,c:''};}
function runActs(m,after,q,sid){
  var raw=m.t||'';
  m.t=stripMarks(raw);
  if(!D.acts||m.err)return 0;
  var mk=findMarks(raw);
  if(!mk.length)return 0;
  var acts=[],nMem=0,lookQ='',openN=0;
  mk.forEach(function(x){
    if(x.k==='查'){if(!lookQ)lookQ=x.v;return;}
    if(x.k==='展开'){
      if(!openN){var n=parseInt(x.v,10);if(n>0)openN=n;}
      return;}
    if(nMem>=2)return;
    var sc=splitCat(x.v);
    if(!sc.t)return;
    if(dupOf(sc.t)){acts.push({s:'dup',t:sc.t});return;}
    addMem(sc.t,sc.c,x.k==='锁住'?3:2,'ai',
      {sid:sid||S().id,mid:m.id,ts:Date.now()},x.k==='锁住');
    acts.push({s:x.k==='锁住'?'lock':'mem',t:sc.t});nMem++;});
  if(acts.length)m.acts=(m.acts||[]).concat(acts);
  if((lookQ||openN)&&LOOKN<1){
    LOOKN++;
    var r,lab;
    if(lookQ){
      r=lookLocal(lookQ);lab=lookQ;
      LOOKTXT=r.n?r.txt
        :'（翻了一遍，没有找到跟「'+lookQ+'」有关的话。别编，直接问她。）';
    }else{r=lookOpen(openN);lab='第 '+openN+' 条的前后';LOOKTXT=r.txt;}
    m.look={q:lab,n:r.n};
    m.t='';m.k='';m.st=1;
    BUSY=true;saveS(sid||S().id);paint();btn();
    go(m,after,q,sid);
    return 1;}
  return 0;}
function done(m,after,ab,ac,q,sid){
  m.st=0;delete m._ks;BUSY=false;
  if(!ac||ABORT===ac)ABORT=null;
  if(runActs(m,after,q,sid))return;
  if(!m.t&&!m.err)m.err=ab?'停下了。':'没有收到内容。';
  if(after)after(m);
  var s=sessById(sid)||S();
  if(s)s.at=Date.now();
  D.seen=Date.now();saveD();saveS(sid||(s&&s.id));
  if(CV==='chat'){paint();btn();}}

function shrink(file,M,q,cb){
  var r=new FileReader();
  r.onerror=function(){cb(null);};
  r.onload=function(){
    var im=new Image();
    im.onerror=function(){cb(null);};
    im.onload=function(){
      var w=im.width,h=im.height;
      if(w>M||h>M){var s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',q));};
    im.src=r.result;};
  r.readAsDataURL(file);}

var SYN=[
['难过','伤心','不开心','难受','低落','哭','委屈','emo'],
['生气','气','愤怒','火大','恼','不爽'],
['累','疲惫','困','熬夜','没劲','撑不住'],
['开心','高兴','快乐','好玩','兴奋','爽'],
['想你','思念','惦记','miss','想见'],
['吵架','争吵','冷战','矛盾','闹'],
['工作','上班','加班','项目','老板','同事','离职'],
['吃','饭','外卖','餐','饿','做菜'],
['睡','睡觉','失眠','午睡','起床'],
['生病','感冒','疼','发烧','药','医院','身体'],
['钱','工资','花钱','贵','买','攒'],
['前端','代码','页面','界面','部署','bug','github'],
['纪念日','生日','节日','周年','礼物'],
['家','家里','爸妈','父母','家人','回家'],
['学习','考试','读书','论文','作业'],
['出去','旅行','玩','散步','逛'],
['喜欢','爱','在乎','舍不得'],
['害怕','担心','焦虑','慌','紧张','怕'],
['图片','照片','图','截图','相片']];
function expand(w){
  var o=[w];
  SYN.forEach(function(g){
    if(g.some(function(x){return w.indexOf(x)>=0||x.indexOf(w)>=0;}))o=o.concat(g);});
  return o.filter(function(x,i,a){return a.indexOf(x)===i;});}
function parseDate(s){
  s=(s||'').replace(/\s/g,'');if(!s)return null;
  var t=today(),y=t.getFullYear(),m;
  if(/^(今天|today)$/i.test(s))return{a:d0(t),b:d0(t)+MS,lab:'今天'};
  if(/^昨天$/.test(s))return{a:d0(t)-MS,b:d0(t),lab:'昨天'};
  if(/^前天$/.test(s))return{a:d0(t)-2*MS,b:d0(t)-MS,lab:'前天'};
  m=s.match(/^(\d+)天前$/);
  if(m){var n=+m[1];return{a:d0(t)-n*MS,b:d0(t)-(n-1)*MS,lab:n+'天前'};}
  if(/^(这周|本周)$/.test(s)){var w=(t.getDay()+6)%7;
    return{a:d0(t)-w*MS,b:d0(t)+MS,lab:'这周'};}
  if(/^上周$/.test(s)){var w2=(t.getDay()+6)%7,b=d0(t)-w2*MS;
    return{a:b-7*MS,b:b,lab:'上周'};}
  if(/^(这个月|本月)$/.test(s))
    return{a:new Date(y,t.getMonth(),1).getTime(),b:d0(t)+MS,lab:'这个月'};
  if(/^(上个月|上月)$/.test(s))return{a:new Date(y,t.getMonth()-1,1).getTime(),
    b:new Date(y,t.getMonth(),1).getTime(),lab:'上个月'};
  m=s.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){var d=new Date(+m[1],+m[2]-1,+m[3]);
    return{a:d0(d),b:d0(d)+MS,lab:dlab(d.getTime())};}
  m=s.match(/^(\d{4})[-\/年](\d{1,2})月?$/);
  if(m)return{a:new Date(+m[1],+m[2]-1,1).getTime(),
    b:new Date(+m[1],+m[2],1).getTime(),lab:m[1]+'年'+(+m[2])+'月'};
  m=s.match(/^(\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){var d2=new Date(y,+m[1]-1,+m[2]);
    if(d0(d2)>d0(t))d2=new Date(y-1,+m[1]-1,+m[2]);
    return{a:d0(d2),b:d0(d2)+MS,lab:dlab(d2.getTime())};}
  m=s.match(/^(\d{1,2})月$/);
  if(m){var mo=+m[1]-1,yy=y;if(mo>t.getMonth())yy=y-1;
    return{a:new Date(yy,mo,1).getTime(),b:new Date(yy,mo+1,1).getTime(),
      lab:(mo+1)+'月'};}
  return null;}
function splitQ(q){
  var ps=(q||'').trim().split(/\s+/).filter(Boolean),dr=null,kw=[];
  var whole=parseDate(q);
  if(whole)return{dr:whole,kw:[]};
  ps.forEach(function(p){var d=parseDate(p);if(d&&!dr)dr=d;else kw.push(p);});
  return{dr:dr,kw:kw};}
function score(t,kw){
  if(!kw.length)return 1;
  var low=(t||'').toLowerCase(),sc=0;
  kw.forEach(function(w){
    var W=w.toLowerCase();
    if(low.indexOf(W)>=0){sc+=6;return;}
    var hit=0;
    expand(w).forEach(function(x){if(low.indexOf(x.toLowerCase())>=0)hit=1;});
    if(hit){sc+=3;return;}
    if(W.length>=2)for(var i=0;i<W.length-1;i++)
      if(low.indexOf(W.substr(i,2))>=0){sc+=1;break;}});
  return sc;}
function hi(t,kw){
  var s=esc(t);
  (kw||[]).forEach(function(w){
    if(!w)return;
    try{var r=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      s=s.replace(r,function(x){return'<mark>'+x+'</mark>';});}catch(e){}});
  return s;}
function cut(t,kw,n){
  n=n||110;
  if(!t)return'';
  if(t.length<=n)return t;
  var p=-1;
  (kw||[]).forEach(function(w){
    if(p<0&&w){var i=t.toLowerCase().indexOf(w.toLowerCase());if(i>=0)p=i;}});
  if(p<0)return t.slice(0,n)+'…';
  var a=Math.max(0,p-30);
  return(a?'…':'')+t.substr(a,n)+(a+n<t.length?'…':'');}

    body:JSON.stringify(body)})
  .then(function(r){
    if(!r.ok)return r.text().then(function(t){
      throw new Error(r.status+'：'+t.slice(0,110));});
    return r.json();})
  .then(function(j){
    EXB=0;
    if(!sessById(EXSID)){toast('那段对话不在了');if(CV==='mem')drawMem();return;}
    var raw=an?((j.content||[]).map(function(b){return b.text||'';}).join(''))
             :((((j.choices||[])[0]||{}).message||{}).content||'');
    var a2=parseJA(raw);
    if(!a2){toast('返回的东西看不懂，再试一次');if(CV==='mem')drawMem();return;}
    a2=a2.filter(function(x){return x&&x.t&&String(x.t).trim();}).slice(0,8);
    if(!a2.length){
      var s2=sessById(EXSID);
      if(s2){s2.ex=Date.now();saveS();}
      toast('这段里没有需要记的');
      if(CV==='mem')drawMem();else view('mem');
      return;}
    EXR=a2.map(function(x){
      var t=String(x.t).trim().slice(0,160);
      var dp=dupOf(t);
      return{t:t,cat:CATS.indexOf(x.cat)>=0?x.cat:'',
        imp:Math.max(1,Math.min(3,parseInt(x.imp,10)||2)),dup:dp?dp.m:null};});
    EXSEL={};
    EXR.forEach(function(r,i){EXSEL[i]=r.dup?0:1;});
    exSheet();})
  .catch(function(e){
    EXB=0;
    var g=String(e&&e.message||e);
    if(/Failed to fetch|Load failed/i.test(g))g='连不上接口';
    toast('提取失败：'+g.slice(0,40));
    if(CV==='mem')drawMem();});}
function exSheet(){
  var h='<div class="nt" style="padding:0 var(--inset) 12px">'
   +'我从这段对话里挑了 '+EXR.length+' 条。划掉不想留的，剩下的会记进记忆库。'
   +'跟已有的很像的，我默认没勾。</div>';
  EXR.forEach(function(r,i){
    var im='';
    for(var k=1;k<=3;k++)im+='<i'+(k<=r.imp?' class="on"':'')+'></i>';
    h+='<div class="mcd pk'+(EXSEL[i]?' on':'')+'" id="ex-'+i
     +'" onclick="exPick('+i+')">'
     +'<div class="ck2"></div><div class="t">'+esc(r.t)+'</div><div class="mt">'
     +(r.cat?'<span class="tag ct">'+esc(r.cat)+'</span>':'')
     +'<span class="tag ai">我记的</span><span class="imp">'+im+'</span>'
     +(r.dup?'<span class="tag lk">像已有的</span>':'')+'</div>'
     +(r.dup?'<div class="f"><div class="ts">已有：'+esc(r.dup.t.slice(0,26))
       +(r.dup.t.length>26?'…':'')+'</div></div>':'')+'</div>';});
  h+='<div class="cd cd0" style="margin-top:6px">'

   +I.chevD+'</div>'

function exAll(){

var MQ='',MCAT='',MCATLAST='';
function vMem(){
  return'<div class="vw">'
  +'<div class="hd"><button class="cb pz" onclick="drawer(1)">'+I.menu+'</button>'
  +'<span class="hdt">记忆库</span>'
  +'<button class="cb pz" onclick="editMem()">'+I.plus+'</button></div>'
  +'<div class="sbox" id="msb"></div><div class="chips" id="mch"></div>'
  +'<div class="sa" id="mls" style="flex:1;min-height:0;'
  +'padding:0 calc(20px + var(--sr)) 24px calc(20px + var(--sl))"></div></div>';}
function drawMem(){
  var q=document.getElementById('mq');if(q)MQ=q.value;
  var ls=live();
  var sb=document.getElementById('msb');
  if(sb)sb.innerHTML=(ls.length>5)
    ?'<div class="w">'+I.sr+'<input id="mq" value="'+esc(MQ)
      +'" placeholder="找一条" oninput="drawMem()"></div>':'';
  var ch=document.getElementById('mch');
  if(ch){
    var cs='<button class="pz'+(MCAT===''?' on':'')+'" onclick="mcat(\'\')">全部 '
      +ls.length+'</button>';
    var ai=ls.filter(function(m){return m.src==='ai';}).length;
    if(ai)cs+='<button class="pz'+(MCAT==='_a'?' on':'')
      +'" onclick="mcat(\'_a\')">我记的 '+ai+'</button>';
    CATS.forEach(function(c,i){
      var n=ls.filter(function(m){return m.cat===c;}).length;
      if(!n&&MCAT!==c)return;
      cs+='<button class="pz'+(MCAT===c?' on':'')+'" onclick="mcat('+i+')">'
        +c+' '+n+'</button>';});
    var nn=ls.filter(function(m){return!m.cat;}).length;
    if(nn)cs+='<button class="pz'+(MCAT==='_n'?' on':'')
      +'" onclick="mcat(\'_n\')">没分类 '+nn+'</button>';
    ch.innerHTML=cs;
    ch.style.display=ls.length?'flex':'none';}
  var box=document.getElementById('mls');if(!box)return;
  var h='',nw=exNew();
  if(EXB)h+='<div class="exb"><div class="x1"><b>正在看这段对话…</b>'
    +'<s>挑出值得记住的事，一会儿给你过一遍</s></div><span class="spin"></span></div>';
  else if(nw>=EXMIN)h+='<div class="exb"><div class="x1"><b>攒了 '+nw+' 条没整理</b>'
    +'<s>我可以挑出值得记住的，你划勾决定</s></div>'
    +'<button class="x2 pz" onclick="exRun()">看一看</button></div>';
  if(!ls.length){
    box.innerHTML=h+'<div class="empty">还没有记住的事。<br>右上角加一条，'
    +'或者在任何一条消息的 ⋯ 里选「记进记忆库」。</div>';return;}
  var sp=splitQ(MQ);
  var fl=ls.filter(function(m){
    if(MCAT==='_a'&&m.src!=='ai')return false;
    if(MCAT==='_n'&&m.cat)return false;
    if(MCAT&&MCAT!=='_n'&&MCAT!=='_a'&&m.cat!==MCAT)return false;
    if(sp.dr&&!(m.ts>=sp.dr.a&&m.ts<sp.dr.b))return false;
    return score(m.t,sp.kw)>0;});
  fl.sort(function(a,b){
    return(b.lock?1:0)-(a.lock?1:0)||(b.imp||2)-(a.imp||2)||b.ts-a.ts;});
  h+='<div class="lbs" style="padding-top:2px">'+fl.length+' 条'
   +(ls.length>MEMCAP?'　·　每次说话带最相关的 '+MEMCAP+' 条给我'
     :'　·　全部都会带给我')+'</div>';
  if(!fl.length)h+='<div class="empty">这里没有。</div>';
  fl.forEach(function(m){
    var im='';
    for(var i=1;i<=3;i++)im+='<i'+(i<=(m.imp||2)?' class="on"':'')+'></i>';
    h+='<div class="mcd'+(m.lock?' lk':'')+'">'
     +'<div class="t pz" onclick="editMem(\''+m.id+'\')">'+hi(m.t,sp.kw)+'</div>'
     +'<div class="mt">'
     +(m.cat?'<span class="tag ct">'+esc(m.cat)+'</span>':'')
     +'<span class="tag '+(m.src==='ai'?'ai':'me')+'">'
     +(m.src==='ai'?'我记的':'你记的')+'</span>'
     +(m.lock?'<span class="tag lk">锁住了</span>':'')
     +'<span class="imp">'+im+'</span></div>'
     +'<div class="f"><div class="ts">'+dtl(m.ts)
     +(m.from&&m.from.sid&&m.from.mid
       ?' · <b onclick="memJump(\''+m.id+'\')">看原话</b>':'')
     +(m.hits>2?' · 用过 '+m.hits+' 次':'')+'</div>'
     +'<div class="a"><button class="pz'+(m.lock?' r':'')
     +'" onclick="lockMem(\''+m.id+'\')">'+(m.lock?'已锁':'锁')+'</button>'
     +'<button class="pz" onclick="editMem(\''+m.id+'\')">改</button>'
     +'<button class="pz" onclick="delMem(\''+m.id+'\')">删</button></div></div></div>';});
  box.innerHTML=h;}
function mcat(c){
  var t=(typeof c==='number')?CATS[c]:c;

function memJump(id){

var EDCAT='',EDIMP=2,PEND=null;

  sheet({title:m?'改一条':'记住一件事',ok:'保存',

    onOk:function(){

        return'done';}
      var dp=dupOf(t);
      if(dp){
        PEND={t:t,cat:EDCAT,imp:EDIMP,from:from||null};
        closeSheet(1);
        sheet({title:'这条好像记过了',
          body:'<div class="lbs">已经记着的</div>'

        +'<div class="f"><div class="ts">'+dtl(dp.m.ts)+'</div></div></div>'

        return'done';}
      addMem(t,EDCAT,EDIMP,'me',from);
      closeSheet(1);
      if(CV==='mem')drawMem();else view('mem');
      return'done';}});}
function pkCat(i){
  EDCAT=(i<0)?'':CATS[i];
  var w=document.getElementById('e-cat');if(!w)return;
  [].forEach.call(w.children,function(b,j){
    b.className='pz'+(((j===0&&EDCAT==='')
      ||(j>0&&CATS[j-1]===EDCAT))?' on':'');});}

  if(!PEND){closeSheet();return;}
  addMem(PEND.t,PEND.cat,PEND.imp,'me',PEND.from);PEND=null;

  var m=memById(id);
  if(m){m.t=PEND.t;m.cat=PEND.cat;m.imp=PEND.imp;m.et=Date.now();

function delSessAt(i){
  var s=SS[i];

  SS.splice(i,1);
  if(!SS.length){var nid=uid();
    SS=[{id:nid,ti:'新的对话',at:Date.now(),ex:0}];MSG[nid]=[];}
  if(i<D.cur)D.cur--;
  else if(i===D.cur)D.cur=Math.min(i,SS.length-1);
  if(D.cur<0)D.cur=0;
  saveD();saveS();renderList();
  if(CV==='chat'){paint();btn();}}
function bindList(){
  var ls=document.getElementById('sls');if(!ls)return;
  var tm=null,sy=0,sx=0,si=-1,hh=46,moved=0;
  ls.addEventListener('touchstart',function(e){
    if(e.target.closest('.dl'))return;
    var it=e.target.closest('.it');if(!it)return;
    si=+it.dataset.i;sy=e.touches[0].clientY;sx=e.touches[0].clientX;
    hh=it.offsetHeight+2;moved=0;
    clearTimeout(tm);
    tm=setTimeout(function(){
      if(moved)return;
      EDIT=1;renderList();vib(14);
      var el=document.querySelector('#sls .it[data-i="'+si+'"]');
      if(el){DG={i:si,h:hh,dy:0,el:el};el.classList.add('dg');}},480);},{passive:true});
  ls.addEventListener('touchmove',function(e){
    var dy=e.touches[0].clientY-sy,dx=e.touches[0].clientX-sx;
    if(Math.abs(dy)>8||Math.abs(dx)>8)moved=1;
    if(!DG){if(moved)clearTimeout(tm);return;}
    e.preventDefault();DG.dy=dy;
    DG.el.style.transform='translateY('+dy+'px) scale(1.02)';
    var sh=Math.round(dy/DG.h),to=Math.max(0,Math.min(SS.length-1,DG.i+sh));
    [].forEach.call(document.querySelectorAll('#sls .it'),function(el){
      var j=+el.dataset.i;if(j===DG.i)return;
      var t=0;
      if(to>DG.i&&j>DG.i&&j<=to)t=-DG.h;
      if(to<DG.i&&j<DG.i&&j>=to)t=DG.h;
      el.style.transform=t?'translateY('+t+'px)':'';});},{passive:false});
  ls.addEventListener('touchend',function(e){
    clearTimeout(tm);
    if(!DG){
      if(!EDIT&&si>=0&&!moved&&!e.target.closest('.dl'))pickSess(si);
      return;}
    var sh=Math.round(DG.dy/DG.h),from=DG.i;
    var to=Math.max(0,Math.min(SS.length-1,from+sh));
    DG=null;
    if(to!==from){
      var cu=SS[D.cur],it=SS.splice(from,1)[0];
      SS.splice(to,0,it);D.cur=SS.indexOf(cu);saveD();saveS();vib(10);}
    renderList();});
  ls.addEventListener('contextmenu',function(e){e.preventDefault();});}

/* ── 搜索：关键词全中 ── */
function score(t,kw){
  if(!kw.length)return 1;
  var low=(t||'').toLowerCase(),sc=0,all=1;
  kw.forEach(function(w){
    var W=w.toLowerCase(),s=0;
    if(low.indexOf(W)>=0)s=10;
    if(!s)expand(w).forEach(function(x){
      if(x!==w&&low.indexOf(x.toLowerCase())>=0)s=Math.max(s,4);});
    if(!s&&W.length>=3){
      var hit=0,tot=0;
      for(var i=0;i<W.length-1;i++){tot++;if(low.indexOf(W.substr(i,2))>=0)hit++;}
      if(tot&&hit/tot>=0.6)s=2;}
    if(!s)all=0;
    sc+=s;});
  return all?sc:0;}

      +(x.n?' · '+x.n+' 条':' · 没找到')+'〕\n'+x.txt;}).join('\n\n');}
function lookAdd(q){

      if(!alive(mm)||mm.st||mm.err)return;
      if(sp.dr&&!(mm.ts>=sp.dr.a&&mm.ts<sp.dr.b))return;
      var sc=score(hay(mm),sp.kw);

      hits.push({sid:s.id,i:ix,sc:sc,ts:mm.ts,m:mm,s:s});});});
  if(sp.kw.length)hits.sort(function(a,b){return b.sc-a.sc||b.ts-a.ts;});

    if(tot>mm.length)
      s+='\n（记忆库里还有 '+(tot-mm.length)+' 条没带上来。想不起细节就翻。）';}
  var sc2=SS.length,mc=0;
  SS.forEach(function(x){mc+=(MSG[x.id]||[]).length;});
  s+='\n\n【能翻的东西】\n你们一共 '+sc2+' 段对话、'+mc+' 条消息，全都存着。'
   +'上面只带了最近 '+Math.max(2,Math.min(60,D.ctx||12))+' 条给你——'
   +'更早的事想不起来就直接翻，不要瞎猜也不要说「我不记得」。';
  if(WEBTXT)s+='\n\n【刚从网上查到的】\n查询时间 '+dtl(Date.now())
   +'。这些是搜索结果不是她的话，可信度自己判断；和你脑子里的旧信息冲突就以这些为准。'
   +'用得上就用，用不上别硬提。\n\n'+WEBTXT;
  if(HINT)s+='\n\n【这一轮】\n'+HINT;
  return s;}

/* ── 翻完的东西进消息列表，不再塞系统提示 ── */
function buildMsgs(an,forHi,pics){
  var out=[];
  ctxList().forEach(function(x){
    var role=(x.r==='ai')?'assistant':'user',c=toC(x,an,pics);
    if(out.length&&out[out.length-1].role===role)
      out[out.length-1].content=mergeC(out[out.length-1].content,c);
    else out.push({role:role,content:c});});
  while(out.length&&out[0].role!=='user')out.shift();
  if(!out.length||out[out.length-1].role!=='user')
    out.push({role:'user',content:forHi?'（她回来了，还没开口。）':'（继续）'});
  if(CURSAID){
    out.push({role:'assistant',content:CURSAID});
    var t='［这一段不是她说的，是页面给你的。］\n'
     +'你上面那些话已经发出去了，她当场就看见了；你翻了什么她也看得见。\n\n';
    if(LOOKTXT)t+='你翻到的（编号连续，同一个词别再翻）：\n'+LOOKTXT+'\n\n';
    t+=ROUNDHINT?(ROUNDHINT+'\n\n'):'';
    t+='接着往下说——别重复上面说过的，别重新开头，也不用说「我翻到了」。'
     +'如果不需要再补什么，可以只说一句，或者什么都不说。';
    out.push({role:'user',content:t});}
  return out;}

/* ── 动作执行 ── */
function nextRound(m,after,q,sid,hint){
  m.t='';m.k='';
  CURSAID=fullT(m);ROUNDHINT=hint||'';
  m.st=1;
  BUSY=true;saveS(sid||S().id);paint();btn();
  go(m,after,q,sid);
  return 1;}
function runActs(m,after,q,sid){
  var raw=m.t||'';
  m.t=stripMarks(raw);
  if(!D.acts||m.err)return 0;
  var mk=findMarks(raw);
  if(!mk.length)return 0;
  var acts=[],lookQ='',openN=0;
  mk.forEach(function(x){
    if(x.k==='查'){if(!lookQ)lookQ=x.v;return;}
    if(x.k==='展开'){
      if(!openN){var n=parseInt(x.v,10);if(n>0)openN=n;}
      return;}
    var sc=splitCat(x.v);
    if(!sc.t)return;
    if(dupOf(sc.t)){acts.push({s:'dup',t:sc.t});return;}
    addMem(sc.t,sc.c,x.k==='锁住'?3:2,'ai',
      {sid:sid||S().id,mid:m.id,ts:Date.now()},x.k==='锁住');
    acts.push({s:x.k==='锁住'?'lock':'mem',t:sc.t});});
  if(acts.length)m.acts=(m.acts||[]).concat(acts);
  if(!(lookQ||openN))return 0;
  if((m.lkn||0)>=TURNMAX){
    if(m.t&&m.t.trim())return 0;
    if(m.forced)return 0;
    m.forced=1;
    return nextRound(m,after,q,sid,
      '就用你手里已经有的东西回她，不用再翻了。真的不够就直接问她。');}
  var dup=0,lab='',r={n:0};
  if(lookQ){
    lab=lookQ;
    if(LOOKSEEN[lookQ.replace(/\s+/g,' ').toLowerCase()])dup=1;
    else{r=lookAdd(lookQ);m.lkn=(m.lkn||0)+1;}
  }else{r=openAdd(openN);lab='展开第 '+openN+' 条';m.lkn=(m.lkn||0)+1;}
  m.parts=m.parts||[];
  if(m.t&&m.t.trim())m.parts.push({ty:'t',t:m.t});
  m.parts.push({ty:'look',q:lab,n:r.n,dup:dup});
  return nextRound(m,after,q,sid,
    dup?'这个词你这一轮翻过了，结果就在上面，别再翻一次。':'');}
function done(m,after,ab,ac,q,sid){
  m.st=0;delete m._ks;BUSY=false;
  if(!ac||ABORT===ac)ABORT=null;
  if(runActs(m,after,q,sid))return;
  CURSAID='';ROUNDHINT='';
  var has=(m.t&&m.t.trim())||(m.parts&&m.parts.length);
  if(!has&&!m.err)m.err=ab?'停下了。':'没有收到内容。';
  if(after)after(m);
  var s=sessById(sid)||S();
  if(s)s.at=Date.now();
  D.seen=Date.now();saveD();saveS(sid||(s&&s.id));
  if(CV==='chat'){paint();btn();}}

/* ── 停止 ── */
var STOPPED=0,_go0=go;
go=function(m,after,q,sid,forHi){
  if(STOPPED){
    m.st=0;BUSY=false;CURSAID='';ROUNDHINT='';
    if(!(m.t&&m.t.trim())&&!(m.parts&&m.parts.length))m.err='停下了。';
    if(CV==='chat'){paint();btn();}
    return;}
  return _go0(m,after,q,sid,forHi);};
function stop(){
  STOPPED=1;
  if(ABORT){try{ABORT.abort();}catch(e){}ABORT=null;}
  if(TMR){clearInterval(TMR);TMR=null;endFake();return;}
  BUSY=false;btn();}

/* ── 发起 ── */
function ask(after){
  STOPPED=0;BUMPED=0;lookReset();
  var sid=S().id;BUSY=true;
  var q=lastQ();
  HINT='';
  if(!D.apiUrl||!D.apiKey){WEBTXT='';fake(after);return;}
  var m={id:uid(),r:'ai',t:'',k:'',st:1,ts:Date.now()};
  ms().push(m);
  if(D.web&&D.jkey&&q){
    m.wst=1;paint();btn();
    jinaSearch(q).then(function(r){
      m.wst=0;
      if(r&&r.txt){m.web=r.links;WEBTXT=r.txt;}else{m.webNo=1;WEBTXT='';}
      paint();go(m,after,q,sid);
    },function(){m.wst=0;m.webNo=1;WEBTXT='';paint();go(m,after,q,sid);});
  }else{WEBTXT='';paint();btn();go(m,after,q,sid);}}
function maybeHi(){
  if(!D.hi||!D.apiUrl||!D.apiKey||BUSY||CV!=='chat')return;
  var g=GAPMS;
  if(!g||g<D.hi*3600000){seen();return;}
  var ta=document.getElementById('ta');
  if(ta&&ta.value.trim())return;
  GAPMS=0;seen();
  var s=S();
  ms().push({id:uid(),r:'gap',g:g,ts:Date.now()});
  s.at=Date.now();saveS(s.id);
  STOPPED=0;BUMPED=0;lookReset();
  BUSY=true;WEBTXT='';
  var m={id:uid(),r:'ai',t:'',k:'',st:1,ts:Date.now()};
  ms().push(m);paint();btn();
  var n=new Date(),w=['周日','周一','周二','周三','周四','周五','周六'];
  HINT='［这不是她说的话，是页面给你的提示，别提到这条提示本身。］\n'
   +'她刚打开这个页面。距离你们上次说话过了 '+dur(g)+'。'
   +'现在是 '+(n.getMonth()+1)+'月'+n.getDate()+'日 '+w[n.getDay()]+' '+hm(Date.now())+'。\n'
   +'你先开口。可以顺着上次没说完的接下去，可以问她这段时间怎么样，'
   +'也可以只是说一句你在。\n'
   +'别写成播报，别复述隔了多久，别一上来就连着发问。短一点，像真的在等她回来。';
  go(m,null,'',S().id,1);}

/* ── 改完重发 ── */
function editMsg(id){
  var m=find(id);if(!m||BUSY)return;
  sheet({title:'改一下',ok:'重新发送',
    body:'<div class="fd"><textarea id="ed">'+esc(m.t)+'</textarea></div>'
    +'<div class="nt">一字不改也可以直接发——下面我的回复会重来一遍。</div>',
    onOk:function(){
      var el=document.getElementById('ed');if(!el)return false;
      var v=el.value.trim();
      if(!v){toast('不能是空的');return false;}
      var s=S(),i=idxOf(id),a=ms();
      if(i<0){closeSheet();return'done';}
      if(!m.eb){m.eb=[{oc:m.t,tail:deep(a.slice(i+1)),ts:m.ts}];m.ei=0;}
      else m.eb[m.ei]={oc:m.t,tail:deep(a.slice(i+1)),ts:Date.now()};
      m.eb.push({oc:v,tail:[],ts:Date.now()});m.ei=m.eb.length-1;m.t=v;
      MSG[s.id]=a.slice(0,i+1);
      saveS(s.id);closeSheet();paint();ask();return'done';}});}

/* ── 更多页 ── */
function vMore(){
  function row(t,fn,c){return'<div class="rw pz" onclick="'+fn+'"><span class="l"'
    +(c?' style="color:'+c+'"':'')+'>'+t+'</span>'+I.chevD+'</div>';}
  return'<div class="vw"><div class="hd">'
  +'<button class="cb pz" onclick="drawer(1)">'+I.menu+'</button><span></span></div>'
  +'<div class="sa pgw"><div class="big">更多</div>'
  +'<div class="sc2">怎么说话</div><div class="cd cd0">'
  +row('表达风格','shVoice()')+row('放开一些','shFree()')
  +row('温度和长度','shGen()')+'</div>'
  +'<div class="sc2">我能做的</div><div class="cd cd0">'
  +row('自己动手','shActs()')+row('先开口','shHi()')
  +row('联网查资料','shWeb()')+row('干杂活的模型','shUtil()')+'</div>'
  +'<div class="sc2">样子</div><div class="cd cd0">'
  +row('深浅','shTheme()')+row('背景','shBg()')+'</div>'
  +'<div class="sc2">接口</div><div class="cd cd0">'
  +row('中转设置','shApi()')+row('锁屏密码','shPass()')+'</div>'
  +'<div class="sc2">存了多少</div><div id="stc"><div class="stc">'
  +'<div class="n"><b>…</b></div><div class="pb"><i style="width:2%"></i></div>'
  +'<div class="ln">正在数</div></div></div>'
  +'<div class="cd cd0">'
  +row('导出备份','shExp()')+row('恢复','shRestore()')
  +row('清掉聊天图片','purgeImgs()','var(--red)')+'</div>'
  +'<div class="nt">存在这台手机的本地数据库里。删掉主屏幕图标、'
  +'或者「清除网站数据」会带走它——定期导出一份放进「文件」，才是真的存住了。</div>'
  +'<div style="height:12px"></div></div></div>';}

/* ── 回到底部 + 分段渲染 ── */
var ARWD='<svg class="ic c2" width="18" height="18" viewBox="0 0 24 24" fill="none">'
 +'<path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="1.8" '
 +'stroke-linecap="round" stroke-linejoin="round"/></svg>';
function dnBox(){
  var mw=document.querySelector('#pg .mw');if(!mw)return null;
  var b=document.getElementById('dn');
  if(!b){
    b=document.createElement('button');b.id='dn';b.innerHTML=ARWD;
    b.onclick=function(){
      var box=document.getElementById('ms');if(!box)return;
      try{box.scrollTo({top:box.scrollHeight,behavior:'smooth'});}
      catch(e){box.scrollTop=box.scrollHeight;}};
    mw.appendChild(b);}
  return b;}
function dnSync(){
  var box=document.getElementById('ms'),b=dnBox();
  if(!box||!b)return;
  b.classList.toggle('on',
    (box.scrollHeight-box.clientHeight-box.scrollTop)>400);}
var _paint0=paint;
paint=function(keep){
  _paint0(keep);
  drawParts();
  var box=document.getElementById('ms');
  if(box&&!box.dataset.dn){
    box.dataset.dn='1';
    box.addEventListener('scroll',dnSync,{passive:true});}
  dnBox();dnSync();};
if(CV==='chat')paint(1);
</script>
