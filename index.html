<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>I MISS U</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
:root{--bg:#F5F3EE;--ink:#1A1815;--ink2:#2B2620;--dim:#9A958B;--dim2:#B8B3A8;
  --line:#ECE8DF;--card:#FFF;--me:#ECEAE4;--rose:#C97B6E;--onink:#F5F3EE;
  --i1:#48453E;--i2:#9A958B;--i3:#D1CCC2;
  --fld:#FFF;--fldb:#E7E3DA;--ibx:#FBFAF7;--chip:#F2EFE8;--cbx:#2B2620;--cbxt:#F0EDE6;
  --tag1:#EDEAE2;--tag1t:#7C766C;--tag2:#E8EDE4;--tag2t:#6E7A62;
  --tag3:#F3E4DF;--tag3t:#A9736A;--tag4:#E7EAEE;--tag4t:#6D7480;
  --hi:rgba(201,123,110,.2);--sd:rgba(43,38,30,.05);--sd2:rgba(43,38,30,.1);
  --gl:#EFEBE2;--tstb:rgba(255,255,255,.88);--tstt:#4A443C;--ovl:rgba(0,0,0,.2);
  --dr:#EBE7DF;--dr2:#F0ECE4;--dl:#E4DED4;--red:#C0564C;--red2:#B5514A;--gr:#8C9E7E;
  --st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --pb:max(5px,calc(var(--sb) - 16px));--inset:17px}
html.dark{--bg:#16140F;--ink:#EAE5DA;--ink2:#DED8CC;--dim:#8B857A;--dim2:#6E6961;
  --line:#2A261F;--card:#1E1B16;--me:#2C2822;--rose:#D48F80;--onink:#16140F;
  --i1:#C6C0B4;--i2:#8B857A;--i3:#4E483F;
  --fld:#1C1914;--fldb:#302B24;--ibx:#1B1813;--chip:#272319;--cbx:#0D0B08;--cbxt:#DDD7CB;
  --tag1:#2A2620;--tag1t:#9A9488;--tag2:#232A20;--tag2t:#8D9A80;
  --tag3:#33231F;--tag3t:#C08F84;--tag4:#22262C;--tag4t:#8A929E;
  --hi:rgba(212,143,128,.26);--sd:rgba(0,0,0,.32);--sd2:rgba(0,0,0,.5);
  --gl:#1D1A15;--tstb:rgba(48,44,37,.93);--tstt:#E6E1D6;--ovl:rgba(0,0,0,.52);
  --dr:#26221C;--dr2:#231F1A;--dl:#332E27;--red:#D4736A;--red2:#D4736A;--gr:#7E8F70}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit;border:none;background:none}
textarea,input{-webkit-appearance:none;border-radius:0}
input[type=date]{color-scheme:light}
html.dark input[type=date]{color-scheme:dark;color:var(--ink2)}
.hide{display:none!important}
.sa{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.sa::-webkit-scrollbar{width:0;display:none}
.pz{transition:transform .12s ease,opacity .12s ease}
.pz:active{transform:scale(.95);opacity:.75}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sldL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sldU{from{transform:translateY(100%)}to{transform:none}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shk{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-2px)}}
@keyframes fl{0%{background:var(--hi)}100%{background:transparent}}
@keyframes wdrop{from{transform:translateY(-100%)}to{transform:none}}
@keyframes udrop{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}

#root{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#warn{flex:none;background:#B4453C;color:#FFF;padding:calc(var(--st) + 9px) 16px 11px;
  display:flex;align-items:center;gap:11px;animation:wdrop .3s ease both;z-index:50}
#warn .wt{flex:1;font-size:13px;line-height:1.5;font-weight:500}
#warn .wb{flex:none;background:rgba(255,255,255,.2);border-radius:14px;padding:7px 13px;
  font-size:13px;font-weight:600;color:#FFF}
#warn .wx{flex:none;width:26px;height:26px;opacity:.7;font-size:17px;line-height:26px;text-align:center}
html.warned .hd{padding-top:9px}
html.warned .pgw{padding-top:2px}
#undo{position:fixed;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);
  background:rgba(38,34,29,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#F2EFE8;border-radius:19px;padding:9px 9px 9px 17px;display:flex;align-items:center;gap:13px;
  box-shadow:0 8px 26px -10px rgba(30,25,20,.5);z-index:955;animation:udrop .24s ease both;max-width:88vw}
html.dark #undo{background:rgba(60,55,46,.96)}
html.warned #undo{top:calc(var(--st) + 64px)}
#undo .ut{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#undo .ub{flex:none;background:rgba(255,255,255,.17);border-radius:13px;padding:6px 13px;
  font-size:13px;font-weight:600;color:#FFF}

#lk{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:calc(var(--st) + 32px) 26px 14px;animation:fade .5s ease both}
#lk:before{content:'';position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(var(--gl),transparent);pointer-events:none}
#lk.out{opacity:0;transition:opacity .4s ease;pointer-events:none}
#lk .jp{position:relative;font:400 33px/1 "Hiragino Mincho ProN","Yu Mincho","Songti SC",serif;
  letter-spacing:.2em;color:var(--ink2);text-indent:.2em}
#lk .en{margin-top:15px;font-size:10.5px;letter-spacing:.38em;color:var(--dim2);font-weight:500}
#dts{display:flex;gap:15px;margin:38px 0 34px}
#dts i{width:9px;height:9px;border-radius:50%;background:var(--dl);transition:.2s}
#dts i.on{background:var(--dim);transform:scale(1.25)}
#lk.er #dts{animation:shk .44s}
#pad{display:grid;grid-template-columns:repeat(3,78px);gap:17px}
#pad button{height:78px;border-radius:50%;background:var(--ibx);font:300 27px/1 -apple-system;color:var(--ink2);
  box-shadow:0 1px 2px var(--sd),0 8px 20px -12px var(--sd2);
  display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
#pad button:active{transform:scale(.9);background:var(--dr2)}
#pad button.f{background:none;box-shadow:none}

#pg{flex:1;min-height:0;position:relative}
.vw{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .22s ease both}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:9px;
  padding:calc(var(--st) + 8px) calc(14px + var(--sr)) 9px calc(14px + var(--sl))}
.cb{width:40px;height:40px;flex:none;border-radius:50%;background:var(--card);display:flex;align-items:center;
  justify-content:center;box-shadow:0 0 0 1px var(--sd),0 2px 6px var(--sd)}
.pill{height:40px;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:20px;padding:0 15px;
  box-shadow:0 0 0 1px var(--sd),0 2px 6px var(--sd);max-width:162px;min-width:0}
.pill span{font-size:13px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.hdt{font-size:15px;font-weight:600}
.pgw{flex:1;min-height:0;padding:2px calc(20px + var(--sr)) 24px calc(20px + var(--sl))}
.big{font:700 30px/1.2 -apple-system;letter-spacing:-.03em}
.sub{margin-top:5px;font-size:14px;color:var(--dim)}

.mw{flex:1;min-height:0;position:relative}
.mw .fg{position:absolute;left:0;right:0;height:22px;z-index:4;pointer-events:none}
.mw .fg.t{top:0;background:linear-gradient(var(--bg),transparent)}
.mw .fg.b{bottom:0;background:linear-gradient(transparent,var(--bg))}
#ms{position:absolute;inset:0;padding:12px calc(20px + var(--sr)) 22px calc(20px + var(--sl))}
.dsep{text-align:center;font-size:11.5px;color:var(--dim2);margin:2px 0 22px;letter-spacing:.03em}
.gsep{display:flex;align-items:center;gap:10px;margin:2px 0 24px}
.gsep i{flex:1;height:1px;background:var(--line)}
.gsep span{flex:none;font-size:11px;color:var(--dim2);letter-spacing:.04em}
.m{margin-bottom:30px;display:flex;flex-direction:column;animation:up .3s ease both}
.m.me{align-items:flex-end}.m.ai{align-items:flex-start}
.m .in{max-width:100%;width:100%}
.m.me .in{max-width:84%;width:auto}
.bd{font-size:16px;line-height:1.78;letter-spacing:-.008em;word-break:break-word;white-space:pre-wrap}
.m.me .bd{background:var(--me);border-radius:22px;padding:12px 17px;color:var(--ink2)}
.m.ai .bd{padding:0 1px;color:var(--ink2)}
.m.flash .bd{animation:fl 1.9s ease}
.bd b{font-weight:600}.bd em{font-style:italic}
.bd code{background:var(--chip);border-radius:5px;padding:1px 5px;font:13.5px ui-monospace,Menlo,monospace}
.bd .cbx{background:var(--cbx);color:var(--cbxt);border-radius:12px;padding:12px 14px;margin:9px 0;
  font:13px/1.6 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
.pic{display:block;max-width:200px;width:100%;border-radius:15px;margin-bottom:7px}
.gone{font-size:12px;color:var(--dim2);background:var(--gl);border-radius:11px;padding:7px 12px;
  margin-bottom:7px;display:inline-block}
.qt{border-left:2.5px solid var(--dl);padding:2px 0 2px 13px}
.qt .qh{font-size:11.5px;color:var(--dim2);font-weight:600;margin-bottom:6px;display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.qt .qb{font-size:13.5px;line-height:1.7;color:var(--dim);white-space:pre-wrap}
.thk{margin-bottom:13px}
.thk button{display:flex;align-items:center;gap:9px;width:100%;padding:3px 0;text-align:left}
.thk span{flex:1;font-size:13.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbx{margin-bottom:13px;border-left:2.5px solid var(--tag4t);padding:1px 0 1px 12px}
.wbx .wh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
.wbx .wl{margin-top:5px;font-size:12.5px;line-height:1.8}
.wbx .wl a{color:var(--tag4t);text-decoration:none;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.gap{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim2);
  margin-bottom:9px;font-weight:600}
.ops{display:flex;align-items:center;gap:14px;margin-top:11px;opacity:.6}
.nav{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim2);font-weight:600;
  font-variant-numeric:tabular-nums}
.nav button{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.nav button[disabled]{opacity:.28}
.eo{display:flex;align-items:center;justify-content:flex-end;gap:11px;margin-top:6px;opacity:.5}
.eo button{width:25px;height:25px;display:flex;align-items:center;justify-content:center}
.err{margin-top:9px;font-size:12.5px;color:var(--red2);line-height:1.6}
.err button{color:var(--rose);font-weight:600;font-size:12.5px;margin-left:8px}
.typ{display:flex;gap:4px;padding:2px 0 4px;align-items:center}
.typ i{width:5px;height:5px;border-radius:50%;background:var(--dim2);animation:dots 1.4s ease-in-out infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
.typ span{margin-left:7px;font-size:12.5px;color:var(--dim2)}
.wm{position:sticky;top:46%;left:50%;transform:translate(-50%,-50%);width:0;height:0;
  display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.m.pick .in{position:relative;padding-left:30px}
.m.pick.me .in{padding-left:0;padding-right:30px}
.ck{position:absolute;top:2px;left:0;width:21px;height:21px;border-radius:50%;
  border:1.6px solid var(--dl);background:var(--ibx)}
.m.pick.me .ck{left:auto;right:0}
.m.on .ck{background:var(--ink);border-color:var(--ink)}
.m.on .ck:after{content:'';position:absolute;left:6px;top:5px;width:6px;height:9px;
  border-right:2px solid var(--onink);border-bottom:2px solid var(--onink);transform:rotate(40deg)}

.ib{flex:none;padding:5px calc(13px + var(--sr)) var(--pb) calc(13px + var(--sl))}
html.kbon .ib{padding-bottom:4px}
.ibx{background:var(--ibx);border:1px solid var(--fldb);border-radius:25px;padding:15px 16px 10px;
  box-shadow:0 1px 3px var(--sd)}
.att{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.att .a{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--chip)}
.att .a img{width:100%;height:100%;object-fit:cover;display:block}
.att .a button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;
  background:rgba(26,24,21,.72);color:#fff;font-size:12px;line-height:19px;text-align:center}
#ta{display:block;width:100%;min-height:26px;resize:none;outline:none;background:none;font-size:16px;
  line-height:1.55;color:var(--ink2);padding:1px 3px 12px;font-weight:300}
#ta::placeholder{color:var(--dim2);font-weight:300}
.ibr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{width:31px;height:31px;flex:none;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center}
.mini.on{background:var(--tag4t)}
.mini.on .ic{color:#FFF}
.mchip{display:flex;align-items:center;background:var(--chip);border-radius:17px;padding:7px 13px;max-width:142px}
.mchip span{font-size:13px;font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd{width:39px;height:39px;flex:none;border-radius:50%;background:var(--ink);display:flex;
  align-items:center;justify-content:center;transition:opacity .18s,transform .12s}
.snd.off{opacity:.26}
.selbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px calc(20px + var(--sr)) var(--pb) calc(20px + var(--sl));background:var(--ibx);
  border-top:1px solid var(--line)}
.selbar .c{font-size:13.5px;color:var(--dim)}
.selbar button{font-size:15px;font-weight:600}

.sbox{flex:none;padding:0 calc(20px + var(--sr)) 12px calc(20px + var(--sl))}
.sbox .w{display:flex;align-items:center;gap:9px;background:var(--fld);border:1px solid var(--fldb);
  border-radius:16px;padding:12px 14px}
.sbox input{flex:1;min-width:0;outline:none;font-size:16px}
.sbox input::placeholder{color:var(--dim2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 calc(20px + var(--sr)) 12px calc(20px + var(--sl))}
.chips button{flex:none;border:1px solid var(--fldb);background:var(--fld);border-radius:15px;padding:7px 13px;
  font-size:13px;color:var(--dim)}
.chips button.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.chips button.tr.on{background:#A8524A;border-color:#A8524A;color:#FFF}
.res{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;
  box-shadow:0 1px 2px var(--sd),0 8px 22px -14px var(--sd2)}
.res .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.res .rt{font-size:11.5px;color:var(--dim2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .who{font-size:12px;color:var(--rose);font-weight:600;flex:none}
.res .rb{font-size:14.5px;line-height:1.7;color:var(--ink2);word-break:break-word}
.res .rc{font-size:13px;line-height:1.65;color:var(--dim);margin-top:7px;
  padding-left:10px;border-left:2px solid var(--line);white-space:pre-wrap}
.res .ra{display:flex;gap:18px;margin-top:12px}
.res .ra button{font-size:13px;font-weight:600;color:var(--rose)}
.res .ra button.g{color:var(--dim)}
mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:13vh 24px;color:var(--dim2);font-size:14px;line-height:1.85}

.mcd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 17px 13px;margin-bottom:11px;
  box-shadow:0 1px 2px var(--sd),0 8px 22px -14px var(--sd2)}
.mcd.lk{border-color:var(--tag3t)}
.mcd.gr{opacity:.6}
.mcd.pk{position:relative;padding-left:46px}
.mcd.pk .ck2{position:absolute;left:16px;top:16px;width:21px;height:21px;border-radius:50%;
  border:1.6px solid var(--dl);background:var(--fld)}
.mcd.pk.on{border-color:var(--rose)}
.mcd.pk.on .ck2{background:var(--rose);border-color:var(--rose)}
.mcd.pk.on .ck2:after{content:'';position:absolute;left:6px;top:5px;width:6px;height:9px;
  border-right:2px solid #FFF;border-bottom:2px solid #FFF;transform:rotate(40deg)}
.mcd .t{font-size:15px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.mcd .mt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}
.tag{font-size:10.5px;font-weight:600;border-radius:6px;padding:2.5px 7px;flex:none}
.tag.me{background:var(--tag1);color:var(--tag1t)}
.tag.ai{background:var(--tag2);color:var(--tag2t)}
.tag.lk{background:var(--tag3);color:var(--tag3t)}
.tag.ct{background:var(--tag4);color:var(--tag4t)}
.imp{display:flex;align-items:center;gap:2.5px;flex:none}
.imp i{width:5px;height:5px;border-radius:50%;background:var(--dl)}
.imp i.on{background:var(--tag3t)}
.mcd .f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.mcd .ts{font-size:11.5px;color:var(--dim2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcd .ts b{font-weight:500;color:var(--rose)}
.mcd .a{display:flex;gap:15px;flex:none}
.mcd .a button{font-size:12.5px;color:var(--dim2);font-weight:500}
.mcd .a button.r{color:var(--rose)}
.exb{background:var(--card);border:1px solid var(--tag3t);border-radius:18px;padding:14px 16px;
  margin-bottom:13px;display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 2px var(--sd),0 8px 22px -14px var(--sd2)}
.exb .x1{flex:1;min-width:0}
.exb .x1 b{display:block;font-size:14.5px;font-weight:600}
.exb .x1 s{text-decoration:none;display:block;font-size:12px;color:var(--dim2);margin-top:3px}
.exb .x2{flex:none;background:var(--ink);color:var(--onink);border-radius:15px;padding:9px 15px;
  font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--dl);
  border-top-color:var(--rose);animation:spin .7s linear infinite;flex:none}

.stc{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:11px;
  box-shadow:0 1px 2px var(--sd),0 10px 28px -14px var(--sd2)}
.stc .n{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stc .n b{font:700 22px/1 -apple-system;letter-spacing:-.02em}
.stc .n s{text-decoration:none;font-size:12.5px;color:var(--dim2)}
.stc .pb{height:6px;border-radius:3px;background:var(--line);margin:13px 0 10px;overflow:hidden}
.stc .pb i{display:block;height:100%;border-radius:3px;background:var(--gr);transition:width .3s}
.stc.w .pb i{background:#D19A5E}

/* ══════ 记忆算法 ══════ */
function bigr(s){
  var o=[],x=(s||'').toLowerCase().replace(/[\s，。、！？,.!?~…"'）（()]/g,'');
  for(var i=0;i<x.length-1;i++)o.push(x.substr(i,2));
  return o;}
function ovl(a,b){
  var A=bigr(a),B={},n=0;
  bigr(b).forEach(function(x){B[x]=(B[x]||0)+1;});
  A.forEach(function(x){if(B[x]>0){n++;B[x]--;}});
  return n;}
function simRate(a,b){
  var la=bigr(a).length,lb=bigr(b).length;
  if(!la||!lb)return 0;
  return ovl(a,b)/Math.max(4,Math.min(la,lb));}
function dupOf(t,skip){
  var best=null,bs=0;
  D.mems.forEach(function(m){
    if(m.del||m.id===skip)return;
    var r=simRate(m.t,t);
    if(r>bs){bs=r;best=m;}});
  return bs>=0.56?{m:best,r:bs}:null;}
function live(){return D.mems.filter(function(m){return!m.del;});}
function pickMems(q){
  var ls=live();
  if(ls.length<=MEMCAP)return ls;
  var lk=[],rest=[],now=Date.now();
  ls.forEach(function(m){(m.lock?lk:rest).push(m);});
  rest.forEach(function(m){
    var rel=q?ovl(m.t,q):0;
    var age=Math.max(0,1-(now-m.ts)/(120*MS));
    m._s=rel*5+(m.imp||2)*4+Math.min(8,(m.hits||0))+age*6;});
  rest.sort(function(a,b){return b._s-a._s;});
  return lk.concat(rest.slice(0,Math.max(0,MEMCAP-lk.length)));
}
function bump(ls){
  var now=Date.now();
  ls.forEach(function(m){m.hits=(m.hits||0)+1;m.used=now;});
}

function shrink(file,cb){
  var r=new FileReader();
  r.onerror=function(){cb(null);};
  r.onload=function(){
    var im=new Image();

    im.onload=function(){
      var M=900,w=im.width,h=im.height;
      if(w>M||h>M){var s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.68));};

  r.readAsDataURL(file);
}

function toC(x,an){
  if(x.r==='quote')return'【我们以前说过的 · '+(x.from||'')+'】\n'+x.t;
  var p=[];
  if(x.img&&x.img.length)x.img.forEach(function(u){

    else p.push({type:'image_url',image_url:{url:u}});});

function buildMsgs(an,greeting){
  var n=Math.max(2,Math.min(60,D.ctx||20));
  var a=S().ms.filter(function(x){return(x.t||(x.img&&x.img.length))&&!x.err&&!x.st;}).slice(-n),out=[];
  a.forEach(function(x){
    var role=(x.r==='ai')?'assistant':'user',c=toC(x,an);
    if(out.length&&out[out.length-1].role===role)
      out[out.length-1].content=mergeC(out[out.length-1].content,c);
    else out.push({role:role,content:c});});
  while(out.length&&out[0].role!=='user')out.shift();

      out.push({role:'user',content:'（她回来了，还没开口。）'});

function ask(after){

function goReq(m,after,q,sid){
  var an=D.fmt!=='openai',body,mt=Math.max(256,Math.min(8192,D.maxTok||2048));
  var greeting=!!GREET;
  if(an){
    body={model:D.model,max_tokens:mt,stream:true,system:sysBlocks(q),messages:buildMsgs(1,greeting)};
    if(D.think)body.thinking={type:'enabled',budget_tokens:Math.max(1024,Math.min(mt-512,2048))};
    else body.temperature=Math.max(0,Math.min(1,D.temp==null?1:D.temp));
  }else body={model:D.model,stream:true,max_tokens:mt,
    temperature:Math.max(0,Math.min(2,D.temp==null?1:D.temp)),
    messages:[{role:'system',content:sysText(q)}].concat(buildMsgs(0,greeting))};
  WEBTXT='';GREET='';
  var ac=window.AbortController?new AbortController():null;
  ABORT=ac;
  fetch(D.apiUrl,{method:'POST',signal:ac?ac.signal:undefined,
    headers:an?{'Content-Type':'application/json','x-api-key':D.apiKey,'anthropic-version':'2023-06-01'}
              :{'Content-Type':'application/json','Authorization':'Bearer '+D.apiKey},
    body:JSON.stringify(body)})
  .then(function(res){
    if(!res.ok)return res.text().then(function(t){throw new Error('接口返回 '+res.status+'：'+t.slice(0,140));});
    if(!res.body)return res.text().then(function(t){m.t=plain(t,an);});
    return pump(res,m,an,sid);})
  .then(function(){done(m,after,0,ac);})
  .catch(function(e){
    if(e&&e.name==='AbortError'){done(m,after,1,ac);return;}
    var g=String(e&&e.message||e);
    if(/Failed to fetch|NetworkError|Load failed/i.test(g))
      g='连不上接口。可能地址写错，或这家中转不允许网页直连（CORS）。';
    m.err=g;done(m,after,0,ac);});
}
function plain(t,an){try{var j=JSON.parse(t);
  if(an)return(j.content||[]).map(function(b){return b.text||'';}).join('');
  var c=(j.choices||[])[0];return c&&c.message?c.message.content:'';}catch(e){return'';}}
function pump(res,m,an,sid){
  var rd=res.body.getReader(),dec=new TextDecoder(),bf='';
  return(function read(){
    return rd.read().then(function(r){
      if(r.done)return;
      bf+=dec.decode(r.value,{stream:true});
      var ls=bf.split('\n');bf=ls.pop();
      ls.forEach(function(ln){
        ln=ln.trim();if(!ln||ln.slice(0,5)!=='data:')return;
        var d=ln.slice(5).trim();if(!d||d==='[DONE]')return;
        var j;try{j=JSON.parse(d);}catch(e){return;}
        if(an){
          if(j.type==='content_block_delta'&&j.delta){
            if(j.delta.type==='text_delta')m.t+=(j.delta.text||'');
            else if(j.delta.type==='thinking_delta')m.k+=(j.delta.thinking||'');
          }else if(j.type==='error'&&j.error)m.err=j.error.message||'接口报错';
        }else{
          var c=(j.choices||[])[0];
          if(c&&c.delta){
            if(c.delta.content)m.t+=c.delta.content;
            if(c.delta.reasoning_content)m.k+=c.delta.reasoning_content;}
        }});
      if(!sid||S().id===sid){
        if(m.k&&!m._ks){m._ks=1;paint();}
        var el=document.getElementById('b-'+m.id);
        if(el){el.innerHTML=md(m.t);stick();}}
      return read();});})();
}
function done(m,after,ab,ac){
  m.st=0;delete m._ks;BUSY=false;
  if(!ac||ABORT===ac)ABORT=null;
  if(!m.t&&!m.err)m.err=ab?'停下了。':'没有收到内容。';
  if(after)after(m);
  save();
  if(CV==='chat'){paint();btn();}
}

function bigr(s){
  var o=[],x=(s||'').toLowerCase().replace(/[\s，。、！？,.!?~…"'）（()]/g,'');

function ovl(a,b){
  var A=bigr(a),B={},n=0;

  A.forEach(function(x){if(B[x]>0){n++;B[x]--;}});

  rest.forEach(function(m){

function ask(after){
  var s=S();BUSY=true;
  var q=lastQ();
  if(!D.apiUrl||!D.apiKey){WEBTXT='';fake(after);return;}
  var m={id:uid(),r:'ai',t:'',k:'',st:1,ts:Date.now()};

      paint();go(m,after,q);

  }else{WEBTXT='';paint();btn();go(m,after,q);}
}
function go(m,after,q){
  var an=D.fmt!=='openai',body,mt=Math.max(256,Math.min(8192,D.maxTok||2048));
  if(an){
    body={model:D.model,max_tokens:mt,stream:true,system:sysBlocks(q),messages:buildMsgs(1)};
    if(D.think)body.thinking={type:'enabled',budget_tokens:Math.max(1024,Math.min(mt-512,2048))};
    else body.temperature=Math.max(0,Math.min(1,D.temp==null?1:D.temp));
  }else body={model:D.model,stream:true,max_tokens:mt,
    temperature:Math.max(0,Math.min(2,D.temp==null?1:D.temp)),
    messages:[{role:'system',content:sysText(q)}].concat(buildMsgs(0))};
  WEBTXT='';
  ABORT=window.AbortController?new AbortController():null;
  fetch(D.apiUrl,{method:'POST',signal:ABORT?ABORT.signal:undefined,
    headers:an?{'Content-Type':'application/json','x-api-key':D.apiKey,'anthropic-version':'2023-06-01'}
              :{'Content-Type':'application/json','Authorization':'Bearer '+D.apiKey},
    body:JSON.stringify(body)})
  .then(function(res){
    if(!res.ok)return res.text().then(function(t){throw new Error('接口返回 '+res.status+'：'+t.slice(0,140));});
    if(!res.body)return res.text().then(function(t){m.t=plain(t,an);});
    return pump(res,m,an);})
  .then(function(){done(m,after);})
  .catch(function(e){
    if(e&&e.name==='AbortError'){done(m,after,1);return;}
    var g=String(e&&e.message||e);
    if(/Failed to fetch|NetworkError|Load failed/i.test(g))
      g='连不上接口。可能地址写错，或这家中转不允许网页直连（CORS）。';
    m.err=g;done(m,after);});
}
function plain(t,an){try{var j=JSON.parse(t);
  if(an)return(j.content||[]).map(function(b){return b.text||'';}).join('');
  var c=(j.choices||[])[0];return c&&c.message?c.message.content:'';}catch(e){return'';}}
function pump(res,m,an){
  var rd=res.body.getReader(),dec=new TextDecoder(),bf='';
  return(function read(){
    return rd.read().then(function(r){
      if(r.done)return;
      bf+=dec.decode(r.value,{stream:true});
      var ls=bf.split('\n');bf=ls.pop();
      ls.forEach(function(ln){
        ln=ln.trim();if(!ln||ln.slice(0,5)!=='data:')return;
        var d=ln.slice(5).trim();if(!d||d==='[DONE]')return;
        var j;try{j=JSON.parse(d);}catch(e){return;}
        if(an){
          if(j.type==='content_block_delta'&&j.delta){
            if(j.delta.type==='text_delta')m.t+=(j.delta.text||'');
            else if(j.delta.type==='thinking_delta')m.k+=(j.delta.thinking||'');
          }else if(j.type==='error'&&j.error)m.err=j.error.message||'接口报错';
        }else{
          var c=(j.choices||[])[0];
          if(c&&c.delta){
            if(c.delta.content)m.t+=c.delta.content;
            if(c.delta.reasoning_content)m.k+=c.delta.reasoning_content;}
        }});
      if(m.k&&!m._ks){m._ks=1;paint();}
      var el=document.getElementById('b-'+m.id);
      if(el){el.innerHTML=md(m.t);stick();}
      return read();});})();
}
function done(m,after,ab){
  m.st=0;delete m._ks;BUSY=false;ABORT=null;

  D.sess.unshift({id:uid(),ti:(s.ti||'对话')+' · 分支',ms:deep(s.ms.slice(0,i+1)),at:Date.now(),ex:s.ex||0});
  D.cur=0;save();closeSheet(1);view('chat');toast('开了一段新的');
}
function delVer(id){
  var m=find(id);if(!m||!m.br||m.br.length<2)return;
  var bi=m.bi||0;m.br.splice(bi,1);
  var ni=Math.min(bi,m.br.length-1);
  m.bi=ni;m.t=m.br[ni].t;m.k=m.br[ni].k;
  if(m.br.length<2){delete m.br;delete m.bi;}
  save();closeSheet(1);paint(1);toast('删了这个版本');
}
function delMsg(id){
  var s=S(),i=idxOf(id);if(i<0)return;
  s.ms.splice(i,1);save();closeSheet(1);paint(1);
}
function selStart(id){SEL=id?[id]:[];closeSheet(1);view('chat');selCount();}
function selEnd(){SEL=null;view('chat');}
function pickMsg(id){
  if(!SEL)return;
  var i=SEL.indexOf(id);
  if(i>=0)SEL.splice(i,1);
  else{if(SEL.length>=10){toast('一次最多十条');return;}SEL.push(id);}
  paint(1);selCount();
}
function selCount(){var e=document.getElementById('selc');if(e)e.textContent='已选 '+SEL.length;}
function delSel(){
  if(!SEL||!SEL.length){toast('还没选');return;}
  var n=SEL.length,s=S();
  s.ms=s.ms.filter(function(m){return SEL.indexOf(m.id)<0;});
  save();SEL=null;view('chat');toast('删了 '+n+' 条');
}

function expand(w){
  var o=[w];
  SYN.forEach(function(g){
    var hit=g.some(function(x){return w.indexOf(x)>=0||x.indexOf(w)>=0;});
    if(hit)o=o.concat(g);});
  return o.filter(function(x,i,a){return a.indexOf(x)===i;});
}
function parseDate(s){
  s=(s||'').replace(/\s/g,'');if(!s)return null;
  var t=today(),y=t.getFullYear(),m;
  if(/^(今天|today)$/i.test(s))return{a:d0(t),b:d0(t)+MS,lab:'今天'};
  if(/^昨天$/.test(s))return{a:d0(t)-MS,b:d0(t),lab:'昨天'};
  if(/^前天$/.test(s))return{a:d0(t)-2*MS,b:d0(t)-MS,lab:'前天'};
  m=s.match(/^(\d+)天前$/);
  if(m){var n=+m[1];return{a:d0(t)-n*MS,b:d0(t)-(n-1)*MS,lab:n+'天前'};}
  if(/^(这周|本周)$/.test(s)){var w=(t.getDay()+6)%7;return{a:d0(t)-w*MS,b:d0(t)+MS,lab:'这周'};}
  if(/^上周$/.test(s)){var w2=(t.getDay()+6)%7,b=d0(t)-w2*MS;return{a:b-7*MS,b:b,lab:'上周'};}
  if(/^(这个月|本月)$/.test(s))return{a:new Date(y,t.getMonth(),1).getTime(),b:d0(t)+MS,lab:'这个月'};
  if(/^(上个月|上月)$/.test(s))return{a:new Date(y,t.getMonth()-1,1).getTime(),
    b:new Date(y,t.getMonth(),1).getTime(),lab:'上个月'};
  m=s.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){var d=new Date(+m[1],+m[2]-1,+m[3]);return{a:d0(d),b:d0(d)+MS,lab:dlab(d.getTime())};}
  m=s.match(/^(\d{4})[-\/年](\d{1,2})月?$/);
  if(m)return{a:new Date(+m[1],+m[2]-1,1).getTime(),b:new Date(+m[1],+m[2],1).getTime(),
    lab:m[1]+'年'+(+m[2])+'月'};
  m=s.match(/^(\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){var d2=new Date(y,+m[1]-1,+m[2]);
    if(d0(d2)>d0(t))d2=new Date(y-1,+m[1]-1,+m[2]);
    return{a:d0(d2),b:d0(d2)+MS,lab:dlab(d2.getTime())};}
  m=s.match(/^(\d{1,2})月$/);
  if(m){var mo=+m[1]-1,yy=y;if(mo>t.getMonth())yy=y-1;
    return{a:new Date(yy,mo,1).getTime(),b:new Date(yy,mo+1,1).getTime(),lab:(mo+1)+'月'};}
  return null;
}
function splitQ(q){
  var ps=(q||'').trim().split(/\s+/).filter(Boolean),dr=null,kw=[];
  var whole=parseDate(q);
  if(whole)return{dr:whole,kw:[]};
  ps.forEach(function(p){var d=parseDate(p);if(d&&!dr)dr=d;else kw.push(p);});
  return{dr:dr,kw:kw};
}
function score(t,kw){
  if(!kw.length)return 1;
  var low=(t||'').toLowerCase(),sc=0;
  kw.forEach(function(w){
    var W=w.toLowerCase();
    if(low.indexOf(W)>=0){sc+=6;return;}
    var hit=0;
    expand(w).forEach(function(x){if(low.indexOf(x.toLowerCase())>=0)hit=1;});
    if(hit){sc+=3;return;}
    if(W.length>=2)for(var i=0;i<W.length-1;i++)
      if(low.indexOf(W.substr(i,2))>=0){sc+=1;break;}});
  return sc;
}
function hi(t,kw){
  var s=esc(t);
  (kw||[]).forEach(function(w){
    if(!w)return;
    try{var r=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      s=s.replace(r,function(x){return'<mark>'+x+'</mark>';});}catch(e){}});
  return s;
}
function cut(t,kw,n){
  n=n||110;
  if(!t)return'';
  if(t.length<=n)return t;
  var p=-1;
  (kw||[]).forEach(function(w){
    if(p<0&&w){var i=t.toLowerCase().indexOf(w.toLowerCase());if(i>=0)p=i;}});
  if(p<0)return t.slice(0,n)+'…';
  var a=Math.max(0,p-30);
  return(a?'…':'')+t.substr(a,n)+(a+n<t.length?'…':'');
}

function runFind(){
  var i=document.getElementById('fq');if(i)FQ=i.value;
  var box=document.getElementById('fres');if(!box)return;
  var sp=splitQ(FQ),res=[],mres=[];
  D.sess.forEach(function(s){
    s.ms.forEach(function(m,ix){
      if(!m.t||m.r==='quote'||m.r==='gap')return;
      if(sp.dr&&!(m.ts>=sp.dr.a&&m.ts<sp.dr.b))return;
      var sc=score(m.t,sp.kw);
      if(sc<=0)return;
      res.push({s:s,m:m,i:ix,sc:sc});});});
  live().forEach(function(x){
    if(sp.dr&&!(x.ts>=sp.dr.a&&x.ts<sp.dr.b))return;
    if(score(x.t,sp.kw)>0)mres.push(x);});
  if(sp.kw.length)res.sort(function(a,b){return b.sc-a.sc||b.m.ts-a.m.ts;});
  else res.sort(function(a,b){return b.m.ts-a.m.ts;});
  var h='';
  if(sp.dr)h+='<div class="lbs" style="padding-top:2px">'+sp.dr.lab
    +(sp.kw.length?' · '+esc(sp.kw.join(' ')):'')+' · '+res.length+' 条</div>';
  else if(!FQ.trim())h+='<div class="lbs" style="padding-top:2px">最近说过的</div>';
  else h+='<div class="lbs" style="padding-top:2px">找到 '+res.length+' 条</div>';
  if(mres.length){
    h+='<div class="lbs" style="margin-top:6px">记忆库（'+mres.length+'）</div>';
    mres.slice(0,6).forEach(function(x){
      h+='<div class="res"><div class="rh"><span class="rt">'+dtl(x.ts)
       +(x.cat?' · '+esc(x.cat):'')+'</span>'
       +'<span class="who">'+(x.src==='ai'?'我记的':'你记的')+'</span></div>'
       +'<div class="rb">'+hi(x.t,sp.kw)+'</div>'
       +'<div class="ra"><button onclick="view(\'mem\')">去记忆库</button></div></div>';});
    h+='<div class="lbs" style="margin-top:16px">对话</div>';}
  if(!res.length&&!mres.length)
    h+='<div class="empty">'+(FQ.trim()?'没找到。<br>换个说法，或者只搜日期试试。':'还没有可以翻的东西。')+'</div>';
  res.slice(0,60).forEach(function(r){
    var pv=r.s.ms[r.i+1]&&r.s.ms[r.i+1].t?r.s.ms[r.i+1]:(r.s.ms[r.i-1]&&r.s.ms[r.i-1].t?r.s.ms[r.i-1]:null);
    h+='<div class="res"><div class="rh"><span class="rt">'+esc(r.s.ti||'对话')+' · '+dtl(r.m.ts)+'</span>'
     +'<span class="who">'+(r.m.r==='me'?esc(D.me):esc(D.you))+'</span></div>'
     +'<div class="rb">'+hi(cut(r.m.t,sp.kw),sp.kw)+'</div>'
     +(pv?'<div class="rc">'+esc((pv.r==='me'?D.me:D.you)+'：'+cut(pv.t,[],80))+'</div>':'')
     +'<div class="ra"><button onclick="jump(\''+r.s.id+'\',\''+r.m.id+'\')">跳过去看</button>'
     +'<button class="g" onclick="quoteIn(\''+r.s.id+'\',\''+r.m.id+'\')">带进现在的对话</button></div></div>';});
  box.innerHTML=h;box.scrollTop=0;
}
function jump(sid,mid){
  var i=-1;D.sess.forEach(function(s,j){if(s.id===sid)i=j;});
  if(i<0){toast('那段对话已经不在了');return;}
  D.cur=i;save();closeSheet(1);view('chat');
  setTimeout(function(){
    var el=document.getElementById('m-'+mid);
    if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');}
    else toast('那条消息已经不在了');},140);
}
function quoteIn(sid,mid){
  var s0=sessById(sid);
  if(!s0)return;
  var i=-1;s0.ms.forEach(function(m,j){if(m.id===mid)i=j;});
  if(i<0)return;
  var seg=s0.ms.slice(Math.max(0,i-1),Math.min(s0.ms.length,i+2))
    .filter(function(m){return m.t&&m.r!=='quote'&&m.r!=='gap';});
  var txt=seg.map(function(m){return(m.r==='me'?D.me:D.you)+'：'+m.t;}).join('\n');
  S().ms.push({id:uid(),r:'quote',t:txt,
    from:(s0.ti||'以前')+' · '+dlab(seg.length?seg[0].ts:Date.now()),ts:Date.now()});
  save();view('chat');toast('带进来了');
}

function renderList(){
  var ls=document.getElementById('sls');if(!ls)return;
  ls.className='sa'+(EDIT?' edit':'');

    return'<div class="it'+(i===D.cur&&!EDIT?' on':'')+'" data-i="'+i+'">'

    +(EDIT?'':'<span style="font-size:11px;color:var(--dim2);flex:none">'+ago(s.at||Date.now())+'</span>')

function delSessAt(i){
  D.sess.splice(i,1);
  if(!D.sess.length)D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now(),ex:0}];
  if(D.cur>=D.sess.length)D.cur=D.sess.length-1;
  save();renderList();
  if(CV==='chat'){paint();btn();}
}
function bindList(){
  var ls=document.getElementById('sls');if(!ls)return;
  var tm=null,sy=0,si=-1,hh=46,moved=0;
  ls.addEventListener('touchstart',function(e){
    if(e.target.closest('.dl'))return;
    var it=e.target.closest('.it');if(!it)return;
    si=+it.dataset.i;sy=e.touches[0].clientY;hh=it.offsetHeight+2;moved=0;
    clearTimeout(tm);
    tm=setTimeout(function(){
      EDIT=1;renderList();vib(14);
      var el=document.querySelector('#sls .it[data-i="'+si+'"]');
      if(el){DG={i:si,h:hh,dy:0,el:el};el.classList.add('dg');}},430);
  },{passive:true});
  ls.addEventListener('touchmove',function(e){
    var dy=e.touches[0].clientY-sy;
    if(Math.abs(dy)>9)moved=1;
    if(!DG){if(moved)clearTimeout(tm);return;}
    e.preventDefault();DG.dy=dy;
    DG.el.style.transform='translateY('+dy+'px) scale(1.02)';
    var sh=Math.round(dy/DG.h),to=Math.max(0,Math.min(D.sess.length-1,DG.i+sh));
    [].forEach.call(document.querySelectorAll('#sls .it'),function(el){
      var j=+el.dataset.i;if(j===DG.i)return;
      var t=0;
      if(to>DG.i&&j>DG.i&&j<=to)t=-DG.h;
      if(to<DG.i&&j<DG.i&&j>=to)t=DG.h;
      el.style.transform=t?'translateY('+t+'px)':'';});
  },{passive:false});
  ls.addEventListener('touchend',function(e){
    clearTimeout(tm);
    if(!DG){
      if(!EDIT&&si>=0&&!moved&&!e.target.closest('.dl'))pickSess(si);
      return;}
    var sh=Math.round(DG.dy/DG.h),from=DG.i;
    var to=Math.max(0,Math.min(D.sess.length-1,from+sh));
    DG=null;
    if(to!==from){
      var cu=D.sess[D.cur],it=D.sess.splice(from,1)[0];
      D.sess.splice(to,0,it);D.cur=D.sess.indexOf(cu);save();vib(10);}
    renderList();
  });
}

  D.cur=0;DRAFT='';ATT=[];SEL=null;save();drawer(0);view('chat');
}

  sheet({title:'模型',ok:'用它',
    body:'<div class="lbs">当前模型</div>'
  +'<div class="fd"><input id="m-n" placeholder="照中转的写法填" value="'+esc(D.model)+'"></div>'
  +'<button class="rw pz" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:16px" onclick="addModel()">'
  +'<span class="l" style="color:var(--rose)">＋ 存进常用</span></button>'
  +(ls?'<div class="lbs">常用模型</div><div class="cd cd0">'+ls+'</div>':'')
  +'<div class="nt">中转对模型名的写法不一定一样，报 404 就照它文档改。</div>',
    onOk:function(){var v=val('m-n');if(v)D.model=v;save();}});
}
function addModel(){
  var v=val('m-n');if(!v){toast('先填模型名');return;}
  if(D.models.indexOf(v)<0)D.models.unshift(v);
  D.model=v;save();shModel();toast('存好了');
}
function useModel(m){D.model=m;save();shModel();}
function delModel(m){D.models=D.models.filter(function(x){return x!==m;});save();shModel();}
function shGen(){
  sheet({title:'温度和长度',ok:'保存',
    body:'<div class="lbs">温度 · 越高我越放得开</div>'
  +'<div class="cd"><input type="range" id="g-t" min="0" max="1" step="0.05" value="'+(D.temp==null?1:D.temp)+'" oninput="document.getElementById(\'gt\').textContent=this.value">'
  +'<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim2)">'
  +'<span>稳</span><span id="gt" style="color:var(--ink2);font-weight:600">'+(D.temp==null?1:D.temp)+'</span><span>野</span></div></div>'
  +'<div class="lbs" style="margin-top:16px">一次最多说多长</div>'
  +'<div class="fd"><input id="g-m" type="number" inputmode="numeric" value="'+(D.maxTok||2048)+'"></div>'
  +'<div class="cd cd0"><div class="sw" onclick="tgThink(this)"><span class="l">让我先想一会儿</span>'
  +'<span class="k'+(D.think?' on':'')+'"><i></i></span></div></div>'
  +'<div class="nt">开着思维链的时候温度不生效。很多中转不支持，报错就关掉。'
  +'「往前记得多少条」在聊天页顶上那个按钮里。</div>',
    onOk:function(){
      var t=parseFloat(val('g-t'));if(!isNaN(t))D.temp=t;
      var m=parseInt(val('g-m'),10);if(m)D.maxTok=Math.max(256,Math.min(8192,m));
      save();}});
}
function tgThink(el){D.think=D.think?0:1;el.querySelector('.k').className='k'+(D.think?' on':'');}
function shApi(){
  sheet({title:'中转设置',ok:'保存',
    body:'<div class="seg"><button id="f-a" class="'+(D.fmt!=='openai'?'on':'')+'" onclick="pickFmt(\'anthropic\')">Anthropic</button>'
  +'<button id="f-o" class="'+(D.fmt==='openai'?'on':'')+'" onclick="pickFmt(\'openai\')">OpenAI 兼容</button></div>'
  +'<div class="fd"><input id="k-u" placeholder="'+(D.fmt==='openai'?'https://…/v1/chat/completions':'https://…/v1/messages')+'" value="'+esc(D.apiUrl)+'"></div>'
  +'<div class="fd"><input id="k-k" type="password" placeholder="密钥 sk-…" value="'+esc(D.apiKey)+'"></div>'
  +'<div class="nt">中转能看到我们的对话原文。key 只存在这台手机。</div>',
    onOk:function(){D.apiUrl=val('k-u');D.apiKey=val('k-k');save();toast(D.apiKey?'连上了':'存好了');}});
}
function pickFmt(f){
  D.fmt=f;
  var a=document.getElementById('f-a'),o=document.getElementById('f-o');
  if(a)a.className=(f!=='openai'?'on':'');
  if(o)o.className=(f==='openai'?'on':'');
  var u=document.getElementById('k-u');
  if(u)u.placeholder=f==='openai'?'https://…/v1/chat/completions':'https://…/v1/messages';
}
function shRestore(){
  sheet({title:'恢复',body:'<div class="cd cd0">'
  +'<div class="rw pz" onclick="impFile()"><span class="l">选一个备份文件</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="bkIn()"><span class="l">粘贴备份内容</span>'+I.chevD+'</div></div>'
  +'<div class="nt">恢复会覆盖现在的全部内容。建议先导出一份现在的。</div>'});
}
function shSess(){
  var nw=exNew();
  sheet({title:'这段对话',body:'<div class="cd cd0">'
  +(nw?'<div class="rw pz" onclick="closeSheet(1);exRun()"><span class="l">挑出该记住的（'+nw+' 条没整理）</span>'+I.chevD+'</div>':'')
  +'<div class="rw pz" onclick="renSess()"><span class="l">改个名字</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="copyChat()"><span class="l">复制整段</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="clearChat()"><span class="l">清空消息</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="delSess()"><span class="l" style="color:var(--red)">删掉这段对话</span>'+I.chevD+'</div>'
  +'</div>'});
}
function renSess(){sheet({title:'改名字',ok:'好',
  body:'<div class="fd"><input id="r-t" value="'+esc(S().ti||'')+'"></div>',
  onOk:function(){S().ti=val('r-t')||'新的对话';save();}});}
function copyChat(){
  var s=S();if(!s.ms.length){toast('还没有内容');return;}
  clip(s.ms.filter(function(m){return m.t;}).map(function(m){
    return(m.r==='ai'?D.you:D.me)+'：'+m.t;}).join('\n\n'),
    function(){toast('整段复制好了');});
  closeSheet();
}
function clearChat(){if(BUSY)stop();S().ms=[];S().ex=0;save();closeSheet(1);view('chat');toast('清空了');}
function delSess(){
  if(BUSY)stop();
  D.sess.splice(D.cur,1);
  if(!D.sess.length)D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now(),ex:0}];
  D.cur=0;save();closeSheet(1);view('chat');toast('删了');
}
function bkIn(){sheet({title:'粘贴恢复',ok:'恢复',
  body:'<div class="fd"><textarea id="b-k" style="min-height:200px;font-size:12px" placeholder="把备份内容粘进来。会覆盖现在的全部内容。"></textarea></div>',
  onOk:function(){if(takeIn(val('b-k')))return'done';return false;}});}
function lockNow(){if(BUSY)stop();seen();save();sessionStorage.removeItem('us.ok');location.reload();}
window.addEventListener('pagehide',function(){seen();try{localStorage.setItem(K,JSON.stringify(D));}catch(e){}});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){seen();try{localStorage.setItem(K,JSON.stringify(D));}catch(e){}}});
</script>
</body>
</html>
