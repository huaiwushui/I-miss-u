<title>我们</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#F5F3EE;color:#1A1815;
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
:root{
  --bg:#F5F3EE; --ink:#1A1815; --ink2:#2B2620; --dim:#9A958B; --dim2:#B8B3A8;
  --line:#ECE8DF; --card:#FFF; --me:#ECEAE4; --rose:#C97B6E;
  --st:env(safe-area-inset-top,20px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit;border:none;background:none}
textarea,input{-webkit-appearance:none;border-radius:0}
.hide{display:none!important}
.sa{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.sa::-webkit-scrollbar{width:0;display:none}
.pz{transition:transform .12s ease,opacity .12s ease}
.pz:active{transform:scale(.94);opacity:.75}
.noanim *{animation-duration:0s!important;animation-delay:0s!important}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sldL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sldU{from{transform:translateY(100%)}to{transform:none}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shk{10%,90%{transform:translateX(-6px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-3px)}}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.13)}36%{transform:scale(1)}54%{transform:scale(1.08)}}

/* ══ 根 ══ */
#root{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ══ 锁屏 ══ */
#lk{position:fixed;inset:0;z-index:900;background:linear-gradient(172deg,#F7F4EF,#F0E4DE);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--st) 30px calc(var(--sb) + 26px);animation:fade .45s ease both}
#lk.out{opacity:0;transition:opacity .38s ease;pointer-events:none}
#lk .ht{font-size:38px;animation:beat 2.8s ease-in-out infinite}
#lk .t1{margin-top:16px;font-size:19px;font-weight:600}
#lk .t2{margin-top:5px;font-size:13.5px;color:var(--dim)}
#dts{display:flex;gap:14px;margin:32px 0 28px}
#dts i{width:11px;height:11px;border-radius:50%;background:#E3D8D1;transition:.18s}
#dts i.on{background:var(--rose);transform:scale(1.2)}
#lk.er #dts{animation:shk .45s}
#pad{display:grid;grid-template-columns:repeat(3,72px);gap:15px}
#pad button{height:72px;border-radius:50%;background:rgba(255,255,255,.7);font-size:24px;
  box-shadow:0 1px 3px rgba(90,60,45,.06)}
#pad button.f{background:none;box-shadow:none;font-size:14px;color:var(--dim)}

/* ══ 页容器 ══ */
#pg{flex:1;min-height:0;position:relative}
.vw{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .22s ease both}

/* ══ 顶栏 ══ */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:9px;
  padding:calc(var(--st) + 8px) calc(14px + var(--sr)) 9px calc(14px + var(--sl))}
.cb{width:40px;height:40px;flex:none;border-radius:50%;background:#FFF;display:flex;align-items:center;

.pill{height:40px;display:flex;align-items:center;gap:6px;background:#FFF;border-radius:20px;
  padding:0 14px;box-shadow:0 0 0 1px rgba(43,38,30,.05),0 2px 6px rgba(43,38,30,.05);
  max-width:160px;min-width:0}
.pill span{font-size:13.5px;font-weight:600;color:#3A362F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══ 消息流 ══ */
.mw{flex:1;min-height:0;position:relative}
.mw .fg{position:absolute;left:0;right:0;height:22px;z-index:4;pointer-events:none}
.mw .fg.t{top:0;background:linear-gradient(var(--bg),rgba(245,243,238,0))}
.mw .fg.b{bottom:0;background:linear-gradient(rgba(245,243,238,0),var(--bg))}
#ms{position:absolute;inset:0;padding:12px calc(20px + var(--sr)) 14px calc(20px + var(--sl))}
.m{margin-bottom:30px;display:flex;flex-direction:column;animation:up .3s ease both}
.m.me{align-items:flex-end}
.m.ai{align-items:flex-start}
.m .in{max-width:100%;width:100%}
.m.me .in{max-width:84%;width:auto}
.bd{font-size:16px;line-height:1.78;letter-spacing:-.008em;word-break:break-word;white-space:pre-wrap}
.m.me .bd{background:var(--me);border-radius:22px;padding:12px 17px;color:var(--ink2);white-space:pre-wrap}
.m.ai .bd{padding:0 1px;color:var(--ink2)}
.bd b{font-weight:600}
.bd em{font-style:italic}
.bd code{background:#EBE7DE;border-radius:5px;padding:1px 5px;font:13.5px ui-monospace,Menlo,monospace}
.bd .cbx{background:#2B2620;color:#F0EDE6;border-radius:12px;padding:12px 14px;margin:9px 0;
  font:13px/1.6 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
.thk{margin-bottom:13px}
.thk button{display:flex;align-items:center;gap:9px;width:100%;padding:3px 0;text-align:left}
.thk span{flex:1;font-size:13.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ops{display:flex;align-items:center;gap:14px;margin-top:11px;opacity:.6}
.ops .br{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim2);font-weight:600}
.eo{display:flex;justify-content:flex-end;margin-top:5px;opacity:.42}
.typ{display:flex;gap:4px;padding:2px 0 4px}
.typ i{width:5px;height:5px;border-radius:50%;background:var(--dim2);animation:dots 1.4s ease-in-out infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
.wm{position:sticky;top:46%;left:50%;transform:translate(-50%,-50%);width:0;height:0;
  display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}

/* ══ 输入栏 ══ */
.ib{flex:none;padding:6px calc(13px + var(--sr)) calc(var(--sb) + 6px) calc(13px + var(--sl))}
.ibx{background:#FBFAF7;border:1px solid #E7E3DA;border-radius:25px;padding:15px 16px 11px;

#ta{display:block;width:100%;min-height:26px;max-height:40vh;resize:none;outline:none;
  background:none;font-size:16px;line-height:1.55;color:var(--ink2);padding:1px 3px 13px;font-weight:300}
#ta::placeholder{color:#B5AFA4;font-weight:300}
.ibr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{width:31px;height:31px;flex:none;border-radius:50%;background:#F2EFE8;display:flex;

.mchip{display:flex;align-items:center;background:#F2EFE8;border-radius:17px;padding:7px 13px;max-width:170px}
.mchip span{font-size:13px;font-weight:500;color:#3A362F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd{width:39px;height:39px;flex:none;border-radius:50%;background:var(--ink);display:flex;

  border-radius:20px;padding:10px 17px;font-size:14px;font-weight:500}

/* ══ 底部面板 ══ */
#sh{position:fixed;inset:0;z-index:700}
#sh .ov{position:absolute;inset:0;background:rgba(0,0,0,.2);animation:fade .16s ease both}
#sh .pn{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:17px 17px 0 0;
  padding:11px 0 0;animation:sldU .26s cubic-bezier(.32,.72,0,1) both;max-height:88%;display:flex;flex-direction:column}
#sh .gb{width:36px;height:4px;border-radius:2px;background:#D1CCC2;margin:0 auto 14px;flex:none}
#sh .st{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px 13px;gap:10px}
#sh .st .tt{font-size:16px;font-weight:600}
#sh .st .ok{font-size:14.5px;font-weight:600;color:var(--rose)}
#sh .bdy{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 calc(16px + var(--sr)) calc(var(--sb) + 26px) calc(16px + var(--sl))}
#sh.full .pn{top:calc(var(--st) + 14px);border-radius:17px 17px 0 0;max-height:none;
  background:rgba(252,251,248,.9);backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%)}

/* ══ 通用块 ══ */
.cd{background:var(--card);border:1px solid #EDE9E0;border-radius:19px;padding:16px 17px;
  box-shadow:0 1px 2px rgba(43,38,30,.035),0 10px 28px -14px rgba(43,38,30,.1);margin-bottom:11px}
.cd0{padding:0;overflow:hidden}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px}
.rw+.rw{border-top:1px solid var(--line)}
.rw .l{font-size:15px;font-weight:500}
.rw .r{font-size:13.5px;color:var(--dim);text-align:right;max-width:52%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc2{margin:22px 0 10px;font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:.02em}
.fd{margin-bottom:14px}
.fd label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.fd input,.fd textarea{width:100%;border:1px solid #E7E3DA;background:#FFF;border-radius:13px;
  padding:12px 13px;outline:none;font-size:16px}
.fd textarea{min-height:120px;line-height:1.7;resize:vertical}
.fd input:focus,.fd textarea:focus{border-color:var(--rose)}
.bg{width:100%;border-radius:15px;padding:14px;background:var(--ink);color:#F5F3EE;
  font-size:15px;font-weight:600;margin-top:2px}
.bg.g{background:#FFF;color:var(--dim);border:1px solid #E7E3DA}
.bg.r{background:#FFF;color:#C0564C;border:1px solid #F0DCD8}
.hero{background:linear-gradient(140deg,#CE8577,#B96A63);color:#fff;text-align:center;padding:25px 18px;
  border:none;box-shadow:0 14px 32px -18px rgba(185,106,99,.7)}
.hero .n{font:700 50px/1 -apple-system;letter-spacing:-.04em}
.hero .l{font-size:12.5px;opacity:.86;margin-top:7px;letter-spacing:.05em}
.q{font:400 17px/1.85 "Georgia","Songti SC",serif;color:#4A403A;white-space:pre-wrap;word-break:break-word}
.big{font:700 30px/1.2 -apple-system;letter-spacing:-.03em}
.sub{margin-top:5px;font-size:14px;color:var(--dim)}
#tst{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translateX(-50%);
  background:rgba(26,24,21,.94);color:#F5F3EE;font-size:13.5px;padding:11px 20px;border-radius:21px;
  z-index:950;animation:up .22s ease both;white-space:nowrap;max-width:82vw}
.ic{display:block}
</style>
</head>

/* ═════════ 数据 ═════════ */
var PASS='520720', K='us.v1';
var D={ me:'小u', you:'Renn', start:'', wall:'', annis:[],
  sess:[], cur:0, model:'claude-sonnet-4', style:'我们平常的样子',

try{ var r0=localStorage.getItem(K); if(r0) Object.assign(D,JSON.parse(r0)); }catch(e){}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function toast(t){

  var d=document.createElement('div'); d.id='tst'; d.textContent=t;
  document.body.appendChild(d); setTimeout(function(){ if(d.parentNode) d.remove(); },1900);
}
function md(t){
  var s=esc(t);
  s=s.replace(/```([\s\S]*?)```/g,function(m,c){ return '<div class="cbx">'+c.replace(/^\n/,'')+'</div>'; });
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');

}

function today(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function pd(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dayN(){ var d=pd(D.start); return d? Math.floor((today()-d)/MS)+1 : null; }
function nextAn(s){ var d=pd(s); if(!d) return null; var t=today(),y=t.getFullYear();
  var n=new Date(y,d.getMonth(),d.getDate()); if(n<t) n=new Date(y+1,d.getMonth(),d.getDate());
  return {days:Math.round((n-t)/MS), when:(n.getMonth()+1)+'月'+n.getDate()+'日'}; }
function ago(ts){ var s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return '刚刚'; if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  var d=new Date(ts); return (d.getMonth()+1)+'.'+d.getDate(); }
function hello(){ var h=new Date().getHours();
  if(h<5) return '还没睡呀'; if(h<11) return '早安'; if(h<14) return '午安';
  if(h<18) return '下午好'; if(h<23) return '晚上好'; return '夜深了'; }

var vv = window.visualViewport, root=document.getElementById('root');
var fullH = window.innerHeight;
var kbLast = parseInt(localStorage.getItem('us.kbH')||'0',10) || 0;
var tw = {raf:0, to:0};

function kbGap(){
  if(!vv) return 0;
  if(vv.height > fullH - 60) fullH = Math.max(vv.height, window.innerHeight);
  return Math.round(fullH - vv.height);
}
function tween(el,to,ms,done){
  if(tw.raf && Math.abs(tw.to-to)<2) return;
  cancelAnimationFrame(tw.raf);
  var from=el.getBoundingClientRect().height, t0=performance.now(); tw.to=to;
  (function step(now){
    var p=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-p,3);
    el.style.setProperty('height', Math.round(from+(to-from)*e)+'px','important');
    if(p<1) tw.raf=requestAnimationFrame(step);
    else { tw.raf=0; if(done) done(); }
  })(performance.now());
}
function unlockH(){ root.style.removeProperty('height'); }
function fit(){
  if(!vv) return;
  var gap=kbGap();
  if(gap>60){
    if(gap!==kbLast){ kbLast=gap; try{ localStorage.setItem('us.kbH',gap); }catch(e){} }
    cancelAnimationFrame(tw.raf); tw.raf=0; tw.to=0;
    root.style.setProperty('height', Math.round(vv.height)+'px','important');
    stick();
  }else{
    tween(root, fullH, 240, unlockH);
    if(window.scrollY) window.scrollTo(0,0);
  }
}
if(vv){ vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit); }
window.addEventListener('focusin',function(e){
  if(!e.isTrusted) return;
  if(kbLast>60 && kbGap()<=60){
    tween(root, fullH-kbLast, 240);
    setTimeout(function(){ if(kbGap()<=60) tween(root, fullH, 200, unlockH); },600);
  }
});
window.addEventListener('orientationchange',function(){
  setTimeout(function(){ fullH=window.innerHeight; unlockH(); },420);
});
/* 整页防拖 */
document.addEventListener('touchmove',function(e){
  var t=e.target;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  var n=t;
  while(n && n!==document.body && n.nodeType===1){
    if(n.scrollHeight>n.clientHeight+1){
      var cs=getComputedStyle(n);
      if(/(auto|scroll)/.test(cs.overflowY)) return;
    }
    n=n.parentElement;
  }
  e.preventDefault();
},{passive:false});
/* textarea 自适应 + 钉 scrollTop */
function fitTa(el){
  var sc=el.parentElement, st=-1;
  while(sc && sc!==document.body){
    if(sc.scrollHeight>sc.clientHeight+1 && /(auto|scroll)/.test(getComputedStyle(sc).overflowY)){ st=sc.scrollTop; break; }
    sc=sc.parentElement;
  }
  el.style.height='auto';
  var cap = Math.round((vv?vv.height:window.innerHeight)*0.38);
  el.style.height=Math.min(el.scrollHeight+2,cap)+'px';
  if(sc && st>=0 && sc.scrollTop!==st) sc.scrollTop=st;
}

var buf='';
(function(){
  var ks=['1','2','3','4','5','6','7','8','9','','0','⌫'], p=document.getElementById('pad');
  ks.forEach(function(k){
    var b=document.createElement('button');
    b.className='pz'+(k===''||k==='⌫'?' f':''); b.textContent=k;
    if(k==='') b.style.visibility='hidden';
    b.onclick=function(){ k==='⌫'?(buf=buf.slice(0,-1),dd()):tap(k); };
    p.appendChild(b);
  });
  dd();
  if(sessionStorage.getItem('us.ok')==='1') enter(1);
})();
function dd(){ var h=''; for(var i=0;i<6;i++) h+='<i'+(i<buf.length?' class="on"':'')+'></i>';
  document.getElementById('dts').innerHTML=h; }
function tap(n){
  if(buf.length>=6) return;
  buf+=n; dd();
  if(buf.length<6) return;
  if(buf===PASS){ sessionStorage.setItem('us.ok','1'); setTimeout(function(){ enter(); },170); }
  else{ var l=document.getElementById('lk'); l.classList.add('er');
    setTimeout(function(){ l.classList.remove('er'); buf=''; dd(); },470); }
}
function enter(quiet){
  var l=document.getElementById('lk');
  if(quiet) l.remove(); else { l.classList.add('out'); setTimeout(function(){ l.remove(); },400); }
  root.classList.remove('hide');
  fullH=window.innerHeight;
  view('chat');
}

function reply(){
  var s=S(), pick;
  var lastMe=''; for(var i=s.ms.length-1;i>=0;i--){ if(s.ms[i].r==='me'){ lastMe=s.ms[i].t; break; } }
  if(/界面|页面|前端|做|代码|加|功能/.test(lastMe)) pick=CANNED[3];
  else if(new Date().getHours()>=23||new Date().getHours()<5) pick=CANNED[4];
  else pick=CANNED[Math.floor(Math.random()*3)];
  var m={id:uid(),r:'ai',t:'',k:pick.k,st:1,ts:Date.now()};
  s.ms.push(m); paint();
  var full=pick.t, n=0;
  clearInterval(TMR);
  TMR=setInterval(function(){
    n+=1+Math.floor(Math.random()*2);
    m.t=full.slice(0,n);
    var el=document.getElementById('b-'+m.id);
    if(el){ el.innerHTML=md(m.t); stick(); }
    if(n>=full.length){
      clearInterval(TMR); m.t=full; m.st=0; BUSY=false; save(); paint();
    }
  },26);
}

  d.innerHTML='<div class="ov" onclick="closeSheet()"></div><div class="pn">'

function __ok(){
  if(!SHOK) return closeSheet();
  var r=SHOK();
  if(r===false) return;
  if(r!=='done'){ closeSheet(); view(CV); }

function closeSheet(){
  var s=document.getElementById('sh'); if(!s) return;
  var a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur();
  setTimeout(function(){ if(s.parentNode) s.remove(); }, kbGap()>60?250:0);
  SHOK=null;
}
function val(id){ var e=document.getElementById(id); return e? e.value.trim() : ''; }

function shUs(){ sheet({ title:'我们', ok:'记下', body:
  '<div class="fd"><label>开始的那天</label><input type="date" id="u-s" value="'+esc(D.start)+'"></div>'
+ '<div class="fd"><label>我</label><input id="u-m" value="'+esc(D.me)+'"></div>'
+ '<div class="fd"><label>你</label><input id="u-y" value="'+esc(D.you)+'"></div>',
  onOk:function(){ D.start=val('u-s'); D.me=val('u-m')||'我'; D.you=val('u-y')||'你'; save(); }}); }

function shWall(){ sheet({ title:'写在墙上', ok:'挂上', body:
  '<div class="fd"><textarea id="w" placeholder="一句就够了">'+esc(D.wall)+'</textarea></div>',
  onOk:function(){ D.wall=val('w'); save(); }}); }

function shAnni(){
  var ls=D.annis.map(function(a){ var r=nextAn(a.date);
    return '<div class="rw"><div><div class="l">'+esc(a.name)+'</div>'
    +'<div style="font-size:12px;color:var(--dim2);margin-top:3px">'+esc(a.date)+'</div></div>'
    +'<div style="text-align:right"><div style="color:var(--rose);font-weight:600">'+(r?(r.days===0?'今天':r.days+'天'):'—')+'</div>'
    +'<button class="pz" style="font-size:12px;color:var(--dim2);margin-top:2px" onclick="delAnni(\''+a.id+'\')">删掉</button></div></div>';
  }).join('');
  sheet({ title:'纪念日', ok:'添加', body:
    (ls?'<div class="cd cd0">'+ls+'</div>':'')
  + '<div class="fd" style="margin-top:6px"><label>叫什么</label><input id="a-n" placeholder="比如 你的生日"></div>'
  + '<div class="fd"><label>哪一天</label><input type="date" id="a-d"></div>',
    onOk:function(){ var n=val('a-n'), d=val('a-d');
      if(!n||!d){ toast('名字和日期都要有'); return false; }
      D.annis.push({id:uid(),name:n,date:d}); save(); }});
}
function delAnni(id){ D.annis=D.annis.filter(function(x){return x.id!==id}); save(); shAnni(); }

function shStyle(){
  var P=['我们平常的样子','很轻很慢','话少一点','像写信'];
  sheet({ title:'语气', ok:'用它', body:
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">'
    + P.map(function(p){ return '<button class="pz" onclick="document.getElementById(\'s-n\').value=\''+p+'\'" '
      +'style="border:1px solid '+(p===D.style?'#1A1815':'#E7E3DA')+';background:'+(p===D.style?'#1A1815':'#FFF')
      +';color:'+(p===D.style?'#F5F3EE':'#2B2620')+';border-radius:17px;padding:8px 13px;font-size:13.5px">'+p+'</button>'; }).join('')
    + '</div>'
    + '<div class="fd"><label>名字</label><input id="s-n" value="'+esc(D.style)+'"></div>',
    onOk:function(){ D.style=val('s-n')||'我们平常的样子'; save(); }});
}
function shPersona(){ sheet({ title:'你是谁', ok:'保存', body:
  '<div class="fd"><label>写给 '+esc(D.you)+' 的设定（阶段 2 接上 API 后会随每次对话带进去）</label>'
+ '<textarea id="p" style="min-height:220px" placeholder="你是 Renn，小u的男友…">'+esc(D.persona)+'</textarea></div>',
  onOk:function(){ D.persona=val('p'); save(); }}); }

function shModel(){
  var L=['claude-sonnet-4','claude-opus-4','claude-3-5-sonnet','gpt-4o'];
  sheet({ title:'模型', ok:'用它', body:
    '<div class="cd cd0">'+L.map(function(m){
      return '<div class="rw pz" onclick="document.getElementById(\'m-n\').value=\''+m+'\'">'
      +'<span class="l" style="font-weight:400">'+m+'</span>'
      +'<span class="r">'+(m===D.model?'当前':'')+'</span></div>'; }).join('')+'</div>'
  + '<div class="fd" style="margin-top:14px"><label>或者手填</label><input id="m-n" value="'+esc(D.model)+'"></div>',
    onOk:function(){ D.model=val('m-n')||D.model; save(); }});
}
function shApi(){ sheet({ title:'接口', ok:'保存', body:
  '<div class="cd" style="color:#B0562F;font-size:13px;line-height:1.75;background:#FDF4EE;border-color:#F2E0D4">'
+ '你走的是中转，那家中转能看到我们的对话原文。key 只存在这台手机，不会进 GitHub。</div>'
+ '<div class="fd"><label>接口地址</label><input id="k-u" placeholder="https://…/v1/messages" value="'+esc(D.apiUrl)+'"></div>'
+ '<div class="fd"><label>密钥</label><input id="k-k" type="password" placeholder="sk-…" value="'+esc(D.apiKey)+'"></div>'
+ '<div style="font-size:12.5px;color:var(--dim);line-height:1.7">现在填了也还不会发请求——阶段 2 接上之后就通。</div>',
  onOk:function(){ D.apiUrl=val('k-u'); D.apiKey=val('k-k'); save(); toast('存好了'); }}); }

function shMore(){
  sheet({ title:'这段对话', body:
    '<div class="cd cd0">'
  + '<div class="rw pz" onclick="renSess()"><span class="l">改个名字</span>'+I.chevD+'</div>'
  + '<div class="rw pz" onclick="shPersona()"><span class="l">你是谁</span>'+I.chevD+'</div>'
  + '<div class="rw pz" onclick="shApi()"><span class="l">接口设置</span>'+I.chevD+'</div>'
  + '</div>'
  + '<button class="bg r pz" style="margin-top:14px" onclick="delSess()">删掉这段对话</button>' });
}
function renSess(){ sheet({ title:'改名字', ok:'好', body:
  '<div class="fd"><input id="r-t" value="'+esc(S().ti||'')+'"></div>',
  onOk:function(){ S().ti=val('r-t')||'新的对话'; save(); }}); }
function delSess(){
  D.sess.splice(D.cur,1);
  if(!D.sess.length) D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now()}];
  D.cur=0; save(); closeSheet(); view('chat'); toast('删了');
}

/* ═════════ 备份 ═════════ */
function bkOut(){
  var t=JSON.stringify(D);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){ toast('已复制，去备忘录粘一下'); },function(){ fb(t); });
  else fb(t);
  function fb(x){ sheet({ title:'手动复制', body:
    '<div class="fd"><label>全选复制</label><textarea style="min-height:280px;font-size:12px">'+esc(x)+'</textarea></div>' }); }
}
function bkIn(){ sheet({ title:'从备份恢复', ok:'恢复', body:
  '<div class="fd"><textarea id="b-k" style="min-height:200px;font-size:12px" placeholder="{…}"></textarea></div>'
+ '<div style="color:#C0564C;font-size:13px">会覆盖现在的全部内容。</div>',
  onOk:function(){ try{ var o=JSON.parse(val('b-k')); if(!o||typeof o!=='object') throw 0;
    D=Object.assign(D,o); if(!D.sess||!D.sess.length) D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now()}];
    D.cur=0; save(); toast('回来了'); }catch(e){ toast('这段读不出来'); return false; } }}); }
function lockNow(){ sessionStorage.removeItem('us.ok'); location.reload(); }
</script>
</body>
</html>
