<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I MISS U">
<meta name="format-detection" content="telephone=no">
<title>I MISS U</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
:root{--bg:#F5F3EE;--ink:#1A1815;--ink2:#2B2620;--dim:#9A958B;--dim2:#B8B3A8;
  --line:#ECE8DF;--card:#FFF;--rose:#C97B6E;--onink:#F5F3EE;
  --i1:#48453E;--i2:#9A958B;--i3:#D1CCC2;
  --fldb:#E7E3DA;--ibx:#FBFAF7;--cbx:#2B2620;--cbxt:#F0EDE6;
  --tag3t:#A9736A;--tag4t:#6D7480;
  --hi:rgba(201,123,110,.2);--sd:rgba(43,38,30,.05);--sd2:rgba(43,38,30,.1);
  --gl:#EFEBE2;--tstb:rgba(255,255,255,.9);--tstt:#4A443C;--ovl:rgba(0,0,0,.2);
  --dr2:#F0ECE4;--dl:#E4DED4;--red:#C0564C;--red2:#B5514A;--gr:#8C9E7E;
  --edge:#F5F3EE;--ln2:rgba(112,124,138,.18);--sel:rgba(112,124,138,.085);
  --sel2:rgba(112,124,138,.13);--bub:rgba(112,124,138,.105);
  --st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --kb:0px;--inset:17px}
html.dark{--bg:#16140F;--ink:#EAE5DA;--ink2:#DED8CC;--dim:#8B857A;--dim2:#6E6961;
  --line:#2A261F;--card:#1E1B16;--rose:#D48F80;--onink:#16140F;
  --i1:#C6C0B4;--i2:#8B857A;--i3:#4E483F;
  --fldb:#302B24;--ibx:#1B1813;--cbx:#0D0B08;--cbxt:#DDD7CB;
  --tag3t:#C08F84;--tag4t:#8A929E;
  --hi:rgba(212,143,128,.26);--sd:rgba(0,0,0,.32);--sd2:rgba(0,0,0,.5);
  --gl:#1D1A15;--tstb:rgba(48,44,37,.94);--tstt:#E6E1D6;--ovl:rgba(0,0,0,.55);
  --dr2:#231F1A;--dl:#332E27;--red:#D4736A;--red2:#D4736A;--gr:#7E8F70;
  --edge:#16140F;--ln2:rgba(226,232,240,.14);--sel:rgba(226,232,240,.075);
  --sel2:rgba(226,232,240,.12);--bub:rgba(226,232,240,.09)}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit;border:none;background:none}
textarea,input{-webkit-appearance:none;border-radius:0}
input[type=date]{color-scheme:light}
html.dark input[type=date]{color-scheme:dark;color:var(--ink2)}
.hide{display:none!important}
.nosel{-webkit-user-select:none;user-select:none}
.sa{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.sa::-webkit-scrollbar{width:0;display:none}
.pz{transition:transform .12s ease,opacity .12s ease}
.pz:active{transform:scale(.95);opacity:.75}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sldL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes sldU{from{transform:translateY(100%)}to{transform:none}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shk{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-2px)}}
@keyframes fl{0%{background:var(--hi)}100%{background:transparent}}
@keyframes wdrop{from{transform:translateY(-100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

html.hasbg{background-repeat:no-repeat;background-position:center;
  background-size:cover;height:calc(100% + 96px)}
html.hasbg body{background:transparent!important;height:100%}
html.hasbg #root,html.hasbg #pg,html.hasbg #ms{background:transparent!important}
html.hasbg .mw .fg{display:none}

#boot{position:fixed;inset:0;z-index:990;background:var(--bg);display:flex;
  align-items:center;justify-content:center}
#boot i{width:22px;height:22px;border-radius:50%;border:2px solid var(--dl);
  border-top-color:var(--rose);animation:spin .7s linear infinite}
#root{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#warn{flex:none;background:#B4453C;color:#FFF;padding:calc(var(--st) + 9px) 16px 11px;
  display:flex;align-items:center;gap:11px;animation:wdrop .3s ease both;z-index:50}
#warn .wt{flex:1;font-size:13px;line-height:1.5;font-weight:500}
#warn .wb{flex:none;background:rgba(255,255,255,.2);border-radius:14px;padding:7px 13px;
  font-size:13px;font-weight:600;color:#FFF}
#warn .wx{flex:none;width:26px;height:26px;opacity:.7;font-size:17px;line-height:26px;text-align:center}
html.warned .hd{padding-top:9px}

#lk{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:calc(var(--st) + 18px) 26px calc(var(--sb) + 24px);
  animation:fade .5s ease both}
html.hasbg #lk{background:transparent}
#lk.out{opacity:0;transition:opacity .4s ease;pointer-events:none}
#lk .jp{position:relative;font:400 32px/1 "Hiragino Mincho ProN","Yu Mincho","Songti SC",serif;
  letter-spacing:.22em;color:var(--ink2);text-indent:.22em}
#lk .en{margin-top:16px;font-size:10.5px;letter-spacing:.38em;color:var(--dim2);font-weight:500}
#dts{display:flex;gap:16px;margin:32px 0 28px}
#dts i{width:9px;height:9px;border-radius:50%;background:var(--dl);transition:.2s}
#dts i.on{background:var(--dim);transform:scale(1.25)}
#lk.er #dts{animation:shk .44s}
#pad{display:grid;grid-template-columns:repeat(3,84px);gap:19px 22px}
#pad button{height:84px;border-radius:50%;background:var(--card);font:300 30px/1 -apple-system;
  color:var(--ink2);box-shadow:0 1px 2px var(--sd),0 8px 20px -12px var(--sd2);
  display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
#pad button:active{transform:scale(.93);background:var(--dr2)}
#pad button.f{background:none;box-shadow:none}
html.hasbg #pad button{background:rgba(253,252,250,.46);border:1px solid rgba(255,255,255,.58)}
html.dark.hasbg #pad button{background:rgba(34,30,25,.5);border-color:rgba(255,255,255,.1)}
html.hasbg #pad button.f{background:none;border:0;box-shadow:none}

#pg{flex:1;min-height:0;position:relative}
.vw{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .22s ease both}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:9px;
  padding:max(10px,calc(var(--st) - 3px)) calc(14px + var(--sr)) 9px calc(14px + var(--sl));
  position:relative;z-index:8}
.cb{width:40px;height:40px;flex:none;border-radius:50%;background:var(--card);display:flex;
  align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--sd),0 2px 6px var(--sd)}
.pill{height:40px;display:flex;align-items:center;gap:7px;background:var(--card);border-radius:20px;
  padding:0 14px;box-shadow:0 0 0 1px var(--sd),0 2px 6px var(--sd);min-width:0}
.pill span{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.hdt{font-size:16px;font-weight:400;letter-spacing:.1em;
  font-family:"Hiragino Mincho ProN","Songti SC",serif}
.pgw{flex:1;min-height:0;padding:2px calc(20px + var(--sr)) 24px calc(20px + var(--sl))}
.big{font:400 28px/1.2 "Hiragino Mincho ProN","Songti SC",serif;letter-spacing:.03em}
.sub{margin-top:5px;font-size:14px;color:var(--dim)}

.mw{flex:1;min-height:0;position:relative;overflow:hidden}
.mw .fg{position:absolute;left:0;right:0;height:22px;z-index:4;pointer-events:none}
.mw .fg.t{top:0;background:linear-gradient(var(--bg),transparent)}
.mw .fg.b{bottom:0;background:linear-gradient(transparent,var(--bg))}
#ms{position:absolute;inset:0;overflow-x:hidden;overflow-anchor:none;
  padding:12px calc(20px + var(--sr)) calc(16px + var(--kb)) calc(20px + var(--sl))}
.gsep{display:flex;align-items:center;gap:12px;margin:4px 0 26px}
.gsep i{flex:1;height:1px;background:var(--dl);opacity:.4}
.gsep span{flex:none;display:inline-flex;align-items:baseline;gap:8px;
  font-size:10.5px;color:var(--dim2);letter-spacing:.04em}
.gsep span b{font-weight:400;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.m{margin-bottom:28px;display:flex;flex-direction:column}
.m.nu{animation:up .3s ease both}
.m.me{align-items:stretch;margin-bottom:16px}
.m.ai{align-items:flex-start}
.m .in{max-width:100%;width:100%;min-width:0}
.m.me .in{display:block;text-align:right}
.bd{font-size:16px;line-height:1.72;letter-spacing:-.008em;word-break:break-word;
  white-space:pre-wrap;overflow-wrap:anywhere}
.m.me .bd{display:inline-block;width:auto;max-width:80%;background:var(--bub);
  border-radius:20px;padding:10px 15px;color:var(--ink2);text-align:left;
  vertical-align:top;line-height:1.62;box-sizing:border-box}
.m.me .bd.tight{padding:8px 14px;line-height:1.5;border-radius:18px}
.m.ai .bd{padding:0 1px;color:var(--ink2)}
.m.flash .bd{animation:fl 2s ease}
.bd.clip{max-height:330px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);
  mask-image:linear-gradient(180deg,#000 72%,transparent)}
.more{display:inline-block;margin-top:7px;font-size:12.5px;color:var(--dim);font-weight:500}
.bd b{font-weight:600}.bd em{font-style:italic}
.bd code{background:var(--sel2);border-radius:5px;padding:1px 5px;
  font:13.5px ui-monospace,Menlo,monospace}
.bd .cbx{background:var(--cbx);color:var(--cbxt);border-radius:12px;padding:12px 14px;margin:9px 0;
  font:13px/1.6 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
.sg{font-size:16px;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;
  color:var(--ink2);margin-bottom:13px}
.pic{display:inline-block;width:74px;height:74px;object-fit:cover;border-radius:13px;
  margin:0 0 6px 6px;vertical-align:top;background:var(--sel2)}
.m.ai .pic{margin:0 6px 6px 0}
.gone{font-size:12px;color:var(--dim2);background:var(--gl);border-radius:11px;padding:7px 12px;
  margin-bottom:7px;display:inline-block}
.qt{border-left:2px solid var(--dl);padding:2px 0 2px 13px;max-width:100%;
  box-sizing:border-box;overflow:hidden;margin:2px 0 14px}
.qt .qh{font-size:11.5px;color:var(--dim2);font-weight:600;margin-bottom:6px;display:flex;
  align-items:center;justify-content:space-between;gap:10px}
.qt .qh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.qt .qb{font-size:13.5px;line-height:1.7;color:var(--dim);white-space:pre-wrap;
  overflow-wrap:anywhere}
.thk{margin-bottom:11px}
.thk button{display:inline-flex;align-items:center;gap:6px;padding:1px 0;text-align:left}
.thk span{font-size:13px;color:var(--dim);max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.wbx{margin-bottom:13px;border-left:1px solid var(--dl);padding:1px 0 1px 12px;overflow:hidden}
.wbx .wh{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim2);
  font-weight:500;letter-spacing:.03em}
.wbx .wh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wbx .wh svg{opacity:.55}
.wbx .wl{margin-top:6px;font-size:12px;line-height:1.8}
.wbx .wl a{color:var(--tag4t);text-decoration:none;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;align-items:baseline;gap:8px;margin-top:9px;font-size:11.5px;
  color:var(--dim2);line-height:1.7}
.act .ai2{color:var(--dim);font-weight:500;flex:none}
.ops{display:flex;align-items:center;gap:14px;margin-top:10px;opacity:.62}
.tm{font-size:11px;color:var(--dim2);flex:none;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim2);font-weight:600;
  font-variant-numeric:tabular-nums}
.nav button{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.nav button[disabled]{opacity:.28}
.eo{display:flex;align-items:center;justify-content:flex-end;gap:11px;margin-top:4px;opacity:.55}
.eo button{width:25px;height:25px;display:flex;align-items:center;justify-content:center}
.err{margin-top:9px;font-size:12.5px;color:var(--red2);line-height:1.6}
.err button{color:var(--rose);font-weight:600;font-size:12.5px;margin-left:8px}
.typ{display:flex;gap:4px;padding:2px 0 4px;align-items:center}
.typ i{width:5px;height:5px;border-radius:50%;background:var(--dim2);animation:dots 1.4s ease-in-out infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
.typ span{margin-left:7px;font-size:12.5px;color:var(--dim2)}
.wm{position:sticky;top:46%;left:50%;transform:translate(-50%,-50%);width:0;height:0;
  display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.mfar{display:block;width:100%;margin:2px 0 24px;padding:10px 0;font-size:11.5px;
  letter-spacing:.12em;color:var(--dim2);text-align:center;
  font-family:"Hiragino Mincho ProN","Songti SC",serif}
.m.far,.gsep.far{display:none}
.m.pick .in{position:relative;padding-left:30px}
.m.pick.me .in{padding-left:0;padding-right:30px}
.ck{position:absolute;top:2px;left:0;width:21px;height:21px;border-radius:50%;
  border:1.6px solid var(--dl);background:var(--ibx)}
.m.pick.me .ck{left:auto;right:0}
.m.on .ck{background:var(--ink);border-color:var(--ink)}
.m.on .ck:after{content:'';position:absolute;left:6px;top:5px;width:6px;height:9px;
  border-right:2px solid var(--onink);border-bottom:2px solid var(--onink);transform:rotate(40deg)}
#dn{position:absolute;right:calc(18px + var(--sr));bottom:calc(18px + var(--kb));
  width:36px;height:36px;border-radius:50%;background:var(--card);z-index:9;
  box-shadow:0 0 0 1px var(--sd),0 4px 14px -4px var(--sd2);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transition:opacity .22s ease,bottom .25s cubic-bezier(.32,.72,0,1)}
#dn.on{opacity:.82;pointer-events:auto}

.ib{flex:none;padding:4px calc(13px + var(--sr)) max(16px,calc(var(--sb) - 6px)) calc(13px + var(--sl));
  position:relative;z-index:8;transform:translate3d(0,calc(-1 * var(--kb)),0);
  transition:transform .25s cubic-bezier(.32,.72,0,1)}
html.kbon .ib{padding-bottom:0;transform:translate3d(0,calc(4px - var(--kb)),0)}
html.kbot .ib{padding-bottom:max(16px,calc(var(--sb) - 6px));transform:none}
html.kbot #ms{padding-bottom:16px}
html.kbot #dn{bottom:18px}
.ibx{background:var(--ibx);border:1px solid var(--fldb);border-radius:25px;padding:15px 16px 10px;
  box-shadow:0 1px 3px var(--sd)}
.att{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.att .a{position:relative;width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--sel2)}
.att .a img{width:100%;height:100%;object-fit:cover;display:block}
.att .a button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;
  background:rgba(26,24,21,.72);color:#fff;font-size:12px;line-height:19px;text-align:center}
.att .a.af{width:auto;min-width:112px;max-width:170px;height:58px;display:flex;
  align-items:center;gap:9px;padding:0 11px;background:var(--sel2)}
.att .a.af .fx{flex:1;min-width:0}
.att .a.af b{display:block;font-size:12px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.att .a.af s{display:block;text-decoration:none;font-size:10px;color:var(--dim2);margin-top:2px}
#ta{display:block;width:100%;min-height:26px;resize:none;outline:none;background:none;
  font-size:16px;line-height:1.55;color:var(--ink2);padding:1px 3px 12px;font-weight:300;
  overflow-y:hidden;caret-color:var(--rose)}
#ta::placeholder{color:var(--dim2);font-weight:300}
.ibr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{width:31px;height:31px;flex:none;border-radius:50%;background:var(--sel2);
  display:flex;align-items:center;justify-content:center}
.mini.on{background:var(--tag4t)}
.mini.on .ic{color:#FFF}
.mini.on2{background:var(--tag3t)}
.mini.on2 .ic{color:#FFF}
.mchip{display:flex;align-items:center;background:var(--sel2);border-radius:17px;
  padding:7px 12px;max-width:120px}
.mchip span{font-size:12.5px;font-weight:500;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.snd{width:39px;height:39px;flex:none;border-radius:50%;background:var(--ink);display:flex;
  align-items:center;justify-content:center;transition:opacity .18s,transform .12s}
.snd.off{opacity:.26}
.selbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px calc(20px + var(--sr)) max(16px,calc(var(--sb) - 6px)) calc(20px + var(--sl));
  background:var(--ibx);position:relative;z-index:8;
  transform:translate3d(0,calc(-1 * var(--kb)),0);
  transition:transform .25s cubic-bezier(.32,.72,0,1)}
html.kbon .selbar{padding-bottom:0;transform:translate3d(0,calc(4px - var(--kb)),0)}
.selbar .c{font-size:13.5px;color:var(--dim)}
.selbar button{font-size:15px;font-weight:600}

.sbox{flex:none;padding:0 calc(20px + var(--sr)) 12px calc(20px + var(--sl))}
.sbox .w{display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--ln2);border-radius:16px;padding:12px 14px}
.sbox input{flex:1;min-width:0;outline:none;font-size:16px;caret-color:var(--rose)}
.sbox input::placeholder{color:var(--dim2)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:0 calc(20px + var(--sr)) 12px calc(20px + var(--sl));
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent)}
.chips::-webkit-scrollbar{height:0;display:none}
.chips button{flex:none;border:1px solid var(--ln2);background:var(--card);border-radius:15px;
  padding:7px 13px;font-size:13px;color:var(--dim)}
.chips button.on{background:var(--ink2);color:var(--onink);border-color:transparent}
.res{background:var(--card);border:1px solid var(--ln2);border-radius:18px;padding:14px 16px;
  margin-bottom:10px;box-shadow:0 1px 2px var(--sd),0 8px 22px -14px var(--sd2)}
.res .rh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.res .rt{font-size:10.5px;color:var(--dim2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;order:2}
.res .who{font-size:10.5px;color:var(--dim);font-weight:500;flex:none;order:1}
.res .rb{font-size:14px;line-height:1.7;color:var(--ink2);word-break:break-word}
.res .rc{font-size:13px;line-height:1.65;color:var(--dim);margin-top:7px;
  padding-left:10px;border-left:2px solid var(--dl);white-space:pre-wrap;opacity:.9}
.res .ra{display:flex;gap:20px;margin-top:11px}
.res .ra button{font-size:12.5px;font-weight:600;color:var(--rose)}
.res .ra button.g{color:var(--dim);font-weight:500}
mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:13vh 24px;color:var(--dim2);font-size:14px;line-height:1.85}

.mcd{background:var(--card);border:1px solid var(--ln2);border-radius:18px;padding:15px 17px 13px;

/* ══════ IndexedDB ══════ */
var _db=null;
function dbOpen(){
  return new Promise(function(ok,no){
    if(_db)return ok(_db);
    var rq=indexedDB.open(DB,1);
    rq.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('msg'))d.createObjectStore('msg');
      if(!d.objectStoreNames.contains('pic'))d.createObjectStore('pic');};
    rq.onsuccess=function(){
      _db=rq.result;
      _db.onversionchange=function(){try{_db.close();}catch(e){}_db=null;};
      ok(_db);};
    rq.onerror=function(){no(rq.error);};});}
function tx(store,mode){
  return dbOpen().then(function(d){
    return d.transaction(store,mode).objectStore(store);});}
function dbGet(store,k){
  return tx(store,'readonly').then(function(s){
    return new Promise(function(ok,no){
      var r=s.get(k);
      r.onsuccess=function(){ok(r.result);};
      r.onerror=function(){no(r.error);};});});}
function dbPutRaw(store,k,v){
  return tx(store,'readwrite').then(function(s){
    return new Promise(function(ok,no){
      var r=s.put(v,k);
      r.onsuccess=function(){ok(1);};
      r.onerror=function(){no(r.error);};});});}
function dbDel(store,k){
  return tx(store,'readwrite').then(function(s){
    return new Promise(function(ok){
      var r=s.delete(k);
      r.onsuccess=function(){ok(1);};
      r.onerror=function(){ok(0);};});});}
function dbKeys(store){
  return tx(store,'readonly').then(function(s){
    return new Promise(function(ok){
      var r=s.getAllKeys();
      r.onsuccess=function(){ok(r.result||[]);};
      r.onerror=function(){ok([]);};});});}
function dbAll(store,skipThumb){
  return tx(store,'readonly').then(function(s){
    return new Promise(function(ok){
      var out={},c=s.openCursor();
      c.onsuccess=function(e){
        var cur=e.target.result;
        if(!cur)return ok(out);
        if(!(skipThumb&&String(cur.key).slice(-2)==='~t'))out[cur.key]=cur.value;
        cur.continue();};
      c.onerror=function(){ok(out);};});});}
function dbSize(store){
  return tx(store,'readonly').then(function(s){
    return new Promise(function(ok){
      var n=0,b=0,c=s.openCursor();
      c.onsuccess=function(e){
        var cur=e.target.result;
        if(!cur)return ok({n:n,b:b});
        var v=cur.value;
        b+=(v&&v.d)?v.d.length:(typeof v==='string'?v.length:0);
        if(String(cur.key).slice(-2)!=='~t')n++;
        cur.continue();};
      c.onerror=function(){ok({n:n,b:b});};});});}

var SHRUNK={},RAWPUT=0;
function dbPut(store,key,val){
  var k=String(key);
  if(RAWPUT||store!=='pic'||k==='__bg'||k==='__av1'||k==='__av2'
    ||k.slice(-2)==='~t'||k.slice(0,2)==='f:'||k.slice(0,4)==='pdf:'
    ||!val||typeof val.d!=='string'||val.d.indexOf('data:image')!==0)
    return dbPutRaw(store,key,val);
  if(SHRUNK[val.d.slice(-40)])
    return dbPutRaw(store,key,{d:val.d,ts:val.ts||Date.now()});
  return new Promise(function(ok,no){
    shrink(val.d,function(d){
      dbPutRaw(store,key,{d:d||val.d,ts:val.ts||Date.now()}).then(ok,no);});});}
setInterval(function(){
  var ks=Object.keys(SHRUNK);
  if(ks.length>40)ks.slice(0,ks.length-20).forEach(function(k){delete SHRUNK[k];});
},60000);

/* ══════ 存盘 ══════ */
var SVT=0,SVQ={},SVBUSY=0,SFAIL=0;
function saveD(){SVQ.d=1;flush();}
function saveS(sid){if(sid)SVQ[sid]=1;SVQ.list=1;flush();}
function flush(now){
  clearTimeout(SVT);
  if(now)return doFlush();
  SVT=setTimeout(doFlush,260);}
function listPack(){
  return SS.map(function(s){
    return{id:s.id,ti:s.ti,at:s.at,zip:s.zip||'',zt:s.zt||0,
      n:(MSG[s.id]||[]).length};});}
function doFlush(){
  if(SVBUSY)return;
  var q=SVQ;SVQ={};
  var keys=Object.keys(q);
  if(!keys.length)return;
  SVBUSY=1;
  var jobs=[];
  if(q.d)jobs.push(dbPutRaw('kv','D',D));
  if(q.list)jobs.push(dbPutRaw('kv','list',listPack()));
  keys.forEach(function(k){
    if(k==='d'||k==='list')return;
    if(MSG[k])jobs.push(dbPutRaw('msg',k,MSG[k]));});
  Promise.all(jobs).then(function(){
    SVBUSY=0;
    if(SFAIL){SFAIL=0;warn(0);}
    if(Object.keys(SVQ).length)flush(1);
  },function(){
    SVBUSY=0;SFAIL=1;
    warn(1,'存不下了。手机空间可能满了，先导出一份备份。');});}
function flushNow(){
  try{
    clearTimeout(SVT);
    var q=SVQ;SVQ={};
    if(q.d)dbPutRaw('kv','D',D);
    if(q.list)dbPutRaw('kv','list',listPack());
    Object.keys(q).forEach(function(k){
      if(k!=='d'&&k!=='list'&&MSG[k])dbPutRaw('msg',k,MSG[k]);});
  }catch(e){}}
function doFlushP(){
  var q=SVQ;SVQ={};
  var jobs=[dbPutRaw('kv','D',D),dbPutRaw('kv','list',listPack())];
  Object.keys(q).forEach(function(k){
    if(k!=='d'&&k!=='list'&&MSG[k])jobs.push(dbPutRaw('msg',k,MSG[k]));});
  return Promise.all(jobs);}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function deep(o){return JSON.parse(JSON.stringify(o||[]));}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n||12);}catch(e){}}
function toast(t){
  var o=document.getElementById('tst');if(o)o.remove();
  var d=document.createElement('div');d.id='tst';d.textContent=t;
  document.body.appendChild(d);
  requestAnimationFrame(function(){d.classList.add('on');});
  setTimeout(function(){d.classList.remove('on');
    setTimeout(function(){if(d.parentNode)d.remove();},340);},1700);}
function tick(b){
  if(!b)return;
  var o=b.innerHTML;b.innerHTML=I.ok;
  setTimeout(function(){if(b.parentNode)b.innerHTML=o;},1300);}
function clip(t,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){cb&&cb();},
      function(){toast('复制失败');});
  else toast('这个浏览器不给复制');}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
var MS=86400000;
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function d0(t){var d=new Date(t);
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function pd(s){if(!s)return null;var p=String(s).split('-');
  return new Date(+p[0],+p[1]-1,+p[2]);}
function dayN(){var d=pd(D.start);return d?Math.floor((today()-d)/MS)+1:null;}
function nextAn(s){
  var d=pd(s);if(!d)return null;
  var t=today(),y=t.getFullYear();
  var n=new Date(y,d.getMonth(),d.getDate());
  if(n<t)n=new Date(y+1,d.getMonth(),d.getDate());
  return{days:Math.round((n-t)/MS)};}
function hm(ts){var d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function dlab(ts){
  var df=Math.round((d0(Date.now())-d0(ts))/MS),d=new Date(ts);
  if(df===0)return'今天';
  if(df===1)return'昨天';
  if(df===2)return'前天';
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
function dtl(ts){return dlab(ts)+' '+hm(ts);}
function tstamp(ts){
  return(Math.round((d0(Date.now())-d0(ts))/MS)===0)?hm(ts):(dlab(ts)+' '+hm(ts));}
function ago(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'刚刚';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时前';
  return dlab(ts);}
function dur(ms2){
  var h=Math.floor(ms2/3600000);
  if(h<1)return Math.max(1,Math.floor(ms2/60000))+' 分钟';
  if(h<24)return h+' 小时';
  var d=Math.floor(h/24),r=h%24;
  return d+' 天'+(r>=2?' '+r+' 小时':'');}
function hello(){
  var h=new Date().getHours();
  if(h<5)return'还没睡呀';
  if(h<11)return'早安';
  if(h<14)return'午安';
  if(h<18)return'下午好';
  if(h<23)return'晚上好';
  return'夜深了';}
function fmtMB(b){
  if(b<1024)return b+' B';
  if(b<1048576)return(b/1024).toFixed(0)+' KB';
  if(b<1073741824)return(b/1048576).toFixed(1)+' MB';
  return(b/1073741824).toFixed(2)+' GB';}
function stamp(){
  var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())
    +'-'+p(d.getHours())+p(d.getMinutes());}
function hrText(h){
  if(!h)return'不用';
  if(h<1)return Math.round(h*60)+' 分钟';
  return(Math.round(h*10)/10)+' 小时';}

var ERRTXT='';
function errBar(txt){
  var o=document.getElementById('ebar');if(o)o.remove();
  var d=document.createElement('div');d.id='ebar';
  d.innerHTML='<span>'+esc(txt)+'</span>'
   +'<button class="c">抄给我</button><button class="x">×</button>';
  d.querySelector('.c').onclick=function(){
    var b=d.querySelector('.c');
    try{clip(ERRTXT,function(){b.textContent='好了';});}catch(x){alert(ERRTXT);}};
  d.querySelector('.x').onclick=function(){d.remove();};
  document.body.appendChild(d);}
function keepErr(tag,e){
  var m='',st='';
  try{
    var o=(e&&e.reason)?e.reason:e;
    m=(o&&(o.message||(o.error&&o.error.message)))||String((o&&o.type)||o||'');
    st=(o&&o.stack)?String(o.stack):'';
  }catch(x){}
  m=String(m||'').trim();
  if(!m)return;
  if(/^script error\.?$/i.test(m))return;
  if(e&&e.filename==null&&!st&&m.length<16)return;
  try{if(e&&e.filename)m+='　@'+(e.lineno||0)+':'+(e.colno||0);}catch(x){}
  ERRTXT=tag+'｜'+m.slice(0,200)
    +(st?('\n\n'+st.split('\n').slice(0,14).join('\n')):'');
  try{errBar(tag+'｜'+m.slice(0,60));}catch(x){}}
window.addEventListener('error',function(e){keepErr('出错',e);});
window.addEventListener('unhandledrejection',function(e){keepErr('异步',e);});

function migrate(){
  var raw=null;
  try{raw=localStorage.getItem(LSK);}catch(e){}
  if(!raw){SS=[];MSG={};return Promise.resolve();}
  var o=null;
  try{o=JSON.parse(raw);}catch(e){}
  if(!o||!o.sess){SS=[];MSG={};return Promise.resolve();}
  D=Object.assign(fresh(),o);
  delete D.sess;
  SS=[];MSG={};
  (o.sess||[]).forEach(function(s){
    var id=s.id||uid();
    SS.push({id:id,ti:s.ti||'对话',at:s.at||Date.now(),zip:'',zt:0});
    MSG[id]=(s.ms||[]).map(function(m){
      if(m.img&&m.img.length){

(function(){
  if(!vv)return;
  var run=0,end=0,cur=-1;
  function apply(y){
    if(y===cur)return;
    cur=y;
    var hd=document.querySelector('#pg .hd');
    if(hd)hd.style.transform=y?('translate3d(0,'+y+'px,0)'):'';}
  function tickOne(){
    var se=document.scrollingElement||document.documentElement;
    if(window.scrollY||se.scrollTop){
      try{window.scrollTo(0,0);}catch(e){}
      try{se.scrollTop=0;}catch(e){}}
    apply(Math.round(vv.offsetTop||0));}
  function lock(ms2){
    end=Math.max(end,performance.now()+(ms2||1200));
    if(run)return;
    run=1;
    (function f(){
      tickOne();
      if(performance.now()<end)requestAnimationFrame(f);
      else{run=0;apply(0);}})();}
  document.addEventListener('touchstart',function(e){
    var t=e.target;
    if(!t||!t.closest)return;
    if(/^(INPUT|TEXTAREA)$/.test(t.tagName)||t.closest('.ib')||t.closest('#sh'))
      lock(1800);},{passive:true,capture:true});
  document.addEventListener('focusin',function(e){
    var t=e.target;
    if(t&&/^(INPUT|TEXTAREA)$/.test(t.tagName))lock(1800);},true);
  document.addEventListener('focusout',function(){lock(1200);},true);
  vv.addEventListener('resize',function(){lock(1400);});
  vv.addEventListener('scroll',function(){lock(1000);});
  window.addEventListener('orientationchange',function(){lock(1600);});
  setInterval(function(){
    if(Math.round(vv.offsetTop||0)||window.scrollY)lock(600);},120);
})();

var PICQ={},TOK={};
function shrink(src,a,b,c){
  var M,q,cb;
  if(typeof a==='function'){M=1600;q=0.85;cb=a;}
  else{M=a||1600;q=(b==null?0.85:b);cb=c;}
  if(typeof cb!=='function')cb=function(){};
  function done2(u){
    if(u&&typeof u==='string')SHRUNK[u.slice(-40)]=1;
    cb(u);}
  function work(u,soft){
    if(typeof u!=='string'||u.indexOf('data:image')!==0){done2(u);return;}
    var im=new Image();
    im.onerror=function(){done2(soft?u:null);};
    im.onload=function(){
      try{
        var w=im.width,h=im.height;
        if(!w||!h){done2(soft?u:null);return;}
        if(soft&&w<=M&&h<=M&&u.length<600000){done2(u);return;}
        if(w>M||h>M){
          var s=M/Math.max(w,h);
          w=Math.round(w*s);h=Math.round(h*s);}
        var cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        var o=cv.toDataURL('image/jpeg',q);
        if(!o){done2(soft?u:null);return;}
        done2((soft&&o.length>=u.length)?u:o);
      }catch(e){done2(soft?u:null);}};
    im.src=u;}
  if(src&&typeof src!=='string'&&typeof Blob!=='undefined'&&src instanceof Blob){
    var r=new FileReader();
    r.onerror=function(){cb(null);};
    r.onload=function(){work(String(r.result||''),0);};
    r.readAsDataURL(src);
    return;}
  work(src,1);}
function thumbOf(u,cb){
  var im=new Image();
  im.onerror=function(){cb(null);};
  im.onload=function(){
    try{
      var M=200,w=im.width,h=im.height;
      if(w>M||h>M){var s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    }catch(e){cb(null);}};
  im.src=u;}
function setPic(mid,pid,u){
  var e=document.getElementById('p-'+mid+'-'+pid);
  if(e){e.src=u;e.dataset.on='1';}}
function showPics(m){
  if(!m.pics||!m.pics.length)return;
  var ks=Object.keys(PICQ);
  if(ks.length>240)ks.slice(0,ks.length-160).forEach(function(k){
    if(PICQ[k]!=='no'){delete PICQ[k];delete TOK[k];}});
  m.pics.forEach(function(pid){
    if(PICQ[pid]==='no')return;
    var el=document.getElementById('p-'+m.id+'-'+pid);
    if(!el||el.dataset.on)return;
    var cd=PICQ[pid];
    if(cd){el.src=cd;el.dataset.on='1';if(TOK[pid])return;}
    dbGet('pic',pid+'~t').then(function(v){
      if(v&&v.d){TOK[pid]=1;PICQ[pid]=v.d;if(!cd)setPic(m.id,pid,v.d);return;}
      return dbGet('pic',pid).then(function(f){
        if(!f||!f.d){if(!cd)PICQ[pid]='no';return;}
        thumbOf(f.d,function(th){
          if(!th){TOK[pid]=1;PICQ[pid]=f.d;if(!cd)setPic(m.id,pid,f.d);return;}
          TOK[pid]=1;PICQ[pid]=th;
          if(!cd)setPic(m.id,pid,th);
          dbPutRaw('pic',pid+'~t',{d:th,ts:f.ts||Date.now()});});});
    },function(){});});}

function picRefs(){
  var used={__bg:1,__av1:1,__av2:1};
  function scan(list){
    (list||[]).forEach(function(m){
      if(m.pics)m.pics.forEach(function(p){used[p]=1;used[p+'~t']=1;});
      if(m.files)m.files.forEach(function(f){used['f:'+f.fid]=1;});
      if(m.pdfs)m.pdfs.forEach(function(p){used['pdf:'+p.fid]=1;});
      if(m.eb)m.eb.forEach(function(b){scan(b.tail);});});}
  SS.forEach(function(s){scan(MSG[s.id]);});
  return used;}
function dropPics(list){
  var used=picRefs(),seen2={};
  function walk(l){
    (l||[]).forEach(function(m){
      if(m.pics)m.pics.forEach(function(p){
        if(used[p]||seen2[p])return;
        seen2[p]=1;
        dbDel('pic',p);dbDel('pic',p+'~t');
        delete PICQ[p];delete TOK[p];});
      if(m.files)m.files.forEach(function(f){
        if(!used['f:'+f.fid])dbDel('pic','f:'+f.fid);});
      if(m.pdfs)m.pdfs.forEach(function(p){
        if(!used['pdf:'+p.fid])dbDel('pic','pdf:'+p.fid);});
      if(m.eb)m.eb.forEach(function(b){walk(b.tail);});});}
  walk(list);}
function sweepPics(){
  var tot=0;
  SS.forEach(function(s){tot+=(MSG[s.id]||[]).length;});
  if(!SS.length||!tot)return;
  var used=picRefs();
  dbKeys('pic').then(function(ks){
    ks.filter(function(k){return!used[k];}).slice(0,60)
      .forEach(function(k){dbDel('pic',k);delete PICQ[k];delete TOK[k];});});}

            if(m.pics&&m.pics.length){
              m.imgLost=(m.imgLost||0)+m.pics.length;m.pics=[];}
            if(m.eb)m.eb.forEach(function(b){
              (b.tail||[]).forEach(function(x){
                if(x.pics&&x.pics.length){
                  x.imgLost=(x.imgLost||0)+x.pics.length;x.pics=[];}});});});
          SVQ[s.id]=1;});
        flush(1);closeSheet(1);
        view(CV==='chat'?'chat':'more');
        toast('清掉了 '+n+' 张');
        return'done';}});});}

function trimNote(title){
  var bd=document.querySelector('#sh .bdy');if(!bd)return;
  var ns=bd.querySelectorAll('.nt');if(!ns.length)return;
  var key=String(title||''),i;
  if(key==='这段对话'&&document.getElementById('c-n'))key='带多少给我';
  var v=NOTE[key];
  if(v==null&&EXT.note)v=EXT.note[key];
  for(i=1;i<ns.length;i++)ns[i].remove();
  var el=ns[0];
  if(v===''){el.remove();return;}
  if(v){el.textContent=v;return;}
  var t=(el.textContent||'').replace(/\s+/g,' ').trim();
  if(!t){el.remove();return;}
  if(t.length>46){
    var p=t.indexOf('。');
    el.textContent=(p>0&&p<44)?t.slice(0,p+1)
      :(t.slice(0,44).replace(/[，、]$/,'')+'…');
  }else el.textContent=t;}

     +(ctx?'<div class="rc">'+esc(ctx)+'</div>':'')
     +'<div class="ra"><button onclick="jump(\''+r.s.id+'\',\''+r.m.id

function memById(id){
  var r=null;
  D.mems.forEach(function(m){if(m.id===id)r=m;});
  return r;}
function memCodes(){
  var map={},rev={};
  D.mems.forEach(function(m){
    var id=String(m.id||''),c=id.slice(-4).toLowerCase();
    if(rev[c])c=id.slice(-6).toLowerCase();
    if(rev[c])c=id.toLowerCase();
    map[m.id]=c;rev[c]=m.id;});
  return{map:map,rev:rev};}
function memByCode(code){
  var raw=String(code||'').trim();
  var c=raw.toLowerCase().replace(/[#\s]/g,'');
  if(!c)return null;
  var cs=memCodes(),id=cs.rev[c];
  if(id)return memById(id);
  var hit=null;
  D.mems.forEach(function(m){
    if(!hit&&String(m.id||'').toLowerCase().slice(-c.length)===c)hit=m;});
  if(hit)return hit;
  if(/^[#A-Za-z0-9]+$/.test(raw))return null;
  if(raw.length<6)return null;
  var best=null,bs=0;
  D.mems.forEach(function(m){
    var r=simRate(m.t,raw);
    if(r>bs){bs=r;best=m;}});
  return bs>=0.5?best:null;}
function dupOf(t,skip){
  var best=null,bs=0,lt=String(t||'').length;
  D.mems.forEach(function(m){
    if(m.id===skip)return;
    var r=simRate(m.t,t);
    if(r>bs){bs=r;best=m;}});
  return bs>=(lt<12?0.66:0.5)?{m:best,r:bs}:null;}
var BUMPED=0;
function pickMems(q){
  var ls=D.mems.slice();
  if(ls.length<=MEMCAP)return ls;
  var lk=[],rest=[],now=Date.now(),sc={};
  ls.forEach(function(m){(m.lock?lk:rest).push(m);});
  rest.forEach(function(m){
    var rel=q?ovl(m.t,q):0;
    var age=Math.max(0,1-(now-m.ts)/(120*MS));
    var warm=m.used?Math.max(0,1-(now-m.used)/(14*MS)):0;
    sc[m.id]=rel*6+(m.imp||2)*4+warm*3+age*5;});
  rest.sort(function(a,b){return sc[b.id]-sc[a.id];});
  return lk.concat(rest.slice(0,Math.max(0,MEMCAP-lk.length)));}
function bumpMems(ls){
  if(BUMPED)return;
  BUMPED=1;
  var now=Date.now();
  ls.forEach(function(m){m.hits=(m.hits||0)+1;m.used=now;});
  saveD();}
function memTrim(){
  if(D.mems.length<=MEMCAP+8)return;
  var now=Date.now(),worst=null,ws=1e9;
  D.mems.forEach(function(m){
    if(m.lock||m.src==='me')return;
    var sc=(m.imp||2)*10+Math.min(10,m.hits||0)
      +(m.used?Math.max(0,10-(now-m.used)/(7*MS)):0)
      -Math.min(12,(now-m.ts)/(30*MS));
    if(sc<ws){ws=sc;worst=m;}});
  if(!worst)return;
  D.mems=D.mems.filter(function(x){return x.id!==worst.id;});}

function done(m,after,ab,q,sid){

    m.st=0;m.wst=0;
    delete m._ks;
    BUSY=false;ABORT=null;
    var again=0;
    EXT.done.forEach(function(f){
      if(again)return;
      try{if(f(m,after,q,sid))again=1;}catch(e){keepErr('动作',e);}});
    if(again)return;
    if(!m.parts||!m.parts.length)m.t=stripOut(m.t);
    delete m.fx;
    if(!realT(m)&&!m.err)m.err=ab?'停下了。':'没说出话来，再试一次。';
    if(after)after(m);
    var s=sessById(sid)||S();
    if(s)s.at=Date.now();
    D.seen=Date.now();
    saveD();saveS(sid||(s&&s.id));
    if(CV==='chat'){paint();btn();}
  }catch(e){fail(m,e,'收尾');}}
function stop(){
  STOPPED=1;
  if(ABORT){try{ABORT.abort();}catch(e){}ABORT=null;}
  if(TMR){clearInterval(TMR);TMR=null;try{endFake();}catch(e){}}
  BUSY=false;
  var a=ms(),hit=null,i;
  for(i=a.length-1;i>=0;i--)
    if(a[i].st||a[i].wst){hit=a[i];break;}
  if(hit)fail(hit,null,'','停下了。');
  else if(CV==='chat'){paint();btn();}}

function fake(after){
  var hr=new Date().getHours();
  var p=(hr>=23||hr<5)?CANNED[3]:CANNED[Math.floor(Math.random()*3)];
  var m={id:uid(),r:'ai',t:'',k:D.think?p.k:'',st:1,ts:Date.now()};
  ms().push(m);paint();btn();
  FK={m:m,after:after};
  var full=p.t,n=0;
  clearInterval(TMR);
  TMR=setInterval(function(){
    n+=1+Math.floor(Math.random()*2);
    m.t=full.slice(0,n);
    var el=document.getElementById('b-'+m.id);
    if(el){el.innerHTML=md(m.t);stick();}
    if(n>=full.length){clearInterval(TMR);TMR=null;m.t=full;endFake();}},26);}
function endFake(){
  if(!FK)return;
  var m=FK.m,af=FK.after;
  FK=null;
  m.st=0;BUSY=false;
  if(af)af(m);
  var s=S();
  if(s)s.at=Date.now();
  D.seen=Date.now();saveD();saveS(s&&s.id);
  if(CV==='chat'){paint();btn();}}
function ask(after){
  try{
    STOPPED=0;BUMPED=0;stickHard();
    var sid=S().id,q=lastQ();
    BUSY=true;
    if(!D.apiUrl||!D.apiKey){fake(after);return;}
    var m={id:uid(),r:'ai',t:'',k:'',st:1,ts:Date.now()};
    ms().push(m);
    var pre=null;
    EXT.att.forEach(function(f){
      if(!pre&&f.pre)try{pre=f.pre(m,q);}catch(e){}});
    if(pre&&pre.then){
      paint();btn();
      pre.then(function(){paint();go(m,after,q,sid);},
        function(){paint();go(m,after,q,sid);});
      return;}
    paint();btn();
    go(m,after,q,sid);
  }catch(e){
    var a=ms(),mm=a.length?a[a.length-1]:null;
    if(!mm||mm.r!=='ai'){
      mm={id:uid(),r:'ai',t:'',k:'',ts:Date.now()};
      try{ms().push(mm);}catch(x){}}
    fail(mm,e,'发送');}}
function maybeHi(){
  if(!D.hi||!D.apiUrl||!D.apiKey||BUSY)return;
  if(CV!=='chat'){
    if(GAPMS&&GAPMS>=D.hi*3600000){
      try{view('chat');}catch(e){return;}
      setTimeout(maybeHi,320);}
    return;}
  var g=GAPMS;
  if(!g||g<D.hi*3600000){seen();return;}
  var ta=document.getElementById('ta');
  if(ta&&ta.value.trim())return;
  GAPMS=0;seen();
  var s=S();
  ms().push({id:uid(),r:'gap',g:g,ts:Date.now()});
  s.at=Date.now();saveS(s.id);
  STOPPED=0;BUMPED=0;BUSY=true;
  var m={id:uid(),r:'ai',t:'',k:'',st:1,ts:Date.now()};
  ms().push(m);paint();btn();
  go(m,null,'',s.id,1);}

var WD={id:'',len:-1,t:0};
setInterval(function(){
  try{
    var a=ms(),m=null,i;
    for(i=a.length-1;i>=0;i--)if(a[i].st||a[i].wst){m=a[i];break;}
    if(!m){WD.id='';WD.len=-1;WD.t=0;return;}
    var now=Date.now();
    var len=((m.t||'').length)+((m.k||'').length)
      +((m.parts||[]).length*7)+(m.wst?1:0);
    if(m.id!==WD.id){WD.id=m.id;WD.len=len;WD.t=now;return;}
    if(len!==WD.len){WD.len=len;WD.t=now;return;}
    var idle=now-WD.t;
    if(!BUSY&&idle>2500)fail(m,null,'','断了，再说一次吧。');
    else if(BUSY&&idle>210000)fail(m,null,'','等太久了，没收到回应。');
  }catch(e){}
},1500);

function bgPick(){
  var f=document.createElement('input');
  f.type='file';f.accept='image/*';
  f.onchange=function(){
    var fl=f.files&&f.files[0];
    if(!fl)return;
    toast('正在处理…');
    shrink(fl,1600,0.85,function(u){
      if(!u){toast('这张读不出来');return;}
      dbPutRaw('pic','__bg',{d:u,ts:Date.now()}).then(function(){
        D.bgOn=1;
        if(D.bgv==null)D.bgv=45;
        BGDATA=u;
        bgSample(u,function(c){
          D.bgc=c||null;saveD();bgPaint();
          closeSheet(1);toast('换好了');});
      },function(){toast('存不下这张，换小一点的');});});};
  f.click();}
function bgOff(){
  D.bgOn=0;D.bgc=null;BGDATA=null;
  saveD();dbDel('pic','__bg');
  bgPaint();closeSheet(1);toast('撤下来了');}

function apiPing(){
  if(!D.apiUrl||!D.apiKey)return;
  var an=(D.fmt!=='openai');
  fetch(D.apiUrl,{method:'POST',
    headers:an?{'Content-Type':'application/json','x-api-key':D.apiKey,
      'anthropic-version':'2023-06-01'}
      :{'Content-Type':'application/json','Authorization':'Bearer '+D.apiKey},
    body:JSON.stringify({model:D.model,max_tokens:1,
      messages:[{role:'user',content:'hi'}]})})
  .then(function(r){
    if(r.ok){toast('连上了');return;}
    return r.text().then(function(t){
      var g=String(t).replace(/\s+/g,' ');
      if(r.status===401||r.status===403)g='密钥不对';
      else if(r.status===404)g='地址或模型名不对';
      else if(r.status===429)g='被限流了，钥匙是好的';
      else g=g.slice(0,52);
      toast(r.status+'：'+g);},
      function(){toast('没连上，返回 '+r.status);});
  },function(){toast('连不上。地址可能写错，或这家不许网页直连');});}

function shCtx(){
  var c=ctxInfo();
  var k=function(n){
    if(n>=1000000)return(Math.round(n/100000)/10)+'M';
    if(n>=1000)return(Math.round(n/100)/10)+'k';
    return String(n);};
  var uz;
  if(UZ.st===2){
    var p=Math.round(UZ.hit/Math.max(1,UZ.in)*100);
    uz=(p?('缓存命中 '+p+'%'):(UZ.w?'缓存刚存下，下轮开始省':'没走缓存'))
      +'　读入 '+k(UZ.in);}
  else if(UZ.st===4)uz='这个中转不支持缓存';
  else if(UZ.st===3)uz='这个中转不报用量';
  else if(UZ.st===1)uz='正在算';
  else uz='说一句话就知道';

    body:'<div class="cd"><div style="display:flex;align-items:baseline;gap:8px">'
  +'<b style="font:700 26px/1 -apple-system;letter-spacing:-.02em">'+c.use+'</b>'

  +'<div style="margin-top:9px;font-size:12.5px;color:var(--dim2)">大约 '
  +c.tok+' 个 token'+(c.im?('　·　带 '+c.im+' 张图'):'')
  +'　·　记忆 '+Math.min(MEMCAP,D.mems.length)+' 条</div>'

  +'<div class="fd"><input id="c-n" type="number" inputmode="numeric" value="'
  +c.cap+'"></div>'
  +'<div class="nt">再往前的不会发给我，但一条都没丢，要翻随时翻得到。'

function initial(s){
  var t=String(s||'').trim();
  if(!t)return'·';
  var m=t.match(/[\u4e00-\u9fa5\u3040-\u30ff]/);
  return m?m[0]:t.slice(0,1).toUpperCase();}
function decorate(){
  var box=msBox();
  if(!box||SEL)return;
  var list=[],ch=box.children,i;
  for(i=0;i<ch.length;i++){
    var el=ch[i];
    if(el.classList&&el.classList.contains('m'))list.push(el);}
  var prev='',pts=0;
  list.forEach(function(w){
    var id=(w.id||'').slice(2),m=find(id);
    if(!m||m.r==='quote'){prev='';return;}
    var mine=(m.r==='me');
    var side=mine?'me':'ai';
    var cont=(prev===side&&m.ts&&pts&&(m.ts-pts)<5*60000)?1:0;
    prev=side;pts=m.ts||0;
    if(w.dataset.av)return;
    var inn=w.querySelector('.in');
    if(!inn)return;
    w.dataset.av='1';
    if(cont)w.classList.add('cont');
    var u=mine?AVD.b:AVD.a;
    var av=document.createElement('div');
    av.className='mav';
    av.innerHTML=u?('<img src="'+u+'" alt="">')
      :('<i>'+esc(initial(mine?D.me:D.you))+'</i>');
    var sd=document.createElement('div');
    sd.className='mside';
    sd.appendChild(av);
    var tm=w.querySelector('.tm');
    if(tm){
      tm.parentNode.removeChild(tm);
      sd.appendChild(tm);}
    var nm=document.createElement('div');
    nm.className='mnm';
    nm.textContent=mine?D.me:D.you;
    var bd=document.createElement('div');
    bd.className='mbody';
    w.insertBefore(bd,inn);
    bd.appendChild(nm);
    bd.appendChild(inn);
    w.insertBefore(sd,mine?null:bd);
    if(mine)w.appendChild(sd);});}

var CODE=[],CN=0;
function inline(s){
  s=s.replace(/`([^`\n]+)`/g,function(m,c){
    return'<code>'+esc2(c)+'</code>';});
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]\n]{1,80})\]\((https?:\/\/[^\s)]{1,300})\)/g,
    function(m,t,u){
      return'<a href="'+esc2(u)+'" target="_blank" rel="noopener">'
        +t+'</a>';});
  s=s.replace(/(^|[\s(（])((?:https?:\/\/)[^\s<>"'）)]{4,300})/g,
    function(m,pre,u){
      if(/["'=]$/.test(pre))return m;
      return pre+'<a href="'+esc2(u)+'" target="_blank" rel="noopener">'
        +u+'</a>';});
  return s;}

function tableOf(rows){
  if(rows.length<2)return'';
  var cells=function(r){
    return r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|')
      .map(function(x){return x.trim();});};
  var head=cells(rows[0]),sep=cells(rows[1]);
  if(head.length<2)return'';
  var ok=1;
  sep.forEach(function(x){if(!/^:?-{2,}:?$/.test(x))ok=0;});
  if(!ok)return'';
  var h='<div class="tb"><table><thead><tr>';
  head.forEach(function(c){h+='<th>'+inline(esc2(c))+'</th>';});
  h+='</tr></thead><tbody>';
  rows.slice(2).forEach(function(r){
    var cs=cells(r);
    h+='<tr>';
    head.forEach(function(x,i){
      h+='<td>'+inline(esc2(cs[i]==null?'':cs[i]))+'</td>';});
    h+='</tr>';});
  return h+'</tbody></table></div>';}

function render(t){
  CODE=[];
  var src=String(t==null?'':t);
  src=src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g,function(m,lang,body){
    var i=CODE.length;
    CODE.push({lang:String(lang||'').trim(),body:body.replace(/\n$/,'')});
    return'\u0000C'+i+'\u0000';});
  var lines=src.split('\n'),out=[],i=0;
  var listTy='',listBuf=[];
  function flushList(){
    if(!listBuf.length)return;
    out.push('<'+listTy+'>'+listBuf.map(function(x){
      return'<li>'+x+'</li>';}).join('')+'</'+listTy+'>');
    listBuf=[];listTy='';}
  while(i<lines.length){
    var ln=lines[i],tr=ln.trim();
    var ph=tr.match(/^\u0000C(\d+)\u0000$/);
    if(ph){flushList();out.push('\u0000C'+ph[1]+'\u0000');i++;continue;}
    if(!tr){flushList();i++;continue;}
    if(/^\|.*\|/.test(tr)&&i+1<lines.length
      &&/^\|[\s:|-]+\|?\s*$/.test(lines[i+1].trim())){
      var rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){
        rows.push(lines[i]);i++;}
      var tb=tableOf(rows);
      if(tb){flushList();out.push(tb);continue;}
      i-=rows.length;}
    var hd=tr.match(/^(#{1,4})\s+(.+)$/);
    if(hd){flushList();out.push('<h3>'+inline(esc2(hd[2]))+'</h3>');i++;continue;}
    if(/^(---+|\*\*\*+|___+)$/.test(tr)){
      flushList();out.push('<hr>');i++;continue;}
    var q=tr.match(/^>\s?(.*)$/);
    if(q){
      flushList();
      var qb=[];
      while(i<lines.length){
        var qm=lines[i].trim().match(/^>\s?(.*)$/);
        if(!qm)break;
        qb.push(inline(esc2(qm[1])));i++;}
      out.push('<blockquote>'+qb.join('<br>')+'</blockquote>');
      continue;}
    var ul=tr.match(/^[-*+]\s+(.+)$/);
    if(ul){
      if(listTy&&listTy!=='ul')flushList();
      listTy='ul';listBuf.push(inline(esc2(ul[1])));i++;continue;}
    var ol=tr.match(/^\d{1,3}[.)]\s+(.+)$/);
    if(ol){
      if(listTy&&listTy!=='ol')flushList();
      listTy='ol';listBuf.push(inline(esc2(ol[1])));i++;continue;}
    flushList();
    var para=[];
    while(i<lines.length){
      var p=lines[i],pt=p.trim();
      if(!pt)break;
      if(/^\u0000C\d+\u0000$/.test(pt))break;
      if(/^(#{1,4}\s|>|[-*+]\s|\d{1,3}[.)]\s)/.test(pt))break;
      if(/^(---+|\*\*\*+|___+)$/.test(pt))break;
      if(/^\s*\|.*\|/.test(pt))break;
      para.push(inline(esc2(p)));i++;}
    if(para.length)out.push(para.join('<br>'));}
  flushList();
  var html=out.join('');
  html=html.replace(/\u0000C(\d+)\u0000/g,function(m,n){
    var c=CODE[+n];
    if(!c)return'';
    var id='cc'+(CN++);
    var lines2=c.body.split('\n').length;
    var big=(lines2>14||c.body.length>760);
    var isHtml=/^(html|xhtml)$/i.test(c.lang)
      ||/^\s*(<!doctype html|<html)/i.test(c.body);
    var h='<div class="cc'+(big?' fold':'')+'" id="'+id+'">'
     +'<div class="cch"><s>'+esc2(c.lang||'code')+'　'+lines2+' 行</s>'
     +(big?'<button class="pz" onclick="ccFold(\''+id+'\',this)">展开</button>':'')
     +'<button class="pz" onclick="ccCopy(\''+id+'\',this)">复制</button></div>'
     +'<div class="ccp">'+esc2(c.body)+'</div></div>';
    if(isHtml)h+='<button class="run pz" onclick="ccRun(\''+id+'\')">'
      +'跑一下看看</button>';
    return h;});
  return html;}

function jinaRead(url){
  var h={'Accept':'text/plain'};
  if(D.jkey)h['Authorization']='Bearer '+D.jkey;
  return fetch('https://r.jina.ai/'+url,{headers:h})
  .then(function(r){

    return r.text();})
  .then(function(t){
    t=String(t||'').replace(/\n{3,}/g,'\n\n').trim();
    return t.length>PAGECAP?(t.slice(0,PAGECAP)+'\n\n…（后面截掉了）'):t;});}
function googleSearch(q){
  if(!D.gkey||!D.gcx)return Promise.reject(new Error('没填搜索的钥匙'));
  var u='https://www.googleapis.com/customsearch/v1?key='+encodeURIComponent(D.gkey)
   +'&cx='+encodeURIComponent(D.gcx)+'&num='+WEBCAP
   +'&q='+encodeURIComponent(q);
  return fetch(u).then(function(r){
    if(!r.ok)return r.text().then(function(t){
      var g='';
      try{g=(JSON.parse(t).error||{}).message||'';}catch(e){}
      throw new Error(g?g.slice(0,60):('搜索失败 '+r.status));});
    return r.json();})
  .then(function(j){
    return(j.items||[]).slice(0,WEBCAP).map(function(x){
      return{t:x.title||'',u:x.link||'',s:x.snippet||''};});});}
