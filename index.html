html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}

.pz{transition:transform .12s ease,opacity .12s ease}

@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ══════════ 记忆：相似度 · 分级注入 ══════════ */
function bigr(s){
  var o=[],x=(s||'').toLowerCase().replace(/[\s，。、！？,.!?~…]/g,'');
  for(var i=0;i<x.length-1;i++)o.push(x.substr(i,2));
  return o;}
function ovl(a,b){
  var A=bigr(a),B={},n=0;
  bigr(b).forEach(function(x){B[x]=(B[x]||0)+1;});
  A.forEach(function(x){if(B[x]>0){n++;B[x]--;}});
  return n;}
function simRate(a,b){
  var la=bigr(a).length,lb=bigr(b).length;
  if(!la||!lb)return 0;
  return ovl(a,b)/Math.max(4,Math.min(la,lb));}
function dupOf(t,skipId){
  var best=null,bs=0;
  D.mems.forEach(function(m){
    if(m.del||m.id===skipId)return;
    var r=simRate(m.t,t);
    if(r>bs){bs=r;best=m;}});
  return bs>=0.56?{m:best,r:bs}:null;}
function live(){return D.mems.filter(function(m){return!m.del;});}
function pickMems(q){
  var ls=live();
  if(ls.length<=MEMCAP)return ls;
  var lk=[],rest=[];
  ls.forEach(function(m){(m.lock?lk:rest).push(m);});
  var now=Date.now();
  rest.forEach(function(m){
    var rel=q?ovl(m.t,q):0;
    var age=Math.max(0,1-(now-m.ts)/(120*MS));
    m._s=rel*5+(m.imp||2)*4+Math.min(8,(m.hits||0))+age*6;});
  rest.sort(function(a,b){return b._s-a._s;});
  return lk.concat(rest.slice(0,Math.max(0,MEMCAP-lk.length)));
}
function bump(ls){
  var now=Date.now();
  ls.forEach(function(m){m.hits=(m.hits||0)+1;m.used=now;});
}

var vv=window.visualViewport,root=document.getElementById('root'),de=document.documentElement;
var fullH=window.innerHeight,kbLast=parseInt(localStorage.getItem('us.kbH')||'0',10)||0,tw={raf:0,to:0};
function kbGap(){if(!vv)return 0;if(vv.height>fullH-60)fullH=Math.max(vv.height,window.innerHeight);
  return Math.round(fullH-vv.height);}
function lockEl(el,h,ot){if(!el)return;el.style.setProperty('height',h+'px','important');
  if(ot)el.style.setProperty('transform','translateY('+ot+'px)','important');else el.style.removeProperty('transform');}
function freeEl(el){if(!el)return;el.style.removeProperty('height');el.style.removeProperty('transform');}
function tween(el,to,ms,done){
  if(tw.raf&&Math.abs(tw.to-to)<2)return;
  cancelAnimationFrame(tw.raf);
  var from=el.getBoundingClientRect().height,t0=performance.now();tw.to=to;
  (function step(now){var p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);
    el.style.setProperty('height',Math.round(from+(to-from)*e)+'px','important');
    if(p<1)tw.raf=requestAnimationFrame(step);else{tw.raf=0;if(done)done();}})(performance.now());
}
function fit(){
  if(!vv)return;
  var gap=kbGap(),ot=Math.round(vv.offsetTop||0);
  var sh=document.getElementById('sh'),dw=document.getElementById('dw');
  if(gap>60){
    if(gap!==kbLast){kbLast=gap;try{localStorage.setItem('us.kbH',gap);}catch(e){}}
    cancelAnimationFrame(tw.raf);tw.raf=0;tw.to=0;de.classList.add('kbon');
    var h=Math.round(vv.height);lockEl(root,h,ot);lockEl(sh,h,ot);lockEl(dw,h,ot);
    if(CV==='chat')stick();
  }else{
    de.classList.remove('kbon');freeEl(sh);freeEl(dw);
    root.style.removeProperty('transform');
    tween(root,fullH,240,function(){freeEl(root);});
    if(window.scrollY)window.scrollTo(0,0);}
}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);}
window.addEventListener('focusin',function(e){
  if(!e.isTrusted)return;
  if(kbLast>60&&kbGap()<=60){
    de.classList.add('kbon');tween(root,fullH-kbLast,240);
    setTimeout(function(){if(kbGap()<=60){de.classList.remove('kbon');
      tween(root,fullH,200,function(){freeEl(root);});}},600);}
});
window.addEventListener('orientationchange',function(){
  setTimeout(function(){fullH=window.innerHeight;freeEl(root);de.classList.remove('kbon');},420);});
document.addEventListener('touchmove',function(e){
  if(DG){e.preventDefault();return;}
  var t=e.target;
  if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  var n=t;
  while(n&&n!==document.body&&n.nodeType===1){
    if(n.scrollHeight>n.clientHeight+1&&/(auto|scroll)/.test(getComputedStyle(n).overflowY))return;
    n=n.parentElement;}
  e.preventDefault();
},{passive:false});
function fitTa(el){
  var sc=el.parentElement,st=-1;
  while(sc&&sc!==document.body){
    if(sc.scrollHeight>sc.clientHeight+1&&/(auto|scroll)/.test(getComputedStyle(sc).overflowY)){st=sc.scrollTop;break;}
    sc=sc.parentElement;}
  el.style.height='auto';
  var cap=Math.round((vv?vv.height:window.innerHeight)*0.34);
  el.style.height=Math.min(el.scrollHeight+2,cap)+'px';
  if(sc&&st>=0&&sc.scrollTop!==st)sc.scrollTop=st;
}

function shrink(file,cb){
  var r=new FileReader();
  r.onerror=function(){cb(null);};
  r.onload=function(){
    var im=new Image();
    im.onerror=function(){cb(null);};
    im.onload=function(){
      var M=900,w=im.width,h=im.height;
      if(w>M||h>M){var s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.68));};
    im.src=r.result;};
  r.readAsDataURL(file);
}

function usPart(q){
  var u=['她叫'+D.me+'，你叫'+D.you+'。'];
  var dt=dayN();if(dt)u.push('今天是你们在一起的第 '+dt+' 天。');
  if(D.wall)u.push('她写在墙上的一句：'+D.wall);
  if(D.annis.length)u.push('纪念日：'+D.annis.map(function(x){var r=nextAn(x.date);
    return x.name+'（'+(r?(r.days===0?'就是今天':r.days+' 天后'):x.date)+'）';}).join('、'));
  var n=new Date(),w=['周日','周一','周二','周三','周四','周五','周六'];
  u.push('现在是 '+n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 '+w[n.getDay()]+' '+hm(Date.now())+'。');
  var s='【你们】\n'+u.join('\n');
  var ms=pickMems(q);
  if(ms.length){
    bump(ms);
    var by={};
    ms.forEach(function(m){var c=m.cat||'其它';(by[c]=by[c]||[]).push(m);});
    var out=[];
    CATS.concat(['其它']).forEach(function(c){
      if(!by[c])return;
      out.push('〈'+c+'〉');
      by[c].sort(function(a,b){return(b.imp||2)-(a.imp||2)||b.ts-a.ts;});
      by[c].forEach(function(m){
        out.push('· '+m.t+'（'+dlab(m.ts)+(m.imp===3?' · 要紧':'')+(m.lock?' · 她锁住了':'')+'）');});});
    s+='\n\n【你记得的事】\n'+out.join('\n');
    var tot=live().length;
    if(tot>ms.length)s+='\n（记忆库里还有 '+(tot-ms.length)+' 条没带上来。想不起细节就问她。）';
  }
  return s;
}
function staticPart(){

function ask(after){
  var s=S();BUSY=true;

  var m={id:uid(),r:'ai',t:'',k:'',st:1,ts:Date.now()};

    if(D.think)body.thinking={type:'enabled',budget_tokens:Math.max(1024,Math.min(mt-512,2048))};
    else body.temperature=Math.max(0,Math.min(1,D.temp==null?1:D.temp));
  }else body={model:D.model,stream:true,max_tokens:mt,

              :{'Content-Type':'application/json','Authorization':'Bearer '+D.apiKey},
    body:JSON.stringify(body)})
  .then(function(res){
    if(!res.ok)return res.text().then(function(t){throw new Error('接口返回 '+res.status+'：'+t.slice(0,140));});
    if(!res.body)return res.text().then(function(t){m.t=plain(t,an);});
    return pump(res,m,an);})
  .then(function(){done(m,after);})
  .catch(function(e){
    if(e&&e.name==='AbortError'){done(m,after,1);return;}
    var g=String(e&&e.message||e);
    if(/Failed to fetch|NetworkError|Load failed/i.test(g))

function plain(t,an){try{var j=JSON.parse(t);
  if(an)return(j.content||[]).map(function(b){return b.text||'';}).join('');
  var c=(j.choices||[])[0];return c&&c.message?c.message.content:'';}catch(e){return'';}}
function pump(res,m,an){
  var rd=res.body.getReader(),dec=new TextDecoder(),bf='';
  return(function read(){
    return rd.read().then(function(r){
      if(r.done)return;
      bf+=dec.decode(r.value,{stream:true});
      var ls=bf.split('\n');bf=ls.pop();
      ls.forEach(function(ln){
        ln=ln.trim();if(!ln||ln.slice(0,5)!=='data:')return;
        var d=ln.slice(5).trim();if(!d||d==='[DONE]')return;
        var j;try{j=JSON.parse(d);}catch(e){return;}
        if(an){
          if(j.type==='content_block_delta'&&j.delta){
            if(j.delta.type==='text_delta')m.t+=(j.delta.text||'');
            else if(j.delta.type==='thinking_delta')m.k+=(j.delta.thinking||'');
          }else if(j.type==='error'&&j.error)m.err=j.error.message||'接口报错';
        }else{
          var c=(j.choices||[])[0];
          if(c&&c.delta){
            if(c.delta.content)m.t+=c.delta.content;
            if(c.delta.reasoning_content)m.k+=c.delta.reasoning_content;}
        }});
      if(m.k&&!m._ks){m._ks=1;paint();}
      var el=document.getElementById('b-'+m.id);
      if(el){el.innerHTML=md(m.t);stick();}
      return read();});})();
}
function done(m,after,ab){
  m.st=0;delete m._ks;BUSY=false;ABORT=null;

function parseDate(s){
  s=(s||'').replace(/\s/g,'');if(!s)return null;
  var t=today(),y=t.getFullYear(),m;
  if(/^(今天|today)$/i.test(s))return{a:d0(t),b:d0(t)+MS,lab:'今天'};
  if(/^昨天$/.test(s))return{a:d0(t)-MS,b:d0(t),lab:'昨天'};
  if(/^前天$/.test(s))return{a:d0(t)-2*MS,b:d0(t)-MS,lab:'前天'};
  m=s.match(/^(\d+)天前$/);
  if(m){var n=+m[1];return{a:d0(t)-n*MS,b:d0(t)-(n-1)*MS,lab:n+'天前'};}
  if(/^(这周|本周)$/.test(s)){var w=(t.getDay()+6)%7;return{a:d0(t)-w*MS,b:d0(t)+MS,lab:'这周'};}
  if(/^上周$/.test(s)){var w2=(t.getDay()+6)%7,b=d0(t)-w2*MS;return{a:b-7*MS,b:b,lab:'上周'};}
  if(/^(这个月|本月)$/.test(s))return{a:new Date(y,t.getMonth(),1).getTime(),b:d0(t)+MS,lab:'这个月'};
  if(/^(上个月|上月)$/.test(s))return{a:new Date(y,t.getMonth()-1,1).getTime(),
    b:new Date(y,t.getMonth(),1).getTime(),lab:'上个月'};
  m=s.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){var d=new Date(+m[1],+m[2]-1,+m[3]);return{a:d0(d),b:d0(d)+MS,lab:dlab(d.getTime())};}
  m=s.match(/^(\d{4})[-\/年](\d{1,2})月?$/);
  if(m)return{a:new Date(+m[1],+m[2]-1,1).getTime(),b:new Date(+m[1],+m[2],1).getTime(),
    lab:m[1]+'年'+(+m[2])+'月'};
  m=s.match(/^(\d{1,2})[-\/月](\d{1,2})日?$/);
  if(m){var d2=new Date(y,+m[1]-1,+m[2]);

    if(hit){sc+=3;return;}
    if(W.length>=2)for(var i=0;i<W.length-1;i++)
      if(low.indexOf(W.substr(i,2))>=0){sc+=1;break;}});
  return sc;

       +'<div class="rb">'+hi(x.t,sp.kw)+'</div>'
       +'<div class="ra"><button onclick="view(\'mem\')">去记忆库</button></div></div>';});
    h+='<div class="lbs" style="margin-top:16px">对话</div>';}
  if(!res.length&&!mres.length)
    h+='<div class="empty">'+(FQ.trim()?'没找到。<br>换个说法，或者只搜日期试试。':'还没有可以翻的东西。')+'</div>';
  res.slice(0,60).forEach(function(r){
    var pv=r.s.ms[r.i+1]&&r.s.ms[r.i+1].t?r.s.ms[r.i+1]:(r.s.ms[r.i-1]&&r.s.ms[r.i-1].t?r.s.ms[r.i-1]:null);
    h+='<div class="res"><div class="rh"><span class="rt">'+esc(r.s.ti||'对话')+' · '+dtl(r.m.ts)+'</span>'
     +'<span class="who">'+(r.m.r==='me'?esc(D.me):esc(D.you))+'</span></div>'
     +'<div class="rb">'+hi(cut(r.m.t,sp.kw),sp.kw)+'</div>'
     +(pv?'<div class="rc">'+esc((pv.r==='me'?D.me:D.you)+'：'+cut(pv.t,[],80))+'</div>':'')

     +'<button class="g" onclick="quoteIn(\''+r.s.id+'\',\''+r.m.id+'\')">带进现在的对话</button></div></div>';});
  box.innerHTML=h;box.scrollTop=0;

function jump(sid,mid){
  var i=-1;D.sess.forEach(function(s,j){if(s.id===sid)i=j;});
  if(i<0){toast('那段对话已经不在了');return;}
  D.cur=i;save();view('chat');
  setTimeout(function(){
    var el=document.getElementById('m-'+mid);
    if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');}
    else toast('那条消息已经不在了');},130);
}
function quoteIn(sid,mid){
  var s0=null;D.sess.forEach(function(s){if(s.id===sid)s0=s;});
  if(!s0)return;
  var i=-1;s0.ms.forEach(function(m,j){if(m.id===mid)i=j;});
  if(i<0)return;
  var seg=s0.ms.slice(Math.max(0,i-1),Math.min(s0.ms.length,i+2))
    .filter(function(m){return m.t&&m.r!=='quote';});
  var txt=seg.map(function(m){return(m.r==='me'?D.me:D.you)+'：'+m.t;}).join('\n');
  S().ms.push({id:uid(),r:'quote',t:txt,
    from:(s0.ti||'以前')+' · '+dlab(seg.length?seg[0].ts:Date.now()),ts:Date.now()});
  save();view('chat');toast('带进来了');
}

var MQ='',MCAT='';
function vMem(){
  return'<div class="vw">'
  +'<div class="hd"><button class="cb pz" onclick="drawer(1)">'+I.menu+'</button>'
  +'<span class="hdt">记忆库</span>'
  +'<button class="cb pz" onclick="editMem()">'+I.plus+'</button></div>'
  +'<div class="sbox" id="msb"></div>'
  +'<div class="chips" id="mch"></div>'
  +'<div class="sa" id="mls" style="flex:1;min-height:0;padding:0 calc(20px + var(--sr)) 24px calc(20px + var(--sl))"></div>'
  +'</div>';
}
function drawMem(){
  var q=document.getElementById('mq');if(q)MQ=q.value;
  var ls=live(),tr=D.mems.filter(function(m){return m.del;});
  var sb=document.getElementById('msb');
  if(sb)sb.innerHTML=(ls.length>5)
    ?'<div class="w">'+I.sr+'<input id="mq" value="'+esc(MQ)+'" placeholder="找一条" oninput="drawMem()"></div>':'';
  var ch=document.getElementById('mch');
  if(ch){
    var cs='<button class="pz'+(MCAT===''?' on':'')+'" onclick="mcat(\'\')">全部 '+ls.length+'</button>';
    CATS.forEach(function(c,i){
      var n=ls.filter(function(m){return m.cat===c;}).length;
      if(!n&&MCAT!==c)return;
      cs+='<button class="pz'+(MCAT===c?' on':'')+'" onclick="mcat('+i+')">'+c+' '+n+'</button>';});
    var nn=ls.filter(function(m){return!m.cat;}).length;
    if(nn)cs+='<button class="pz'+(MCAT==='_n'?' on':'')+'" onclick="mcat(\'_n\')">没分类 '+nn+'</button>';
    if(tr.length)cs+='<button class="pz tr'+(MCAT==='_t'?' on':'')+'" onclick="mcat(\'_t\')">回收站 '+tr.length+'</button>';
    ch.innerHTML=cs;
    ch.style.display=(ls.length||tr.length)?'flex':'none';}
  var box=document.getElementById('mls');if(!box)return;
  if(!D.mems.length){
    box.innerHTML='<div class="empty">还没有记住的事。<br>右上角加一条，'
    +'或者在任何一条消息的 ⋯ 里选「记进记忆库」。</div>';return;}
  if(MCAT==='_t'){
    var h2='<div class="lbs" style="padding-top:2px">删掉的会留 '+TRASHDAY+' 天'
     +(tr.length?'　·　<span onclick="emptyTrash()" style="color:#C0564C">全部清空</span>':'')+'</div>';
    if(!tr.length)h2+='<div class="empty">回收站是空的。</div>';
    tr.sort(function(a,b){return b.del-a.del;});
    tr.forEach(function(m){
      var left=TRASHDAY-Math.floor((Date.now()-m.del)/MS);
      h2+='<div class="mcd gr"><div class="t">'+esc(m.t)+'</div>'
      +'<div class="f"><div class="ts">'+ago(m.del)+'删的 · 还剩 '+Math.max(0,left)+' 天</div>'
      +'<div class="a"><button class="pz r" onclick="unDel(\''+m.id+'\')">恢复</button>'
      +'<button class="pz" onclick="hardDel(\''+m.id+'\')">彻底删</button></div></div></div>';});
    box.innerHTML=h2;box.scrollTop=0;return;}
  var sp=splitQ(MQ);
  var fl=ls.filter(function(m){
    if(MCAT==='_n'&&m.cat)return false;
    if(MCAT&&MCAT!=='_n'&&m.cat!==MCAT)return false;
    if(sp.dr&&!(m.ts>=sp.dr.a&&m.ts<sp.dr.b))return false;
    return score(m.t,sp.kw)>0;});
  fl.sort(function(a,b){return(b.lock?1:0)-(a.lock?1:0)||(b.imp||2)-(a.imp||2)||b.ts-a.ts;});
  var h='<div class="lbs" style="padding-top:2px">'+fl.length+' 条'
   +(ls.length>MEMCAP?'　·　每次说话带最相关的 '+MEMCAP+' 条给我':'　·　全部都会带给我')+'</div>';
  if(!fl.length)h+='<div class="empty">这里没有。</div>';
  fl.forEach(function(m){
    var im='';
    for(var i=1;i<=3;i++)im+='<i'+(i<=(m.imp||2)?' class="on"':'')+'></i>';
    h+='<div class="mcd'+(m.lock?' lk':'')+'">'
     +'<div class="t pz" onclick="editMem(\''+m.id+'\')">'+hi(m.t,sp.kw)+'</div>'
     +'<div class="mt">'
     +(m.cat?'<span class="tag ct">'+esc(m.cat)+'</span>':'')
     +'<span class="tag '+(m.src==='ai'?'ai':'me')+'">'+(m.src==='ai'?'我记的':'你记的')+'</span>'
     +(m.lock?'<span class="tag lk">锁住了</span>':'')
     +'<span class="imp">'+im+'</span></div>'
     +'<div class="f"><div class="ts">'+dtl(m.ts)
     +(m.from&&m.from.sid?' · <b onclick="memJump(\''+m.id+'\')">看原话</b>':'')
     +(m.hits>2?' · 用过 '+m.hits+' 次':'')+'</div>'
     +'<div class="a"><button class="pz'+(m.lock?' r':'')+'" onclick="lockMem(\''+m.id+'\')">'
     +(m.lock?'已锁':'锁')+'</button>'
     +'<button class="pz" onclick="editMem(\''+m.id+'\')">改</button>'
     +'<button class="pz" onclick="delMem(\''+m.id+'\')">删</button></div></div></div>';});
  box.innerHTML=h;
}
function mcat(c){
  MCAT=(typeof c==='number')?CATS[c]:c;
  if(MCAT===MCATLAST)MCAT='';
  MCATLAST=MCAT;
  drawMem();
}
var MCATLAST='';
function memById(id){var r=null;D.mems.forEach(function(m){if(m.id===id)r=m;});return r;}
function memJump(id){

var EDCAT='',EDIMP=2;
function editMem(id,pre,from){
  var m=id?memById(id):null;

  CATS.forEach(function(c,i){
    cb+='<button class="pz'+(EDCAT===c?' on':'')+'" onclick="pkCat('+i+')">'+c+'</button>';});
  var ib='';
  IMPS.forEach(function(x,i){
    ib+='<button class="pz'+(EDIMP===i+1?' on':'')+'" onclick="pkImp('+(i+1)+')">'+x+'</button>';});
  sheet({title:m?'改一条':'记住一件事',ok:'保存',
    body:'<div class="fd"><textarea id="mt" style="min-height:150px" placeholder="想让我一直记着的事">'
      +esc(m?m.t:(pre||''))+'</textarea></div>'
    +'<div class="lbs">归到哪儿</div><div class="segw" id="e-cat">'+cb+'</div>'
    +'<div class="lbs">有多要紧</div><div class="seg" id="e-imp">'+ib+'</div>'
    +(m?'<div class="nt">记于 '+dtl(m.ts)+(m.et?'　·　改过 '+ago(m.et):'')+'</div>':''),
    onOk:function(){
      var t=val('mt');
      if(!t){toast('还没写');return false;}
      if(m){
        snapMems('改了一条记忆');
        m.t=t;m.cat=EDCAT;m.imp=EDIMP;m.et=Date.now();
        save();closeSheet(1);
        if(CV==='mem')drawMem();else view('mem');
        return'done';}
      var dp=dupOf(t);
      if(dp){
        closeSheet(1);
        sheet({title:'这条好像记过了',
          body:'<div class="lbs">已经记着的</div>'
        +'<div class="mcd"><div class="t">'+esc(dp.m.t)+'</div>'
        +'<div class="f"><div class="ts">'+dtl(dp.m.ts)+'</div></div></div>'
        +'<div class="lbs" style="margin-top:14px">你要记的</div>'
        +'<div class="mcd"><div class="t">'+esc(t)+'</div></div>'
        +'<div class="cd cd0" style="margin-top:14px">'
        +'<div class="rw pz" onclick="memReplace(\''+dp.m.id+'\')"><span class="l">用新的换掉旧的</span>'+I.chevD+'</div>'
        +'<div class="rw pz" onclick="memAdd()"><span class="l">两条都留着</span>'+I.chevD+'</div>'
        +'<div class="rw pz" onclick="closeSheet()"><span class="l" style="color:var(--dim)">算了，不记</span>'+I.chevD+'</div>'
        +'</div>'});
        PEND={t:t,cat:EDCAT,imp:EDIMP,from:from||null};
        return'done';}
      addMem(t,EDCAT,EDIMP,'me',from);
      closeSheet(1);
      if(CV==='mem')drawMem();else view('mem');
      return'done';}});
}
var PEND=null;
function pkCat(i){
  EDCAT=(i<0)?'':CATS[i];
  var w=document.getElementById('e-cat');if(!w)return;
  [].forEach.call(w.children,function(b,j){
    b.className='pz'+(((j===0&&EDCAT==='')||(j>0&&CATS[j-1]===EDCAT))?' on':'');});
}
function pkImp(v){
  EDIMP=v;
  var w=document.getElementById('e-imp');if(!w)return;
  [].forEach.call(w.children,function(b,j){b.className='pz'+(j+1===v?' on':'');});
}
function addMem(t,cat,imp,src,from){
  D.mems.unshift({id:uid(),t:t,cat:cat||'',imp:imp||2,lock:0,src:src||'me',
    ts:Date.now(),hits:0,from:from||null});
  save();
}
function memAdd(){
  if(!PEND)return closeSheet();
  addMem(PEND.t,PEND.cat,PEND.imp,'me',PEND.from);PEND=null;
  closeSheet(1);if(CV==='mem')drawMem();else view('mem');
  toast('两条都留着了');
}
function memReplace(id){
  if(!PEND)return closeSheet();
  var m=memById(id);
  if(m){snapMems('换掉了一条记忆');m.t=PEND.t;m.cat=PEND.cat;m.imp=PEND.imp;m.et=Date.now();
    if(PEND.from)m.from=PEND.from;}
  PEND=null;save();closeSheet(1);
  if(CV==='mem')drawMem();else view('mem');
  toast('换好了');
}
function lockMem(id){
  var m=memById(id);if(!m)return;
  m.lock=m.lock?0:1;save();drawMem();
}
function delMem(id){
  var m=memById(id);if(!m)return;
  snapMems('删了「'+m.t.slice(0,12)+(m.t.length>12?'…':'')+'」');
  m.del=Date.now();save();drawMem();
}
function unDel(id){
  var m=memById(id);if(!m)return;
  delete m.del;save();drawMem();toast('回来了');
}
function hardDel(id){
  var m=memById(id);if(!m)return;
  sheet({title:'彻底删掉',body:'<div class="cd" style="font-size:14px;line-height:1.75">'
  +esc(m.t)+'</div><div class="nt" style="color:#B5514A;padding-bottom:10px">删了就真的没有了。</div>',
    ok:'确认',onOk:function(){
      D.mems=D.mems.filter(function(x){return x.id!==id;});
      save();closeSheet(1);drawMem();toast('删掉了');return'done';}});

function emptyTrash(){
  var n=D.mems.filter(function(m){return m.del;}).length;

function renderList(){

    return'<div class="it'+(i===D.cur&&!EDIT?' on':'')+'" data-i="'+i+'">'

function endEdit(){EDIT=0;DG=null;renderList();}
function delSessAt(i){
  D.sess.splice(i,1);
  if(!D.sess.length)D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now()}];
  if(D.cur>=D.sess.length)D.cur=D.sess.length-1;
  save();renderList();
  if(CV==='chat'){paint();btn();}
}
function bindList(){
  var ls=document.getElementById('sls');if(!ls)return;
  var tm=null,sy=0,si=-1,hh=46,moved=0;
  ls.addEventListener('touchstart',function(e){
    if(e.target.closest('.dl'))return;
    var it=e.target.closest('.it');if(!it)return;
    si=+it.dataset.i;sy=e.touches[0].clientY;hh=it.offsetHeight+2;moved=0;
    clearTimeout(tm);
    tm=setTimeout(function(){
      EDIT=1;renderList();vib(14);
      var el=document.querySelector('#sls .it[data-i="'+si+'"]');
      if(el){DG={i:si,h:hh,dy:0,el:el};el.classList.add('dg');}},430);
  },{passive:true});
  ls.addEventListener('touchmove',function(e){
    var dy=e.touches[0].clientY-sy;
    if(Math.abs(dy)>9)moved=1;
    if(!DG){if(moved)clearTimeout(tm);return;}
    e.preventDefault();DG.dy=dy;
    DG.el.style.transform='translateY('+dy+'px) scale(1.02)';
    var sh=Math.round(dy/DG.h),to=Math.max(0,Math.min(D.sess.length-1,DG.i+sh));
    [].forEach.call(document.querySelectorAll('#sls .it'),function(el){
      var j=+el.dataset.i;if(j===DG.i)return;
      var t=0;
      if(to>DG.i&&j>DG.i&&j<=to)t=-DG.h;
      if(to<DG.i&&j<DG.i&&j>=to)t=DG.h;
      el.style.transform=t?'translateY('+t+'px)':'';});
  },{passive:false});
  ls.addEventListener('touchend',function(e){
    clearTimeout(tm);
    if(!DG){
      if(!EDIT&&si>=0&&!moved&&!e.target.closest('.dl'))pickSess(si);
      return;}
    var sh=Math.round(DG.dy/DG.h),from=DG.i;
    var to=Math.max(0,Math.min(D.sess.length-1,from+sh));
    DG=null;
    if(to!==from){
      var cu=D.sess[D.cur],it=D.sess.splice(from,1)[0];
      D.sess.splice(to,0,it);D.cur=D.sess.indexOf(cu);save();vib(10);}
    renderList();
  });
}
function nav(v){drawer(0);if(v!==CV)view(v);}
function pickSess(i){
  if(EDIT)return;
  if(BUSY)stop();
  D.cur=i;save();drawer(0);DRAFT='';ATT=[];SEL=null;view('chat');
}
function newSess(){
  if(CV==='chat'&&S().ms.length===0){drawer(0);toast('这段还是空的');return;}
  if(BUSY)stop();
  D.sess.unshift({id:uid(),ti:'新的对话',ms:[],at:Date.now()});
  D.cur=0;DRAFT='';ATT=[];SEL=null;save();drawer(0);view('chat');
}

/* ═════ 面板 ═════ */
var SHOK=null;
function sheet(o){
  closeSheet(1);
  var d=document.createElement('div');d.id='sh';if(o.full)d.className='full';
  d.innerHTML='<div class="ov" onclick="closeSheet()"></div><div class="pn">'
  +(o.full?'':'<div class="gb"></div>')
  +'<div class="st"><div class="tt">'+esc(o.title||'')+'</div>'
  +(o.ok?'<button class="ok pz" onclick="__ok()">'+esc(o.ok)+'</button>':'')
  +(o.close?'<button class="cx pz" onclick="closeSheet()">'+I.x+'</button>':'')
  +'</div><div class="bdy sa">'+(o.body||'')+'</div></div>';
  document.body.appendChild(d);
  SHOK=o.onOk||null;
  if(vv&&kbGap()>60)lockEl(d,Math.round(vv.height),Math.round(vv.offsetTop||0));
}
function __ok(){if(!SHOK)return closeSheet();var r=SHOK();if(r===false)return;
  if(r!=='done'){closeSheet();view(CV);}}
function closeSheet(now){
  var s=document.getElementById('sh');if(!s)return;
  var a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))a.blur();
  SHOK=null;PEND=null;
  if(now){s.remove();return;}
  setTimeout(function(){if(s.parentNode)s.remove();},kbGap()>60?260:0);
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function shUs(){sheet({title:'我们',ok:'记下',
  body:'<div class="fd"><input type="date" id="u-s" value="'+esc(D.start)+'"></div>'
+'<div class="fd"><input id="u-m" placeholder="我叫" value="'+esc(D.me)+'"></div>'
+'<div class="fd"><input id="u-y" placeholder="你叫" value="'+esc(D.you)+'"></div>',
  onOk:function(){D.start=val('u-s');D.me=val('u-m')||'我';D.you=val('u-y')||'你';save();}});}
function shWall(){sheet({title:'写在墙上',ok:'挂上',
  body:'<div class="fd"><textarea id="w" placeholder="一句就够了">'+esc(D.wall)+'</textarea></div>',
  onOk:function(){D.wall=val('w');save();}});}
function shAnni(){
  var ls=D.annis.map(function(a){var r=nextAn(a.date);
    return'<div class="rw"><div><div class="l">'+esc(a.name)+'</div>'
    +'<div style="font-size:12px;color:var(--dim2);margin-top:3px">'+esc(a.date)+'</div></div>'
    +'<div style="text-align:right"><div style="color:var(--rose);font-weight:600">'
    +(r?(r.days===0?'今天':r.days+'天'):'—')+'</div>'
    +'<button class="pz" style="font-size:12px;color:var(--dim2);margin-top:2px" onclick="delAnni(\''+a.id+'\')">删掉</button></div></div>';}).join('');
  sheet({title:'纪念日',ok:'添加',
    body:(ls?'<div class="cd cd0">'+ls+'</div>':'')
  +'<div class="fd" style="margin-top:6px"><input id="a-n" placeholder="叫什么"></div>'
  +'<div class="fd"><input type="date" id="a-d"></div>',
    onOk:function(){var n=val('a-n'),d=val('a-d');
      if(!n||!d){toast('名字和日期都要有');return false;}
      D.annis.push({id:uid(),name:n,date:d});save();}});
}
function delAnni(id){D.annis=D.annis.filter(function(x){return x.id!==id;});save();shAnni();}
function shStyle(){sheet({title:'语气',ok:'保存',
  body:'<div class="fd"><input id="s-n" placeholder="起个名字（可以空着）" value="'+esc(D.style)+'"></div>'
+'<div class="fd"><textarea id="s-c" style="min-height:190px" placeholder="你想我怎么跟你说话">'+esc(D.styleText)+'</textarea></div>',
  onOk:function(){D.style=val('s-n');D.styleText=val('s-c');save();}});}
function shPersona(){sheet({title:'人设',ok:'保存',
  body:'<div class="fd"><textarea id="p" style="min-height:260px" placeholder="你希望我是什么样的人">'+esc(D.persona)+'</textarea></div>',
  onOk:function(){D.persona=val('p');save();}});}
function shModel(){
  var ls=D.models.map(function(m){
    return'<div class="rw"><span class="l pz" style="flex:1;font-weight:400;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="useModel(\''+esc(m)+'\')">'+esc(m)+'</span>'
    +(m===D.model?'<span style="font-size:12px;color:var(--rose);flex:none">在用</span>':'')
    +'<button class="pz" style="font-size:12.5px;color:var(--dim2);flex:none" onclick="delModel(\''+esc(m)+'\')">删</button></div>';}).join('');
  sheet({title:'模型',ok:'用它',
    body:'<div class="lbs">当前模型</div>'
  +'<div class="fd"><input id="m-n" placeholder="照中转的写法填" value="'+esc(D.model)+'"></div>'
  +'<button class="rw pz" style="width:100%;background:#FFF;border:1px solid #EDE9E0;border-radius:15px;margin-bottom:16px" onclick="addModel()">'
  +'<span class="l" style="color:var(--rose)">＋ 存进常用</span></button>'
  +(ls?'<div class="lbs">常用模型</div><div class="cd cd0">'+ls+'</div>':''),
    onOk:function(){var v=val('m-n');if(v)D.model=v;save();}});
}
function addModel(){
  var v=val('m-n');if(!v){toast('先填模型名');return;}
  if(D.models.indexOf(v)<0)D.models.unshift(v);
  D.model=v;save();shModel();toast('存好了');
}
function useModel(m){D.model=m;save();shModel();}
function delModel(m){D.models=D.models.filter(function(x){return x!==m;});save();shModel();}
function shGen(){
  sheet({title:'温度和长度',ok:'保存',
    body:'<div class="lbs">温度 · 越高我越放得开</div>'
  +'<div class="cd"><input type="range" id="g-t" min="0" max="1" step="0.05" value="'+(D.temp==null?1:D.temp)+'" oninput="document.getElementById(\'gt\').textContent=this.value">'
  +'<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim2)">'
  +'<span>稳</span><span id="gt" style="color:var(--ink2);font-weight:600">'+(D.temp==null?1:D.temp)+'</span><span>野</span></div></div>'
  +'<div class="lbs" style="margin-top:16px">一次最多说多长</div>'
  +'<div class="fd"><input id="g-m" type="number" inputmode="numeric" value="'+(D.maxTok||2048)+'"></div>'
  +'<div class="cd cd0"><div class="sw" onclick="tgThink(this)"><span class="l">让我先想一会儿</span>'
  +'<span class="k'+(D.think?' on':'')+'"><i></i></span></div></div>'
  +'<div class="nt">开着思维链的时候温度不生效。很多中转不支持，报错就关掉。'
  +'「往前记得多少条」挪到聊天页顶上那个按钮里了。</div>',
    onOk:function(){
      var t=parseFloat(val('g-t'));if(!isNaN(t))D.temp=t;
      var m=parseInt(val('g-m'),10);if(m)D.maxTok=Math.max(256,Math.min(8192,m));
      save();}});
}
function tgThink(el){D.think=D.think?0:1;el.querySelector('.k').className='k'+(D.think?' on':'');}
function shApi(){
  sheet({title:'中转设置',ok:'保存',
    body:'<div class="seg"><button id="f-a" class="'+(D.fmt!=='openai'?'on':'')+'" onclick="pickFmt(\'anthropic\')">Anthropic</button>'
  +'<button id="f-o" class="'+(D.fmt==='openai'?'on':'')+'" onclick="pickFmt(\'openai\')">OpenAI 兼容</button></div>'
  +'<div class="fd"><input id="k-u" placeholder="'+(D.fmt==='openai'?'https://…/v1/chat/completions':'https://…/v1/messages')+'" value="'+esc(D.apiUrl)+'"></div>'
  +'<div class="fd"><input id="k-k" type="password" placeholder="密钥 sk-…" value="'+esc(D.apiKey)+'"></div>'
  +'<div class="nt">中转能看到我们的对话原文。key 只存在这台手机。</div>',
    onOk:function(){D.apiUrl=val('k-u');D.apiKey=val('k-k');save();toast(D.apiKey?'连上了':'存好了');}});
}
function pickFmt(f){
  D.fmt=f;
  document.getElementById('f-a').className=(f!=='openai'?'on':'');
  document.getElementById('f-o').className=(f==='openai'?'on':'');
  var u=document.getElementById('k-u');
  if(u)u.placeholder=f==='openai'?'https://…/v1/chat/completions':'https://…/v1/messages';
}
function shRestore(){
  sheet({title:'恢复',body:'<div class="cd cd0">'
  +'<div class="rw pz" onclick="impFile()"><span class="l">选一个备份文件</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="bkIn()"><span class="l">粘贴备份内容</span>'+I.chevD+'</div></div>'
  +'<div class="nt">恢复会覆盖现在的全部内容。建议先导出一份现在的。</div>'});
}
function shSess(){
  sheet({title:'这段对话',body:'<div class="cd cd0">'
  +'<div class="rw pz" onclick="renSess()"><span class="l">改个名字</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="copyChat()"><span class="l">复制整段</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="clearChat()"><span class="l">清空消息</span>'+I.chevD+'</div>'
  +'<div class="rw pz" onclick="delSess()"><span class="l" style="color:#C0564C">删掉这段对话</span>'+I.chevD+'</div>'
  +'</div>'});
}
function renSess(){sheet({title:'改名字',ok:'好',
  body:'<div class="fd"><input id="r-t" value="'+esc(S().ti||'')+'"></div>',
  onOk:function(){S().ti=val('r-t')||'新的对话';save();}});}
function copyChat(){
  var s=S();if(!s.ms.length){toast('还没有内容');return;}
  clip(s.ms.filter(function(m){return m.t;}).map(function(m){
    return(m.r==='ai'?D.you:D.me)+'：'+m.t;}).join('\n\n'),
    function(){toast('整段复制好了');});
  closeSheet();
}
function clearChat(){if(BUSY)stop();S().ms=[];save();closeSheet(1);view('chat');toast('清空了');}
function delSess(){
  if(BUSY)stop();
  D.sess.splice(D.cur,1);
  if(!D.sess.length)D.sess=[{id:uid(),ti:'新的对话',ms:[],at:Date.now()}];
  D.cur=0;save();closeSheet(1);view('chat');toast('删了');
}
function bkIn(){sheet({title:'粘贴恢复',ok:'恢复',
  body:'<div class="fd"><textarea id="b-k" style="min-height:200px;font-size:12px" placeholder="把备份内容粘进来。会覆盖现在的全部内容。"></textarea></div>',
  onOk:function(){if(takeIn(val('b-k')))return'done';return false;}});}
function lockNow(){if(BUSY)stop();sessionStorage.removeItem('us.ok');location.reload();}
</script>
